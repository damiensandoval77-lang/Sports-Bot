name: Assist V2 research validation
on:
  pull_request:
    paths:
      - 'iphone_bot/assist_v2_*.py'
      - 'iphone_bot/tests/test_assist_v2_*.py'
      - '.github/workflows/assist-v2-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax and unit tests
        run: |
          python -m py_compile iphone_bot/assist_v2_research.py iphone_bot/assist_v2_backtest.py iphone_bot/assist_v2_shadow_capture.py
          python -m unittest discover -s iphone_bot/tests -p 'test_assist_v2_*.py' -v
      - name: Download historical player-game logs for expected minutes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -u iphone_bot/fetch_current_form.py
      # Refresh the paired research comparison after the latest successful main-branch settlement.
      - name: Paired retrospective comparison
        run: python -m iphone_bot.assist_v2_backtest
      - name: Require genuine paired coverage
        run: |
          python - <<'PY'
          import json
          r=json.load(open('docs/assist_v2_backtest.json'))
          assert r['baseline']['observations'] > 0, 'No paired V2 forecasts; fail instead of reporting green success'
          assert r['baseline']['observations'] == r['v2']['observations']
          print('Paired assist V2 comparisons:',r['v2']['observations'])
          PY
      - name: Verify shadow settlement imports and invariants
        run: |
          python - <<'PY'
          from iphone_bot.assist_v2_shadow_capture import grade,summary
          assert summary([])['hit_rate'] is None
          assert summary([])['research_only'] is True
          print('Research-only shadow settlement ready; no historical backfill')
          PY
      - name: Upload retrospective report without changing production
        uses: actions/upload-artifact@v4
        with:
          name: assist-v2-retrospective
          path: docs/assist_v2_backtest.json
