name: Assist V2 research validation
on:
  pull_request:
    paths:
      - 'iphone_bot/assist_v2_*.py'
      - 'iphone_bot/tests/test_assist_v2_*.py'
      - '.github/workflows/assist-v2-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax and unit tests
        run: |
          python -m py_compile iphone_bot/assist_v2_research.py iphone_bot/assist_v2_backtest.py iphone_bot/assist_v2_shadow_capture.py
          python -m unittest discover -s iphone_bot/tests -p 'test_assist_v2_*.py' -v
      - name: Paired retrospective comparison
        run: python -m iphone_bot.assist_v2_backtest
      - name: Upload retrospective report without changing production
        uses: actions/upload-artifact@v4
        with:
          name: assist-v2-retrospective
          path: docs/assist_v2_backtest.json
