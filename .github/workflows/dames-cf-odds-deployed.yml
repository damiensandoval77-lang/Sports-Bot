name: Verify Cloudflare Odds API market staging is publicly deployed
on:
  push:
    branches: [main]
    paths:
      - "cloudflare/dames-picks/src/odds-*.js"
      - "cloudflare/dames-picks/src/worker.js"
      - "cloudflare/dames-picks/static/market-explorer.*"
      - "cloudflare/dames-picks/scripts/build-assets.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-cloudflare:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Probe the actual staging site, catalogue, disabled spending, D1 board
        run: python tests/audit_dames_cf_odds_deployed.py
