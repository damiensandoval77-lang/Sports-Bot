name: Verify deployed Cloudflare Dame's Picks staging
on:
  pull_request:
    paths:
      - "scripts/check_dames_cf_stage.py"
      - ".github/workflows/dames-cf-stage-live-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-staging-url:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify the actual Cloudflare workers.dev URL, readiness, static data and original bot workspaces
        run: python scripts/check_dames_cf_stage.py
