name: Verify deployed Cloudflare Dame's Picks staging
on:
  pull_request:
    paths:
      - "scripts/check_dames_cf_stage.py"
      - "scripts/check_dames_cf_stage_browser.py"
      - ".github/workflows/dames-cf-stage-live-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-staging-url:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify the actual Cloudflare workers.dev URL, readiness, static data and original bot workspaces
        run: python scripts/check_dames_cf_stage.py
      - name: Install browser smoke dependencies
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium webkit
      - name: Test actual Cloudflare site at phone and desktop widths
        run: python scripts/check_dames_cf_stage_browser.py
      - name: Preserve actual deployed screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dames-cloudflare-staging-live-screenshots
          path: test-artifacts/dames-CF-LIVE-*.png
          if-no-files-found: ignore
