name: Cloudflare Dame's Picks staging readiness
on:
  pull_request:
    paths:
      - "cloudflare/dames-picks/**"
      - ".github/workflows/dames-cloudflare-staging.yml"
  push:
    branches: [main]
    paths:
      - "cloudflare/dames-picks/**"
      - ".github/workflows/dames-cloudflare-staging.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Test Worker, Cron and isolated static staging build
        working-directory: cloudflare/dames-picks
        run: npm run check
      - name: Verify Wrangler can package the actual Worker without Cloudflare credentials
        working-directory: cloudflare/dames-picks
        run: |
          npm install --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir /tmp/dames-worker-build
      - name: Validate D1 migrations with real SQLite
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sqlite3
          migration=Path('cloudflare/dames-picks/migrations/0001_bootstrap.sql').read_text()
          db=sqlite3.connect(':memory:')
          db.executescript(migration)
          rows=db.execute('SELECT source_id,status FROM source_health').fetchall()
          assert len(rows)==7,rows
          assert all(row[1]=='not_connected' for row in rows), rows
          db.execute("INSERT INTO scheduler_runs(job,scheduled_at,completed_at,outcome,detail) VALUES(?,?,?,?,?)",
                     ("staging-heartbeat","2026-11-17T09:00:00Z","2026-11-17T09:00:01Z","success","smoke"))
          db.execute("SELECT * FROM scheduler_runs").fetchone()
          second=Path('cloudflare/dames-picks/migrations/0002_odds_markets.sql').read_text()
          db.executescript(second)
          assert {row[0] for row in db.execute(
             "SELECT name FROM sqlite_master WHERE type='table'"
          )}.issuperset({'odds_api_budget','odds_api_quotes','odds_api_attempts'})
          # Migration must be safe to rerun without erasing saved historic quotes.
          db.executescript(second)
          db.execute("INSERT OR IGNORE INTO odds_api_budget(month_utc,day_utc) VALUES('2026-11','2026-11-17')")
          q=db.execute("""
              UPDATE odds_api_budget SET reserved_credits=reserved_credits+4
              WHERE month_utc='2026-11' AND used_credits+reserved_credits+4<=100
          """)
          assert q.rowcount==1
          assert db.execute("SELECT reserved_credits FROM odds_api_budget").fetchone()[0]==4
          q=db.execute("""
              UPDATE odds_api_budget SET reserved_credits=reserved_credits+101
              WHERE month_utc='2026-11' AND used_credits+reserved_credits+101<=100
          """)
          assert q.rowcount==0
          print('PASS: D1 0001/0002 idempotent schemas, credit reservation, seven disconnected sources and Cron writes')
          PY
      - name: Verify snapshot bundle does not silently omit essential site data
        working-directory: cloudflare/dames-picks
        run: |
          node --input-type=module <<'NODE'
          import {existsSync,readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const d='dist/';
          for (const f of ['dames-picks/index.html','dames-picks/classic.html','dames-picks/feeds.js','dames-picks/live_direct.js','dames-picks/unified-shell.js','current_form.json','nba_schedule.json','lagged_matchup_all_market_ledger.json','nfl/data/latest_2026.json']) {
            assert.ok(existsSync(d+f),'missing required '+f);
          }
          assert.match(readFileSync(d+'dames-picks/index.html','utf8'),/cloudflare-staging-banner/);
          assert.match(readFileSync(d+'dames-picks/index.html','utf8'),/noindex,nofollow/);
          const report=JSON.parse(readFileSync(d+'staging-build-status.json','utf8'));
          assert.equal(report.not_automated,true);
          assert.ok(existsSync(d+'dames-picks/market-explorer.html'));
          assert.ok(existsSync(d+'dames-picks/market-explorer.js'));
          assert.match(readFileSync(d+'dames-picks/index.html','utf8'),/market-explorer.html/);
          console.log('PASS: staged UI and source snapshots present; staging clearly disclosed');
          NODE
