name: Verify Dame's Picks D1 binding on live Cloudflare staging
on:
  pull_request:
    paths:
      - "scripts/check_dames_d1_activation.py"
      - ".github/workflows/dames-d1-live-audit.yml"
  push:
    branches: [main]
    paths:
      - "cloudflare/dames-picks/src/worker.js"
      - "cloudflare/dames-picks/wrangler.jsonc"
      - "scripts/check_dames_d1_activation.py"
      - ".github/workflows/dames-d1-live-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-live-d1:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Check the ACTUAL deployed staging database binding and readiness
        env:
          DAMES_CF_BINDING_WAIT_SECONDS: "150"
          DAMES_CF_REQUIRE_BOOTSTRAP_VERSION: ${{ github.event_name == 'pull_request' && 'false' || 'true' }}
        run: python scripts/check_dames_d1_activation.py
