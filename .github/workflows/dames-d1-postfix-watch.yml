name: Dame's Picks live Cloudflare D1 independent watchdog
on:
  pull_request:
    paths:
      - "scripts/check_dames_postfix_d1.py"
      - ".github/workflows/dames-d1-postfix-watch.yml"
  push:
    branches: [main]
    paths:
      - "cloudflare/dames-picks/src/worker.js"
      - "cloudflare/dames-picks/migrations/*.sql"
      - "scripts/check_dames_postfix_d1.py"
      - ".github/workflows/dames-d1-postfix-watch.yml"
  workflow_dispatch:
  schedule:
    - cron: "22 */6 * * *"
permissions:
  contents: read
jobs:
  verify-real-cloudflare:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Check the real Cloudflare database and last Cron with bounded retries
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 45); do
            if python scripts/check_dames_postfix_d1.py; then
              echo "Verified: D1 core and odds schema, recent Cron heartbeat, disabled paid provider"
              exit 0
            fi
            if [ "$attempt" -lt 45 ]; then sleep 15; fi
          done
          echo "::error::Staging Cloudflare D1 and scheduled heartbeat did not pass"
          exit 1
      - name: Preserve exact read-only status evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dames-cloudflare-postfix-d1-evidence
          path: test-artifacts/dames-d1-postfix-proof.json
          if-no-files-found: ignore
