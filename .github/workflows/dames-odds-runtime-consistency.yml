name: Verify Odds API secret metadata consistency across Cloudflare
on:
  pull_request:
    paths:
      - "tests/check_dames_secret_runtime_consistency.py"
      - ".github/workflows/dames-odds-runtime-consistency.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Check live Worker secret-present boolean only, across repeated requests
        run: python tests/check_dames_secret_runtime_consistency.py
