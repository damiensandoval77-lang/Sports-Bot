name: Dame's Picks feed and mobile frontend tests
on:
  pull_request:
    paths:
      - 'docs/dames-picks/**'
      - 'iphone_bot/tests/test_dames_picks_adapter.cjs'
      - '.github/workflows/dames-picks-ui.yml'
  push:
    branches: [main]
    paths:
      - 'docs/dames-picks/**'
      - 'iphone_bot/tests/test_dames_picks_adapter.cjs'
      - '.github/workflows/dames-picks-ui.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test NBA/NFL mapping and frozen snapshot safeguards
        run: node --test iphone_bot/tests/test_dames_picks_adapter.cjs
      - name: Check frontend JavaScript syntax
        run: |
          node --check docs/dames-picks/adapter.js
          node - <<'JS'
          const fs=require('fs'),vm=require('vm');
          const page=fs.readFileSync('docs/dames-picks/index.html','utf8');
          for(const [i,x] of [...page.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)].entries())
            if(x[1].trim())new vm.Script(x[1],{filename:'dames-picks-inline-'+i});
          JS
