name: Validate Sports-Bot dashboard navigation
on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - '.github/workflows/dashboard-ui-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dashboard_ui:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript and horizontal game strip
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('docs/index.html').read_text()
          for feature in (
              'id="game-strip"', 'id="game-strip-count"',
              'id="game-strip-note"', 'class="game-strip"',
              'scroll-snap-type:x proximity',
              'function renderGameStrip()', 'function setGameFilter(game)',
              'aria-pressed', 'renderSchedulePlayers();',
              'renderAI();', 'renderOdds();',
              'tile-scoreboard', 'tile-team-logo', 'tile-team-score',
              'away_score', 'home_score', 'refreshScoresOnly',
              'setInterval(refreshScoresOnly,90000)'):
              assert feature in html, f'Missing dashboard feature: {feature}'
          assert html.index('id="game-strip"')<html.index('class="summary dashboard-summary"')
          assert '--bg:#070707' in html
          assert '<meta name="theme-color" content="#080808">' in html
          for hidden in ('#slate-coverage','#full-nba-slate','#schedule-players',
                         '.schedule-roster-control','#game-strip-note'):
              assert hidden in html, f'Missing clutter-hiding rule: {hidden}'
          assert 'id="ai-board"' in html and 'id="odds-board"' in html
          assert 'model-chance' in html, 'Do not remove simulated hit percentage cards'

          script=html.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/sports-bot-game-strip.js').write_text(script)
          print('Game strip and filters verified')
          PY
          node --check /tmp/sports-bot-game-strip.js
      - name: Regression test scoreboard survives unscored ESPN schedule
        run: |
          node <<'JS'
          const fs=require('node:fs');
          const script=fs.readFileSync('/tmp/sports-bot-game-strip.js','utf8');
          const from=script.indexOf('function hasVerifiedPair(');
          const to=script.indexOf('async function refreshScoresOnly()',from);
          if(from<0||to<0)throw Error('Score merge helper missing');
          const {mergeScoreSchedules}=new Function(
            script.slice(from,to)+';return {mergeScoreSchedules};')();
          const game={id:'nba1',game:'Boston Celtics @ Charlotte Hornets',
            away:'Boston Celtics',home:'Charlotte Hornets',
            date_eastern:'2026-11-06',start:'2026-11-07T00:11:00Z',
            game_state:'in',away_score:42,home_score:20,
            score_updated_at:'2026-11-07T00:42:06Z'};
          const verified={generated_at:'2026-11-07T00:42:11Z',
            games:[game],coverage_complete:false};
          const unscored={generated_at:'2026-11-07T00:44:00Z',
            games:[{...game,id:'espn2',away_score:null,home_score:null,
              score_updated_at:null,game_state:'pre'}],coverage_complete:true};
          const retained=mergeScoreSchedules(verified,unscored);
          if(retained.games.length!==1 || retained.games[0].away_score!==42 ||
             retained.games[0].home_score!==20 ||
             retained.games[0].game_state!=='in')throw Error('Verified scores lost');
          const updated={generated_at:'2026-11-07T00:46:00Z',
            games:[{...game,away_score:51,home_score:44,
              score_updated_at:'2026-11-07T00:45:00Z'}]};
          const latest=mergeScoreSchedules(retained,updated);
          if(latest.games[0].away_score!==51||latest.games[0].home_score!==44)
            throw Error('Newer valid score did not win');
          console.log('Score merge regression: PASS');
          JS
