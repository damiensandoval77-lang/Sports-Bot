name: Validate Sports-Bot dashboard navigation
on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/ai_no_line_pregame_archive.json'
      - 'docs/ai_projection_fallback.json'
      - 'docs/ai_prizepicks_quick_join_health.json'
      - 'docs/ai_prizepicks_quick_join.json'
      - 'iphone_bot/tests/test_projection_delivery_smoke.py'
      - 'iphone_bot/tests/test_quick_prizepicks_join.cjs'
      - 'iphone_bot/verify_deployed_dashboard.py'
      - 'iphone_bot/tests/test_verify_deployed_dashboard.py'
      - '.github/workflows/dashboard-ui-check.yml'
  pull_request:
    paths:
      - 'docs/index.html'
      - 'iphone_bot/tests/test_quick_prizepicks_join.cjs'
      - '.github/workflows/dashboard-ui-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dashboard_ui:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify real AI forecasts render without a sportsbook quote
        run: python -m unittest discover -s iphone_bot/tests -p 'test_projection_delivery_smoke.py' -v
      - name: Offline tests for the independent public deployment probe
        run: python -m unittest discover -s iphone_bot/tests -p 'test_verify_deployed_dashboard.py' -v
      - name: Verify fresh authentic PrizePicks line + AI direction fallback
        run: node --test iphone_bot/tests/test_quick_prizepicks_join.cjs
      - name: Check unified NBA and NFL navigation, game drill-down, and JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          landing=Path("docs/index.html").read_text()
          html=Path("docs/dames-picks/index.html").read_text()
          model=Path("docs/dames-picks/feeds.js").read_text()
          live=Path("docs/dames-picks/live_direct.js").read_text()
          assert 'url=./dames-picks/' in landing
          assert 'data-league="NBA"' in html and 'data-league="NFL"' in html
          assert 'data-view="tracker"' in html and 'data-view="saved"' in html
          assert 'data-game=' in html and 'renderGameDetail()' in html
          assert 'id="coverage"' in html
          assert 'No saved picks yet for ' in model
          assert 'quoteOnly:true' in model and 'projection:null,direction:null,chance:null' in model
          assert 'L.fetchNBA().catch(()=>null)' in html
          assert 'setInterval(()=>{if(!document.hidden)liveTick().catch(()=>{})},30000)' in html
          assert 'getJSON("nba_scoreboard_independent.json")' in html
          assert 'root.DamesPicksLive=' in live
          scripts=re.findall(r'<script>(.*?)</script>',html,re.S)
          assert scripts, "Active inline application script missing"
          Path("/tmp/dames-picks-ui.js").write_text(scripts[-1])
          print("Unified NBA/NFL navigation and date-safe coverage indicators present")
          PY
          node --check /tmp/dames-picks-ui.js
          node --check docs/dames-picks/live_direct.js
          node --check docs/dames-picks/feeds.js
      - name: Regression-test integer ESPN scores and non-destructive live merging
        run: |
          node <<'JS'
          const fs=require("node:fs"),vm=require("node:vm"),assert=require("node:assert/strict");
          const ctx={Intl,Date};vm.createContext(ctx);
          vm.runInContext(fs.readFileSync("docs/dames-picks/live_direct.js","utf8"),ctx);
          const L=ctx.DamesPicksLive,now=Date.parse("2026-11-07T00:47:00Z");
          const game={game:"Boston Celtics @ Charlotte Hornets",game_state:"in",away_score:42,home_score:20};
          const snapshot={is_live_score_source:true,generated_at:"2026-11-07T00:42:00Z",games:[game]};
          const stale={is_live_score_source:true,generated_at:"2026-11-07T00:40:00Z",games:[{...game,away_score:10,home_score:8}]};
          const preserved=L.mergeScores(snapshot,stale,now);
          assert.equal(preserved.games[0].away_score,42);
          assert.equal(preserved.games[0].home_score,20);
          const unscored={is_live_score_source:true,generated_at:"2026-11-07T00:44:00Z",
             games:[{...game,game_state:"pre",away_score:null,home_score:null}]};
          const kept=L.mergeScores(snapshot,unscored,now);
          assert.equal(kept.games[0].away_score,42);
          assert.equal(kept.games[0].home_score,20);
          const newest={is_live_score_source:true,generated_at:"2026-11-07T00:46:00Z",
             games:[{...game,away_score:51,home_score:44}]};
          const latest=L.mergeScores(snapshot,newest,now);
          assert.equal(latest.games[0].away_score,51);
          assert.equal(latest.games[0].home_score,44);
          console.log("Verified live score newer-valid-wins, stale/unscored cannot overwrite");
          JS
      - name: Regression-test ESPN player box totals with DNP excluded
        run: |
          node <<'JS'
          const fs=require("node:fs"),vm=require("node:vm"),assert=require("node:assert/strict");
          const ctx={Intl,Date};vm.createContext(ctx);
          vm.runInContext(fs.readFileSync("docs/dames-picks/live_direct.js","utf8"),ctx);
          const team={team:{abbreviation:"BOS"},statistics:[{labels:["MIN","PTS","REB","AST"],
             athletes:[{athlete:{id:"1",displayName:"Real Player"},stats:["34","35","5","7"]},
                       {athlete:{id:"2",displayName:"DNP Player"},didNotPlay:true,stats:[]}]}]};
          const rows=ctx.DamesPicksLive.playerRows({boxscore:{players:[team]}});
          assert.equal(rows.length,1);
          assert.equal(rows[0].player,"Real Player");
          assert.equal(rows[0].PTS,35);
          assert.equal(rows[0].REB,5);
          assert.equal(rows[0].AST,7);
          assert.equal(rows[0].PRA,47);
          console.log("Observed ESPN boxscore numbers only; DNP excluded");
          JS
