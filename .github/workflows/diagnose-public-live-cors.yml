name: Diagnose public NBA live browser provider reachability
on:
  pull_request:
    paths:
      - 'iphone_bot/diagnose_public_live_cors.py'
      - '.github/workflows/diagnose-public-live-cors.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cors:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser dependencies
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: From actual Github Pages origin test NBA and ESPN JSON browser access
        run: python -m iphone_bot.diagnose_public_live_cors
