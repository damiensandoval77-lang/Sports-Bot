name: DS5 first-concept desktop and phone browser test
on:
  push:
    branches: [main]
    paths:
      - 'docs/dames-picks/index.html'
      - 'docs/dames-picks/ds5-v1.css'
      - 'docs/dames-picks/ds5-v1.js'
      - 'docs/dames-picks/concept-3-connected.js'
      - 'docs/dames-picks/unified-shell.js'
      - 'tests/test_ds5_first_concept_browser.py'
      - '.github/workflows/ds5-first-concept-ui.yml'
  pull_request:
    paths:
      - 'docs/dames-picks/index.html'
      - 'docs/dames-picks/ds5-v1.css'
      - 'docs/dames-picks/ds5-v1.js'
      - 'docs/dames-picks/concept-3-connected.js'
      - 'tests/test_ds5_first_concept_browser.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first-concept:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Parse the actual dashboard scripts
        run: |
          node --check docs/dames-picks/ds5-v1.js
          node --check docs/dames-picks/concept-3-connected.js
          node --check docs/dames-picks/unified-shell.js
          python -m py_compile tests/test_ds5_first_concept_browser.py
      - name: Install headless browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify desktop and iPhone DS5 first-concept UI
        run: python tests/test_ds5_first_concept_browser.py
      - name: Verify public Pages serves the new DS5 assets (not just source)
        run: |
          python - <<'PY'
          from urllib.request import urlopen
          from time import sleep
          base='https://damiensandoval77-lang.github.io/Sports-Bot/dames-picks/'
          expected={
            '':'ds5-first-concept-20261117-r1',
            'ds5-v1.css':'ds5-dashboard',
            'ds5-v1.js':'ds5-first-concept'
          }
          for path,marker in expected.items():
            last=None
            for attempt in range(12):
              try:
                with urlopen(base+path,timeout=15) as r: raw=r.read().decode('utf-8')
                if marker in raw:
                  print('PASS',base+path,'includes',marker)
                  break
                last='marker not found'
              except Exception as e:
                last=str(e)
              sleep(6)
            else:
              raise SystemExit('FAILED public Pages '+path+': '+str(last))
          PY
      - name: Verify actual public DS5 desktop and phone browser experience
        env:
          DS5_BASE_URL: https://damiensandoval77-lang.github.io/Sports-Bot/dames-picks/
          DS5_SCREENSHOT_DIR: /tmp/ds5-first-concept/public
        run: python tests/test_ds5_first_concept_browser.py
      - name: Publish screenshots for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ds5-first-concept-desktop-phone
          path: /tmp/ds5-first-concept
          if-no-files-found: ignore
          retention-days: 7
