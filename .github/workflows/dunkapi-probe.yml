name: Probe DunkAPI historical NBA props
on:
  workflow_dispatch:
    inputs:
      game_date:
        description: 'Completed NBA regular-season game date (YYYY-MM-DD)'
        required: true
        default: '2026-03-15'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Verify DunkAPI key and estimate historical data coverage
        env:
          DUNKAPI_KEY: ${{ secrets.DUNKAPI_KEY }}
          DUNK_GAME_DATE: ${{ inputs.game_date }}
        run: python -u iphone_bot/probe_dunkapi.py
