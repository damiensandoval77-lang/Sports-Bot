name: ESPN live backup JSON resilience
on:
  pull_request:
    paths:
      - 'iphone_bot/capture_live_research.py'
      - 'iphone_bot/publish_live_tracker_feed.py'
      - 'iphone_bot/tests/test_espn_json_backoff.py'
      - '.github/workflows/espn-live-json-resilience.yml'
  push:
    branches: [main]
    paths:
      - 'iphone_bot/capture_live_research.py'
      - 'iphone_bot/publish_live_tracker_feed.py'
      - 'iphone_bot/tests/test_espn_json_backoff.py'
      - '.github/workflows/espn-live-json-resilience.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate ESPN JSON retries and previously verified snapshot preservation
        run: |
          python -m unittest discover -s iphone_bot/tests -p 'test_espn_json_backoff.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_publish_live_tracker_feed.py' -v
