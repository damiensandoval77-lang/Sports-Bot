name: Grade prospective frozen baseline PrizePicks markets with real finals
on:
  workflow_dispatch:
  schedule:
    - cron: '09,39 * * * *'
  pull_request:
    paths:
      - 'iphone_bot/grade_frozen_baseline_join.py'
      - 'iphone_bot/tests/test_grade_frozen_baseline_join.py'
      - 'docs/frozen_baseline_pregame_lines_2026-11-09.json'
      - '.github/workflows/grade_frozen_baseline_join.yml'
  push:
    branches: [main]
    paths:
      - 'docs/frozen_baseline_pregame_lines_2026-11-09.json'
      - 'docs/ai_forecast_actual_ledger.json'
      - 'iphone_bot/grade_frozen_baseline_join.py'
      - '.github/workflows/grade_frozen_baseline_join.yml'
permissions:
  contents: write
concurrency:
  group: frozen-baseline-pregame-grade
  cancel-in-progress: false
jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify immutable 2026-11-09 source snapshot and real-final-only grading
        if: github.event_name == 'pull_request'
        run: python -m unittest discover -s iphone_bot/tests -p 'test_grade_frozen_baseline_join.py' -v
      - name: Grade original frozen baseline markets without altering archived predictions
        if: github.event_name != 'pull_request'
        run: python -m iphone_bot.grade_frozen_baseline_join
      - name: Publish verified research results with concurrency retries
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          cp docs/frozen_baseline_pregame_lines_2026-11-09_grades.json "$RUNNER_TEMP/frozen-baseline-grades.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            # Regrade against newest verified final records after the reset.
            python -m iphone_bot.grade_frozen_baseline_join
            git add docs/frozen_baseline_pregame_lines_2026-11-09_grades.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Grade prospective immutable baseline PrizePicks lines from verified finals'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
