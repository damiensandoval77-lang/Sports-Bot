name: Independent NBA player boxscores

on:
  workflow_dispatch:
  schedule:
    - cron: "6,21,36,51 * * * *"
  pull_request:
    paths:
      - "iphone_bot/refresh_nba_player_boxscores.py"
      - "iphone_bot/tests/test_nba_player_boxscores.py"
      - "docs/index.html"
      - ".github/workflows/independent_nba_player_boxscores.yml"

permissions:
  contents: write

concurrency:
  group: independent-nba-player-boxscores
  cancel-in-progress: false

jobs:
  player-boxscores:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate player boxscore source and failure handling
        run: python -m unittest discover -s iphone_bot/tests -p 'test_nba_player_boxscores.py' -v
      - name: Refresh observed NBA player totals without paid odds API calls
        id: refresh
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: python -m iphone_bot.refresh_nba_player_boxscores
      - name: Commit observed player totals or explicit source failure
        if: always() && github.event_name != 'pull_request' && steps.refresh.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/nba_player_tracking_independent.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh independent NBA player observation"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Fail visibly when independent player data unavailable
        if: always() && github.event_name != 'pull_request' && steps.refresh.outcome == 'failure'
        run: |
          echo "::error::Independent NBA player boxscore fetch unavailable or partial"
          exit 1
