name: Live deployed Dame's Picks iPhone browser E2E
on:
  # Validate verifier changes on PRs; only main is compared with production.
  pull_request:
    paths:
      - 'scripts/e2e_live_site.py'
      - '.github/workflows/live-site-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'docs/dames-picks/**'
      - 'scripts/e2e_live_site.py'
      - '.github/workflows/live-site-e2e.yml'
  workflow_dispatch:
  schedule:
    - cron: '5,35 * * * *'
  workflow_run:
    workflows: ["pages build and deployment","Controlled Sports-Bot GitHub Pages deployment"]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: live-site-e2e-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  # Complete the current browser run even when frequent publishes arrive.
  cancel-in-progress: false
jobs:
  verifier-syntax:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: |
          python -m py_compile scripts/e2e_live_site.py
          python -m unittest discover -s tests -p 'test_mobile_board_health.py' -v
  deployed-iphone:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      DAMES_BROWSER: ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install browser dependencies
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Wait for exact native Pages release before phone verification
        id: deployment
        run: |
          set +e
          python scripts/verify_legacy_pages_release.py out/deployment-convergence.json
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Verify real deployed iPhone-size page and published ledger
        id: verify
        run: |
          set +e
          python scripts/e2e_live_site.py https://damiensandoval77-lang.github.io/Sports-Bot out
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Preserve rendered phone screenshot and report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iphone-live-e2e-${{ matrix.browser }}-${{ github.run_id }}
          path: out/
          retention-days: 90
      - name: Fail visibly if phone-facing release is incomplete
        if: always() && (steps.deployment.outputs.code != '0' || steps.verify.outputs.code != '0')
        run: exit 1
