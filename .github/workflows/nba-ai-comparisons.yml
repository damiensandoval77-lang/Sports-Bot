name: Update experimental AI sportsbook comparisons
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'iphone_bot/fetch_prizepicks.py'
      - 'iphone_bot/tests/test_fetch_prizepicks.py'
      - '.github/workflows/nba-ai-comparisons.yml'
  schedule:
    - cron: '17 20,23 * * *'
permissions:
  contents: write
concurrency:
  group: nba-prop-feed
  cancel-in-progress: false
jobs:
  prizepicks_check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch latest published board
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Check independent PrizePicks matching
        run: python -m unittest discover -s iphone_bot/tests -p "test_fetch_prizepicks.py" -v
      - name: Refresh PrizePicks lines independently of FanDuel
        env:
          PRIZEPICKS_API_KEY: ${{ secrets.PRIZEPICKS_API_KEY }}
          PRIZEPICKS_FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python -u iphone_bot/fetch_prizepicks.py
      - name: Publish verified third-party board
        run: |
          git add docs/prizepicks.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update independent PrizePicks lines and rejection diagnostics'
          git reset --hard HEAD
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
          done
          exit 1
  compare:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh-research-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install historical and ML dependencies
        run: pip install -r iphone_bot/requirements-training.txt pyarrow requests "scikit-learn>=1.4,<2" "joblib>=1.3,<2"
      - name: Rebuild archived training data
        run: |
          python -u iphone_bot/download_archived_nba.py
          python -u -m src.sports.nba.features
      - name: Train provisional models
        run: python -u iphone_bot/train_provisional.py
      - name: Train opponent-aware shadow (research only)
        run: python -u iphone_bot/train_defense_shadow.py
      - name: Validate matchup logic and Python syntax
        run: |
          python -m py_compile iphone_bot/matchup_context.py iphone_bot/compare_live_models.py iphone_bot/fetch_current_form.py iphone_bot/train_defense_shadow.py iphone_bot/defense_training.py iphone_bot/experimental_probability.py iphone_bot/train_provisional.py iphone_bot/sportsbook_consensus.py iphone_bot/fetch_props.py iphone_bot/hypothetical_ev.py iphone_bot/paper_pick_pipeline.py iphone_bot/combined_projection.py iphone_bot/projection_explanation.py iphone_bot/model_performance.py iphone_bot/accuracy_feedback.py iphone_bot/fetch_prizepicks.py iphone_bot/fetch_official_injuries.py iphone_bot/research_context.py iphone_bot/minutes_model_v2.py iphone_bot/shot_profile_research.py iphone_bot/weight_research.py
          python -m unittest discover -s iphone_bot/tests -p "test_matchup_context.py" -v
          python -m unittest discover -s iphone_bot/tests -p "test_experimental_probability.py" -v
          python -m unittest discover -s iphone_bot/tests -p "test_sportsbook_consensus.py" -v
          python -m unittest discover -s iphone_bot/tests -p "test_fetch_props.py" -v
          python -m unittest discover -s iphone_bot/tests -p "test_hypothetical_ev.py" -v
          python -m unittest discover -s iphone_bot/tests -p "test_paper_pick_pipeline.py" -v
          python -m unittest discover -s iphone_bot/tests -p "test_model_performance.py" -v
          python -m unittest discover -s iphone_bot/tests -p "test_accuracy_feedback.py" -v
          python -m unittest discover -s iphone_bot/tests -p "test_pipeline_health.py" -v
          python -m unittest discover -s iphone_bot/tests -p "test_research_upgrades.py" -v
          python -m unittest discover -s iphone_bot/tests -p "test_minutes_model_v2.py" -v
          python -m unittest discover -s iphone_bot/tests -p "test_shot_profile_research.py" -v
          python -m unittest discover -s iphone_bot/tests -p "test_fetch_prizepicks.py" -v
          python -m unittest discover -s iphone_bot/tests -p "test_combined_projection.py" -v
          python -m unittest discover -s iphone_bot/tests -p "test_projection_explanation.py" -v
          python -m unittest discover -s iphone_bot/tests -p "test_minutes_scenario_validation.py" -v
      - name: Fetch 2026-27 current-season player games
        run: python -u iphone_bot/fetch_current_form.py
      - name: Read official NBA injury report
        run: |
          python -m pip install "pypdf>=5,<7"
          python -u iphone_bot/fetch_official_injuries.py
      - name: Fetch all available upcoming sportsbook events within API credit budget
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_MAX_EVENTS: '15'
          ODDS_OUTCOMES_PER_EVENT: '1000'
        run: python -u iphone_bot/fetch_props.py
      - name: Preserve observed pregame sportsbook snapshots
        run: python -u iphone_bot/archive_observed_props.py
      - name: Audit archived bookmaker quotes against completed current games
        run: python -u iphone_bot/audit_archived_real_lines.py
      - name: Compare AI projections with verified pregame sportsbook markets
        run: python -u iphone_bot/compare_live_models.py
      - name: Update optional third-party PrizePicks research lines
        env:
          PRIZEPICKS_API_KEY: ${{ secrets.PRIZEPICKS_API_KEY }}
          PRIZEPICKS_FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          # Once daily for free-tier request budgets; FanDuel continues on both runs.
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] || [ "$(date -u +%H)" = "20" ]; then
            python -u iphone_bot/fetch_prizepicks.py || echo "Independent pickem provider unavailable; FanDuel unaffected."
          fi
      - name: Lock pregame predictions and settle completed paper results
        run: python -u iphone_bot/paper_pick_pipeline.py
      - name: Lock and evaluate research-only injury minutes scenarios
        run: python -u iphone_bot/minutes_scenario_validation.py
      - name: Validate analysis and publish
        run: |
          python - <<'PY'
          import json
          p='docs/ai_comparisons.json'
          d=json.load(open(p))
          sportsbook=json.load(open('docs/data.json'))
          assert sportsbook['is_live'] is True
          assert sportsbook['slate_events_checked']<=sportsbook['slate_events_available']
          assert sportsbook['slate_events_available']==(sportsbook['slate_events_checked']+
                  sportsbook['slate_events_not_checked'])
          assert sportsbook['slate_event_limit']>=15
          assert all(x['two_sided_outcomes']%2==0 for x in sportsbook['events_covered'])
          print('Upcoming provider NBA events:',sportsbook['slate_events_available'],
                'checked:',sportsbook['slate_events_checked'],
                'unavailable:',sportsbook['slate_events_not_checked'])
          assert d['status']=='EXPERIMENTAL_NON_CALIBRATED'
          assert d['comparison_rows_published']==len(d['comparisons'])
          assert d['comparison_rows_truncated']==0
          assert d['verified_current_matchups'] is True
          assert d['is_prizepicks'] is False
          assert all(x['sample_games']>=5 for x in d['comparisons'])
          assert type(d['injury_data_verified']) is bool
          assert d['lineup_research_adjustments_applied'] is False
          assert d['minutes_v2_applied_to_live_model'] is False
          assert d['shot_profile_applied_to_live_model'] is False
          assert all(x['shot_profile_research']['live_adjustment_applied'] is False
                     for x in d['comparisons'])
          assert all((x['shot_profile_research']['expected_2pa'] is None and
                     x['shot_profile_research']['expected_3pa'] is None) or
                     abs(x['shot_profile_research']['expected_fga']-
                         x['shot_profile_research']['expected_2pa']-
                         x['shot_profile_research']['expected_3pa'])<0.03
                     for x in d['comparisons'])
          assert d['minutes_v2_validation']['live_model_unchanged'] is True
          assert d['minutes_v2_validation']['production_adjustment_applied'] is False
          assert all(x['minutes_v2_research']['live_adjustment_applied'] is False for x in d['comparisons'])
          assert all(x['minutes_v2_research']['expected_minutes'] is None or
                     0 <= x['minutes_v2_research']['expected_minutes'] <= 48
                     for x in d['comparisons'])
          assert d['injury_minutes_research_status']=='DESCRIPTIVE_ONLY_NOT_APPLIED'
          assert d['minutes_baseline_validation']['live_model_unchanged'] is True
          assert all(x['injury_minutes_research']['live_adjustment_applied'] is False for x in d['comparisons'])
          assert all(x['injury_minutes_research']['scenario_minutes'] is None or
                     0 <= x['injury_minutes_research']['scenario_minutes'] <= 48 for x in d['comparisons'])

          assert all(x['lineup_research_adjustment_applied'] is False for x in d['comparisons'])
          assert all(x['injury_status'] in ('OUT','DOUBTFUL','QUESTIONABLE','PROBABLE','AVAILABLE','DAY_TO_DAY','NOT_VERIFIED') for x in d['comparisons'])
          assert d['opponent_defense_applied_to_model'] is False
          assert d['shadow_is_primary'] is False
          assert all(x['projection_explanation']['status']=='DESCRIPTIVE_FACTS_NOT_CAUSAL_EXPLANATION' for x in d['comparisons'])
          assert all(1<=len(x['projection_explanation']['sentences'])<=3 for x in d['comparisons'])
          assert d['combined_projection_enabled'] is True
          assert d['combined_projection_validated'] is False
          assert all(x['combined_model_count'] in (1,2) and x['combined_projection']>=0 for x in d['comparisons'])
          assert all(x['combined_method']==('TWO_MODEL_MEDIAN_EQUAL_WEIGHT_RESEARCH_ONLY' if x['combined_model_count']==2 else 'ORIGINAL_AI_FALLBACK') for x in d['comparisons'])
          assert all(abs(x['combined_projection']-(x['projection']+x['shadow_projection'])/2)<=0.11 for x in d['comparisons'] if x['combined_model_count']==2)
          assert d['line_aggregation_method']=='MEDIAN_OF_DISTINCT_TWO_SIDED_BOOKMAKERS'
          assert all(x['line_book_count']>=1 for x in d['comparisons'])
          assert all(len(x['book_quotes'])==x['line_book_count'] for x in d['comparisons'])
          assert all(x['line_type']==('MULTIBOOK_MEDIAN' if x['line_book_count']>=2 else 'SINGLE_BOOK_FALLBACK') for x in d['comparisons'])
          assert d['experimental_ev_available'] is True
          assert d['ev_verified'] is False
          assert all(x['ev_status']=='HYPOTHETICAL_ONLY_UNCALIBRATED_PROBABILITIES' for x in d['comparisons'])
          assert all(x['experimental_best_quote'] is not None for x in d['comparisons'])
          assert all(all(q['ev_verified'] is False for q in x['book_quotes']) for x in d['comparisons'])
          assert d['experimental_probability_ranking'] is True
          assert d['real_market_probabilities_calibrated'] is False
          assert all(x['probability_method']=='CHRONOLOGICAL_VALIDATION_EMPIRICAL_RESIDUALS_UNCALIBRATED' for x in d['comparisons'])
          assert all(0 < x['estimated_selected_probability'] < 1 for x in d['comparisons'])
          assert all(d['comparisons'][i]['estimated_selected_probability'] >= d['comparisons'][i+1]['estimated_selected_probability'] for i in range(len(d['comparisons'])-1))
          assert all(x.get('shadow_status') in ('RESEARCH_SHADOW_ONLY','INSUFFICIENT_DEFENSE_DATA','SHADOW_MODEL_NOT_TRAINED') for x in d['comparisons'])
          # Verified official statuses and explicitly marked ESPN research flags are allowed.
          # Never claim an unlisted player is healthy, and never treat ESPN as official.
          assert all(x['requires_lineup_review'] is True for x in d['comparisons'])
          assert all(
            (x['injury_status']=='NOT_VERIFIED' and x['injury_status_source']=='UNAVAILABLE_OR_NOT_GAME_DAY')
            or (x['injury_status']!='NOT_VERIFIED' and
                x['injury_status_source'] in ('OFFICIAL_NBA_REPORT','ESPN_THIRD_PARTY_NOT_CONFIRMED'))
            for x in d['comparisons']
          )
          assert all(
            x['injury_status_source']!='OFFICIAL_NBA_REPORT' or d['injury_data_verified'] is True
            for x in d['comparisons']
          )
          paper=json.load(open('docs/paper_results.json'))
          injury_minutes=json.load(open('docs/injury_minutes_results.json'))
          assert injury_minutes['status']=='PREGAME_LOCKED_INJURY_MINUTES_RESEARCH'
          assert injury_minutes['live_model_unchanged'] is True
          assert injury_minutes['captured']>=injury_minutes['pending']+injury_minutes['settled']
          assert injury_minutes['same_game_comparison']['observations']==injury_minutes['settled']
          assert paper['accuracy_feedback']['live_model_unchanged'] is True
          assert paper['accuracy_feedback']['production_weight_adjustment_applied'] is False
          assert paper['real_money_wagered'] is False
          assert paper['performance']['status']=='PREGAME_FORECASTS_GRADED_AGAINST_REAL_BOXSCORES'
          assert paper['pipeline_health']['pending_total']==paper['pending']
          assert paper['pipeline_health']['latest_completed_player_game_date'] is not None
          assert set(paper['performance']['models'])=={'original','opponent_aware','combined'}
          assert set(paper['performance']['by_stat'])=={'PTS','REB','AST','PRA'}
          assert paper['weight_research']['live_model_unchanged'] is True
          assert paper['method']=='PRE_GAME_LOCKED_PROJECTION_REAL_BOOK_PRICE_PAPER_ONLY'
          assert paper['captured']>=paper['settled']+paper['pending']
          print('Verified',len(d['comparisons']),'matched experimental comparisons')
          print('Locked paper picks:',paper['captured'],'Settled:',paper['settled'])
          PY
          git add docs/injury_context.json docs/prizepicks.json docs/ai_comparisons.json docs/data.json data/nba/odds/observed_props.csv docs/real_line_audit.json docs/paper_pick_ledger.json docs/paper_results.json docs/injury_minutes_ledger.json docs/injury_minutes_results.json
          if git diff --cached --quiet; then
            echo "No new results"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish experimental NBA model vs sportsbook analysis"
          # Training may modify tracked data inputs; only the three validated
          # output files above are committed. Drop leftover tracked changes
          # before a safe rebase retry.
          git reset --hard HEAD
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            echo "Concurrent commit detected; replaying validated output commit"
            git fetch origin main
            git rebase origin/main || {
              git rebase --abort || true
              echo "Rebase conflict; refusing to overwrite remote data"
              exit 1
            }
          done
          exit 1
