name: Settle immutable NBA AI record from completed box scores
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'iphone_bot/capture_ai_board.py'
      - 'iphone_bot/paper_pick_pipeline.py'
      - 'iphone_bot/verify_paper_settlement_voids.py'
      - 'iphone_bot/tests/test_verify_paper_settlement_voids.py'
      - 'iphone_bot/selective_challenger.py'
      - 'iphone_bot/tests/test_selective_challenger.py'
      - 'iphone_bot/model_performance.py'
      - 'iphone_bot/probability_audit.py'
      - 'iphone_bot/fetch_final_boxscores.py'
      - 'iphone_bot/tests/test_final_boxscores.py'
      - 'iphone_bot/tests/test_probability_audit.py'
      - '.github/workflows/nba-ai-record.yml'
  schedule:
    # Hourly overnight: 10:17 PM–8:17 AM EST, plus 2:17 PM EST.
    # Also supports manual workflow_dispatch immediately when box scores
    # arrive. Five-hour-after-tipoff and exact completed player game matching
    # safeguards remain in force; no paid sportsbook API credits are used.
    - cron: '17 3-13,19 * * *'
permissions:
  contents: write
concurrency:
  group: nba-prop-feed
  cancel-in-progress: false
jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Start with latest saved immutable ledger
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Verify grading and deduplicated per-model direction records
        if: github.event_name == 'pull_request'
        run: |
          python -m py_compile iphone_bot/selective_challenger.py iphone_bot/paper_pick_pipeline.py iphone_bot/model_performance.py iphone_bot/accuracy_feedback.py iphone_bot/probability_audit.py iphone_bot/fetch_final_boxscores.py
          python -m unittest discover -s iphone_bot/tests -p 'test_paper_pick_pipeline.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_verify_paper_settlement_voids.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_selective_challenger.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_model_performance.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_accuracy_feedback.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_capture_ai_board.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_probability_audit.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_final_boxscores.py' -v
      - name: Fetch verified NBA and ESPN FINAL box scores
        run: python -u iphone_bot/fetch_final_boxscores.py
      - name: Refresh completed-game CSV fallback for any missing direct results
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -u iphone_bot/fetch_current_form.py
      - name: Grade locked AI projections against actual results
        run: python -u iphone_bot/paper_pick_pipeline.py
      - name: Verify record invariants before publication
        run: |
          python - <<'PY'
          import json
          from iphone_bot.paper_pick_pipeline import identity,utc
          rows=json.load(open('docs/paper_pick_ledger.json'))['records']
          result=json.load(open('docs/paper_results.json'))
          perf=result['performance']
          challenger=result['selective_challenger']
          assert challenger['live_model_unchanged'] is True
          assert challenger['historical_unscreened_excluded'] is True
          assert challenger['locked_markets']<=result['captured']
          from collections import Counter
          from itertools import islice
          keys=[identity(r) for r in rows]
          if len(keys)!=len(set(keys)):
              repeated=[str(k) for k,count in Counter(keys).items() if count>1]
              raise AssertionError('NBA_DUPLICATE_FROZEN_RECORD_IDENTITIES count='+
                                   str(len(repeated))+' sample='+str(repeated[:5]))
          from iphone_bot.verify_paper_settlement_voids import verify
          statuses=verify(rows,result)
          print('NBA VERIFIED FROZEN LEDGER STATUSES:',statuses,flush=True)
          # Do not weaken immutable record checks. Print each mismatch in the
          # failed Actions step so a passing workflow never hides lost grades.
          observed={'captured':len(rows),
                    'settled':sum(r['status']=='SETTLED' for r in rows),
                    'pending':sum(r['status']=='PENDING' for r in rows)}
          declared={k:result.get(k) for k in observed}
          mismatches={k:{'published':declared[k],'ledger':observed[k]}
                      for k in observed if declared[k]!=observed[k]}
          print('NBA IMMUTABLE SETTLEMENT COUNTS:',json.dumps({
              'declared':declared,'ledger':observed,'mismatches':mismatches
          },sort_keys=True),flush=True)
          if mismatches:
              raise AssertionError('NBA_SETTLEMENT_COUNT_MISMATCH: '+
                                   json.dumps(mismatches,sort_keys=True))
          assert result['independent_player_game_markets']<=result['settled']
          assert result['independent_pending_player_game_markets']<=result['pending']
          assert perf['independent_settled_markets']<=result['independent_player_game_markets']
          from iphone_bot.model_performance import independent_rows
          assert perf['independent_settled_markets']==len(independent_rows(rows))
          print('Settled market groups:',result['independent_player_game_markets'])
          print('Eligible independent performance groups:',perf['independent_settled_markets'])
          print('Excluded from performance due to pretip/quote/data checks:',result['independent_player_game_markets']-perf['independent_settled_markets'])
          assert set(perf['models'])=={'original','opponent_aware','combined'}
          for model in perf['models'].values():
              assert model['direction_eligible']==model['direction_wins']+model['direction_losses']
              assert model['direction_eligible']<=model['observations']
              rate=model['direction_hit_rate']
              if rate is not None:assert 0<=rate<=1
          calibration=result['probability_audit']
          assert calibration['original_model_only'] is True
          assert calibration['no_live_calibration_applied'] is True
          assert calibration['overall']['sample_size']<=perf['models']['original']['direction_eligible']
          assert set(calibration['by_stat'])=={'PTS','REB','AST','PRA'}
          assert sum(bin['sample_size'] for bin in calibration['bins'])==calibration['overall']['sample_size']
          print('Original probability calibration observations:',calibration['overall']['sample_size'])
          print('Settled unique player/game/stat markets:',perf['independent_settled_markets'])
          print('Independent pending markets:',result['independent_pending_player_game_markets'])
          for key,m in perf['models'].items():
              print(key,':',m['direction_wins'],'W',m['direction_losses'],'L',
                    m['direction_pushes'],'pushes; hit rate',m['direction_hit_rate'],
                    'MAE',m['mae'])
          PY
      - name: Publish verified NBA AI win-loss and projection errors
        run: |
          git fetch origin main
          git add docs/paper_pick_ledger.json docs/paper_results.json docs/current_form.json docs/final_boxscores_status.json
          if git diff --cached --quiet; then echo 'No new boxscores'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Grade locked AI projections against completed NBA games'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
          done
          exit 1
