name: Backtest NBA model probabilities (synthetic lines)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: iphone_bot/requirements-training.txt
      - name: Install dependencies
        run: pip install -r iphone_bot/requirements-training.txt pyarrow requests "scikit-learn>=1.4,<2" "joblib>=1.3,<2"
      - name: Rebuild historical feature dataset
        run: |
          python -u iphone_bot/download_archived_nba.py
          python -u -m src.sports.nba.features
      - name: Backtest models on out-of-time synthetic lines
        run: python -u iphone_bot/backtest_provisional.py
      - name: Verify backtest and display accuracy
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path("models/nba/provisional/backtest/backtest_report.json")
          r=json.loads(p.read_text())
          assert r["line_type"] == "SYNTHETIC_ROLLING_L10_HALF_POINT"
          assert len(r["metrics"]) == 4
          for m in r["metrics"]:
              assert m["test_rows"]>1000
              assert 0 <= m["proxy_brier"] <= 1
          print(json.dumps(r,indent=2))
          PY
      - name: Upload backtest report
        uses: actions/upload-artifact@v4
        with:
          name: nba-synthetic-line-backtest
          path: models/nba/provisional/backtest/
          retention-days: 14
          if-no-files-found: error
