name: Build NBA historical training dataset
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r iphone_bot/requirements-training.txt pyarrow requests
      - name: Download archived NBA box scores (no NBA API calls)
        run: python -u iphone_bot/download_archived_nba.py
      - name: Validate archived game logs
        run: |
          python - <<'PY'
          import pandas as pd
          df=pd.read_csv('data/nba/raw/raw_game_logs.csv')
          assert len(df)>80000, f'Insufficient game rows: {len(df)}'
          assert df.SEASON_ID.nunique()==4, 'Expected four seasons'
          assert not df.duplicated(['PLAYER_ID','GAME_ID']).any()
          print('Validated',len(df),'rows')
          PY
      - name: Build historical features
        run: python -u -m src.sports.nba.features
      - name: Verify nonempty training dataset
        run: |
          python - <<'PY'
          import pandas as pd
          df=pd.read_csv('data/nba/processed/training_dataset.csv')
          assert len(df)>1000, f'Insufficient training rows: {len(df)}'
          assert {'PTS','REB','AST','PRA'}.issubset(df.columns)
          print('Dataset shape:',df.shape)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nba-training-dataset
          path: |
            data/nba/processed/training_dataset.csv
            data/nba/processed/player_positions.csv
          retention-days: 7
          if-no-files-found: error
