name: Test sportsbook consensus without odds API calls
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nba-consensus-test.yml'
      - 'iphone_bot/combined_projection.py'
      - 'iphone_bot/tests/test_combined_projection.py'
      - 'iphone_bot/projection_explanation.py'
      - 'iphone_bot/tests/test_projection_explanation.py'
      - 'docs/index.html'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install EV test dependencies
        run: python -m pip install 'numpy>=1.26,<3'
      - name: Verify consensus and paired bookmaker quotas
        run: |
          python -m py_compile iphone_bot/fetch_props.py iphone_bot/sportsbook_consensus.py iphone_bot/compare_live_models.py iphone_bot/hypothetical_ev.py iphone_bot/combined_projection.py
          python -m unittest discover -s iphone_bot/tests -p "test_sportsbook_consensus.py" -v
          python -m unittest discover -s iphone_bot/tests -p "test_hypothetical_ev.py" -v
          python -m unittest discover -s iphone_bot/tests -p "test_combined_projection.py" -v
          python -m unittest discover -s iphone_bot/tests -p "test_projection_explanation.py" -v
      - name: Check dashboard JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          page=Path("docs/index.html").read_text()
          script=page.split("<script>",1)[1].split("</script>",1)[0]
          # Syntax checking alone did not catch the previous runtime ReferenceError.
          assert "recent-block-grid" in page and "recent-stat-tile" in page, "Recent performance cards missing"
          assert '["LAST 5",statVal(recentForm,p.stat,"l5")' in script, "L5 average tile missing"
          assert '["LAST 10",statVal(recentForm,p.stat,"l10")' in script, "L10 average tile missing"
          assert '["MINUTES",p.minutes_context?.observed_l5' in script, "Minutes average tile missing"
          assert "mainSide" not in script, "Stale renamed variable would break AI card rendering"
          assert 'const side=primaryDirection(p)' in script, "Expected direction calculation missing"
          assert 'shadowSide===side' in script, "Shadow analysis must use the defined direction"
          Path("/tmp/sports-bot-board.js").write_text(script)
          PY
          node --check /tmp/sports-bot-board.js
      - name: Confirm no paid provider calls
        run: echo "All checks used local test fixtures only. No Odds API requests."
