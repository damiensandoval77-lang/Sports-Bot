name: Test sportsbook consensus without odds API calls
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nba-consensus-test.yml'
      - 'iphone_bot/combined_projection.py'
      - 'iphone_bot/tests/test_combined_projection.py'
      - 'iphone_bot/projection_explanation.py'
      - 'iphone_bot/tests/test_projection_explanation.py'
      - 'docs/index.html'
      - 'docs/dames-picks/**'
      - 'iphone_bot/tests/test_root_redirect.cjs'
      - 'iphone_bot/tests/test_dames_picks_vE.cjs'
      - 'iphone_bot/tests/test_live_direct.cjs'
      - 'iphone_bot/fetch_prizepicks.py'
      - 'iphone_bot/tests/test_fetch_prizepicks.py'
      - 'iphone_bot/research_context.py'
      - 'iphone_bot/fetch_official_injuries.py'
      - 'iphone_bot/weight_research.py'
      - 'iphone_bot/model_performance.py'
      - 'iphone_bot/fetch_props.py'
      - 'iphone_bot/tests/test_sportsbook_consensus.py'
      - 'iphone_bot/tests/test_research_upgrades.py'
      - 'iphone_bot/compare_live_models.py'
      - 'iphone_bot/minutes_early_season_research.py'
      - 'iphone_bot/tests/test_minutes_early_season_research.py'
      - 'iphone_bot/season_average_research.py'
      - 'iphone_bot/tests/test_season_average_research.py'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install EV test dependencies
        run: python -m pip install 'numpy>=1.26,<3'
      - name: Verify consensus and paired bookmaker quotas
        run: |
          python -m py_compile iphone_bot/minutes_early_season_research.py iphone_bot/season_average_research.py iphone_bot/compare_live_models.py iphone_bot/research_context.py iphone_bot/fetch_official_injuries.py iphone_bot/weight_research.py iphone_bot/fetch_props.py iphone_bot/sportsbook_consensus.py iphone_bot/compare_live_models.py iphone_bot/hypothetical_ev.py iphone_bot/combined_projection.py
          python -m unittest discover -s iphone_bot/tests -p "test_sportsbook_consensus.py" -v
          python -m unittest discover -s iphone_bot/tests -p "test_hypothetical_ev.py" -v
          python -m unittest discover -s iphone_bot/tests -p "test_combined_projection.py" -v
          python -m unittest discover -s iphone_bot/tests -p "test_season_average_research.py" -v
          python -m unittest discover -s iphone_bot/tests -p "test_minutes_early_season_research.py" -v
          python -m unittest discover -s iphone_bot/tests -p "test_fetch_prizepicks.py" -v
          python -m unittest discover -s iphone_bot/tests -p "test_research_upgrades.py" -v
          python -m unittest discover -s iphone_bot/tests -p "test_projection_explanation.py" -v
      - name: Verify active unified app truthfulness, pretip eligibility and live updates
        run: |
          node --test iphone_bot/tests/test_root_redirect.cjs
          node --test iphone_bot/tests/test_dames_picks_vE.cjs
          node --test iphone_bot/tests/test_live_direct.cjs

      - name: Confirm no paid provider calls
        run: echo "All checks used local test fixtures only. No Odds API requests."
