name: NBA Defender Matchup V3 Research (no live model changes)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'iphone_bot/defender_matchup_v3.py'
      - 'iphone_bot/fetch_defender_matchups.py'
      - 'iphone_bot/import_archived_defender_matchups.py'
      - 'iphone_bot/defender_v3_holdout.py'
      - 'iphone_bot/defender_v3_points.py'
      - 'iphone_bot/defender_v3_assignment.py'
      - 'iphone_bot/defender_v3_replication.py'
      - 'iphone_bot/tests/test_defender_v3_replication.py'
      - 'iphone_bot/tests/test_defender_v3_assignment.py'
      - 'iphone_bot/tests/test_defender_v3_points.py'
      - 'iphone_bot/tests/test_defender_v3_holdout.py'
      - 'iphone_bot/tests/test_import_archived_defender_matchups.py'
      - 'iphone_bot/tests/test_fetch_defender_matchups.py'
      - 'iphone_bot/tests/test_defender_matchup_v3.py'
      - '.github/workflows/nba-defender-v3-research.yml'
permissions:
  contents: write
concurrency:
  group: nba-defender-v3-research
  cancel-in-progress: false
jobs:
  defender_research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Parquet reader for verified historical matchup archive
        run: pip install "pyarrow>=15,<24"
      - name: Verify defender matchup research and no leakage
        if: github.event_name == 'pull_request'
        run: |
          python -m py_compile iphone_bot/defender_matchup_v3.py iphone_bot/fetch_defender_matchups.py iphone_bot/import_archived_defender_matchups.py iphone_bot/defender_v3_holdout.py iphone_bot/defender_v3_points.py iphone_bot/defender_v3_assignment.py iphone_bot/defender_v3_replication.py
          python -m unittest discover -s iphone_bot/tests -p 'test_defender_matchup_v3.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_fetch_defender_matchups.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_import_archived_defender_matchups.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_defender_v3_holdout.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_defender_v3_points.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_defender_v3_assignment.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_defender_v3_replication.py' -v
      - name: Download historical 2025-26 matchups from public Parquet archive
        run: python -u iphone_bot/import_archived_defender_matchups.py
      - name: Compare frozen defender efficiency against later historical game results
        run: python -u iphone_bot/defender_v3_holdout.py
      - name: Compare defender-specific minutes and 2P/3P effects against real completed player points
        run: python -u iphone_bot/defender_v3_points.py
      - name: Independently replicate scoring on prior 2024-25 season without retuning
        run: python -u iphone_bot/defender_v3_replication.py
      - name: Publish source readiness only; never inject V3 into live projections
        run: python -u iphone_bot/defender_matchup_v3.py
      - name: Check model isolation
        run: |
          python - <<'PY'
          import json
          data=json.load(open('docs/defender_v3_research.json'))
          assert data['live_model_unchanged'] is True
          assert data['original_probability_unchanged'] is True
          assert data['defender_assignments_confirmed'] is False
          assert data['validation']=='PENDING_CHRONOLOGICAL_HOLDOUT'
          assert data['scenarios_computed']==0
          print('Defender V3 data status:',data['status'])
          PY
      - name: Commit research diagnostics without rebasing generated JSON
        run: |
          set -euo pipefail
          reports=(docs/defender_v3_research.json
                   docs/defender_v3_source_status.json
                   docs/defender_v3_holdout.json
                   docs/defender_v3_points_holdout.json
                   docs/defender_v3_replication.json)
          snapshot="${RUNNER_TEMP}/defender-v3-reports"
          mkdir -p "$snapshot"
          for report in "${reports[@]}"; do
            cp "$report" "$snapshot/$(basename "$report")"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            # Build a FRESH commit from the current main every attempt.
            # Generated JSON must never be rebased or line-merged.
            git fetch origin main
            git reset --hard origin/main
            python - "$snapshot" <<'PY'
          import datetime as dt
          import json
          import pathlib
          import sys
          snapshot=pathlib.Path(sys.argv[1])
          for name in ("defender_v3_research.json","defender_v3_source_status.json",
                       "defender_v3_holdout.json","defender_v3_points_holdout.json",
                       "defender_v3_replication.json"):
              source=snapshot/name
              destination=pathlib.Path("docs")/name
              incoming=json.loads(source.read_text())
              source_time=incoming.get("generated_at") or incoming.get("updated_at")
              if not source_time:
                  raise SystemExit("Missing timestamp on research report: "+name)
              incoming_date=dt.datetime.fromisoformat(source_time.replace("Z","+00:00"))
              if incoming_date.tzinfo is None:
                  raise SystemExit("Timezone missing on research report: "+name)
              if destination.exists():
                  previous=json.loads(destination.read_text())
                  old_time=previous.get("generated_at") or previous.get("updated_at")
                  if old_time:
                      old_date=dt.datetime.fromisoformat(old_time.replace("Z","+00:00"))
                      if old_date.tzinfo is None:
                          raise SystemExit("Timezone missing on published report: "+name)
                      if incoming_date<=old_date:
                          print("Keeping newer/equal published report:",name,flush=True)
                          continue
              destination.write_bytes(source.read_bytes())
              print("Updating:",name,flush=True)
          PY
            git add "${reports[@]}"
            if git diff --cached --quiet; then
              echo 'Reports already published (or newer reports exist)'
              exit 0
            fi
            git commit -m 'Record defender-aware research readiness without changing AI predictions'
            if git push origin HEAD:main; then
              echo 'Published defender V3 reports on attempt' "$attempt"
              exit 0
            fi
            echo 'Concurrent update to main; rebuilding report commit' "$attempt"
          done
          echo 'Unable to publish after 5 fresh-base attempts'
          exit 1
