name: Evaluate opponent-aware NBA challenger
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install training dependencies
        run: pip install -r iphone_bot/requirements-training.txt pyarrow requests "scikit-learn>=1.4,<2"
      - name: Rebuild historical NBA training data
        run: |
          python -u iphone_bot/download_archived_nba.py
          python -u -m src.sports.nba.features
      - name: Test prior-game-only defensive features
        run: |
          python -m py_compile iphone_bot/defense_training.py iphone_bot/train_defense_challenger.py
          python -m unittest discover -s iphone_bot/tests -p 'test_defense_training.py' -v
      - name: Benchmark opponent-aware challenger versus baseline
        run: python -u iphone_bot/train_defense_challenger.py
      - name: Confirm no unvalidated model was promoted
        run: |
          python - <<'PY'
          import json
          d=json.load(open('models/nba/defense_challenger/report.json'))
          assert d['status']=='RESEARCH_CHALLENGER_NOT_DEPLOYED'
          assert d['lines']=='SYNTHETIC_L10_PROXY_NOT_REAL_SPORTSBOOK_ODDS'
          assert len(d['metrics'])==4
          print('Research-only validation complete; no live deployment')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nba-opponent-challenger-evaluation
          path: models/nba/defense_challenger/report.json
          if-no-files-found: error
