name: Detect overdue verified NBA finals and missing forecast grades
on:
  workflow_dispatch:
  schedule:
    # Monitor through US evening NBA games and overnight (UTC).
    - cron: '13,43 0-10 * * *'
  pull_request:
    paths:
      - 'iphone_bot/grading_overdue_watchdog.py'
      - 'iphone_bot/tests/test_grading_overdue_watchdog.py'
      - '.github/workflows/nba-grading-overdue.yml'
  push:
    branches: [main]
    paths:
      - 'iphone_bot/grading_overdue_watchdog.py'
      - 'iphone_bot/tests/test_grading_overdue_watchdog.py'
      - '.github/workflows/nba-grading-overdue.yml'
permissions:
  contents: write
concurrency:
  group: nba-grading-overdue
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reject fabricated or incomplete final-grade acceptance
        if: github.event_name == 'pull_request'
        run: |
          python -m py_compile iphone_bot/grading_overdue_watchdog.py
          python -m unittest discover -s iphone_bot/tests -p 'test_grading_overdue_watchdog.py' -v
      - name: Check every scheduled game beyond the final-verification deadline
        if: github.event_name != 'pull_request'
        id: monitor
        continue-on-error: true
        run: python -m iphone_bot.grading_overdue_watchdog
      - name: Publish per-game overdue diagnostics even when failing
        if: always() && github.event_name != 'pull_request' && steps.monitor.outcome != 'skipped'
        run: |
          set -euo pipefail
          cp docs/grading_overdue_health.json "$RUNNER_TEMP/grading_overdue_health.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/grading_overdue_health.json" docs/grading_overdue_health.json
            git add docs/grading_overdue_health.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Report overdue verified NBA final-game forecast settlement'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Fail loudly if verified final grading remains overdue
        if: always() && github.event_name != 'pull_request' && steps.monitor.outcome == 'failure'
        run: |
          echo "::error::Overdue NBA saved forecasts have not received verified finals. Review docs/grading_overdue_health.json"
          exit 1
