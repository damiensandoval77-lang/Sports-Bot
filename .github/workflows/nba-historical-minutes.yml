name: Validate historical NBA minutes across seasons (research only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'iphone_bot/historical_minutes_research.py'
      - 'iphone_bot/tests/test_historical_minutes_research.py'
      - 'iphone_bot/shot_profile_research.py'
      - 'iphone_bot/tests/test_shot_profile_research.py'
      - '.github/workflows/nba-historical-minutes.yml'
  schedule:
    - cron: '11 10 * * 1'
permissions:
  contents: write
concurrency:
  group: nba-historical-minutes-research
  cancel-in-progress: false
jobs:
  historical_minutes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate chronological historical data logic
        if: github.event_name == 'pull_request'
        run: |
          python -m py_compile iphone_bot/historical_minutes_research.py iphone_bot/minutes_model_v2.py iphone_bot/research_context.py iphone_bot/shot_profile_research.py
          python -m unittest discover -s iphone_bot/tests -p 'test_historical_minutes_research.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_minutes_model_v2.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_shot_profile_research.py' -v
      - name: Install archived box score readers (no paid sports data)
        run: python -m pip install 'pandas>=2,<3' 'pyarrow>=16,<24' 'requests>=2,<3' 'nba_api>=1.4,<3'
      - name: Download already-used 2022-26 NBA archive
        run: python -u iphone_bot/download_archived_nba.py
      - name: Evaluate same-team and same-season prior minutes
        run: python -u iphone_bot/historical_minutes_research.py
      - name: Evaluate two-point vs three-point shot and free-throw opportunities
        run: python -u iphone_bot/shot_profile_research.py
      - name: Verify historical research and no live changes
        run: |
          python - <<'PY'
          import json
          with open('docs/historical_minutes_validation.json') as f: report=json.load(f)
          assert report['live_model_unchanged'] is True
          assert report['production_adjustment_applied'] is False
          assert report['rotation_scenario_live_applied'] is False
          assert report['injury_effect_claimed'] is False
          assert report['holdout_season']=='2025-26'
          assert report['seasons']==['2022-23','2023-24','2024-25','2025-26']
          assert report['holdout']['observations']<=report['archive_player_games']
          assert report['holdout']['candidate_better']+report['holdout']['baseline_better']+report['holdout']['tied']==report['holdout']['observations']
          assert report['holdout']['rotation_better_than_v2']+report['holdout']['rotation_worse_than_v2']+report['holdout']['rotation_tied_v2']==report['holdout']['observations']
          assert report['archive_player_games']>=60000
          with open('docs/shot_profile_validation.json') as f: shot=json.load(f)
          assert shot['live_model_unchanged'] is True
          assert shot['production_adjustment_applied'] is False
          assert shot['injury_usage_change_applied'] is False
          assert shot['shot_location_detail']=='TWO_POINT_VERSUS_THREE_POINT_ONLY'
          assert shot['holdout_season']=='2025-26'
          assert shot['archive_valid_player_games']>=60000
          assert shot['holdout']['observations']>=100
          assert shot['holdout']['opportunity_better']+shot['holdout']['simple_better']<=shot['holdout']['observations']
          print('Shot-profile scoring holdout:',shot['holdout'])
          print('Historical seasons validated:',report['seasons'])
          print('Held-out 2025-26 minutes:',report['holdout'])
          PY
      - name: Publish historical minutes research only
        run: |
          git fetch origin main
          git add docs/historical_minutes_validation.json docs/shot_profile_validation.json
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish four-season NBA minutes holdout research'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
          done
          exit 1
