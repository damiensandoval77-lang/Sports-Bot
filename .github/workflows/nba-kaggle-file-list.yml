name: List Kaggle NBA individual files without large download
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'iphone_bot/kaggle_file_listing.py'
      - '.github/workflows/nba-kaggle-file-list.yml'
permissions:
  contents: write
jobs:
  file_list:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kaggle official Python CLI and list public files only
        run: |
          python -m pip install kaggle
          python -m iphone_bot.kaggle_file_listing
      - name: Publish no-archive file inventory
        run: |
          set -euo pipefail
          cp docs/kaggle_nba_file_list.json "$RUNNER_TEMP/kaggle-files.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for n in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/kaggle-files.json" docs/kaggle_nba_file_list.json
            git add docs/kaggle_nba_file_list.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Record individual Kaggle NBA dataset file inventory'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
