name: NBA Live Matchup Tracker (offline)
on:
  pull_request:
    paths:
      - 'docs/index.html'
      - 'docs/live-prop-tracker.js'
      - 'iphone_bot/tests/test_live_prop_tracker.cjs'
      - '.github/workflows/nba-live-matchup-tracker-tests.yml'
  push:
    branches: ['feature/20261107-live-matchup-prop-tracker']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Test frozen model picks against live and final ESPN boxscore fixtures
        run: |
          node --check docs/live-prop-tracker.js
          node --test iphone_bot/tests/test_live_prop_tracker.cjs
      - name: Verify iPhone site syntax and on-demand game tracker
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('docs/index.html').read_text()
          assert '<script src="./live-prop-tracker.js?v=' in s or '<script src="./live-prop-tracker.js"></script>' in s
          assert 'id="live-prop-tracker"' in s
          assert 'id="live-prop-cards"' in s
          assert 'refreshSelectedLiveTracker().catch(()=>{})' in s
          assert 'const filtered=board.filter' in s and 'upcomingAIProps(ai)' in s
          assert 'isFrozenForecast' in Path('docs/live-prop-tracker.js').read_text()
          assert 'summaryGameMatch' in Path('docs/live-prop-tracker.js').read_text()
          assert 'LivePropTracker' in s
          assert 'return {...p,board_generated_at:' not in s
          print('Tracker shown only after game click; pregame-only AI Board preserved.')
          script=s.split('<script>',1)[-1].split('</script>',1)[0]
          Path('/tmp/nba-game-click-inline.js').write_text(script)
          PY
          node --check /tmp/nba-game-click-inline.js
      - name: No sportsbook API calls or rewritten pregame projections
        run: |
          python - <<'PY'
          from pathlib import Path
          js=Path('docs/live-prop-tracker.js').read_text()
          assert 'ODDS_API_KEY' not in js
          assert 'fetch(' not in js
          assert 'summary?event=' in Path('docs/index.html').read_text()
          print('ESPN read-only box score, existing immutable AI forecast.')
          PY
