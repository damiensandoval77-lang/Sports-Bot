name: Save live NBA player box score research checkpoints
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'iphone_bot/capture_live_research.py'
      - 'iphone_bot/tests/test_durable_research_storage.py'
      - '.github/workflows/nba-live-research-checkpoints.yml'
  schedule:
    # 30-minute checkpoints during the NBA evening/night in US Eastern time.
    # Public box scores only; never polls a sportsbook or changes predictions.
    - cron: '*/30 0-9,22-23 * * *'
permissions:
  contents: write
concurrency:
  group: nba-research-live-checkpoints
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate exact NBA game identity and live player statistics
        if: github.event_name == 'pull_request'
        run: |
          python -m py_compile iphone_bot/capture_live_research.py
          python -m unittest discover -s iphone_bot/tests -p 'test_durable_research_storage.py' -v
      - name: Save timestamped ESPN in-game observations without backfills
        run: |
          python -u iphone_bot/capture_live_research.py
      - name: Publish only new original observed live stat checkpoints
        run: |
          set -euo pipefail
          if [ ! -d docs/research_live ]; then
            echo 'No active games with verified box scores; no checkpoint to save'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/research_live/
          if git diff --cached --quiet; then echo 'No new observations'; exit 0; fi
          git commit -m 'Append immutable observed live NBA player stat checkpoint'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
          done
          exit 1
