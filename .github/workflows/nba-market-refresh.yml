name: Refresh full-slate NBA sportsbook props (lightweight)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'iphone_bot/fetch_props.py'
      - 'iphone_bot/tests/test_fetch_props.py'
      - '.github/workflows/nba-market-refresh.yml'
  schedule:
    # Two cost-controlled refreshes earlier in the Eastern afternoon (1/4pm EST).
    - cron: '12 18,21 * * *'
permissions:
  contents: write
concurrency:
  group: nba-prop-feed
  cancel-in-progress: false
jobs:
  markets:
    # A code push must not unexpectedly consume paid odds credits. Run on
    # the existing schedule or only when manually dispatched.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check event and player quote coverage
        if: github.event_name == 'pull_request'
        run: |
          python -m py_compile iphone_bot/fetch_props.py
          python -m unittest discover -s iphone_bot/tests -p 'test_fetch_props.py' -v
      - name: Retrieve as many current NBA player prop markets as provider credits allow
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_MAX_EVENTS: '15'
          ODDS_OUTCOMES_PER_EVENT: '1200'
        run: python -u iphone_bot/fetch_props.py
      - name: Validate coverage counters and no fabricated quotes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          status=json.load(open('docs/odds_fetch_status.json'))
          if status['status'] in ('FETCHED','FETCHED_PARTIAL'):
              report=json.load(open('docs/data.json'))
              assert report['slate_events_checked']<=report['slate_events_available']
              assert report['slate_events_not_checked']==report['slate_events_available']-report['slate_events_checked']
              assert report['slate_event_limit']>=15
              assert all(x['two_sided_outcomes']%2==0 for x in report['events_covered'])
              compact=json.load(open('docs/odds_compact.json'))
              assert compact['slate_events_checked']==report['slate_events_checked']
              assert len(compact['events_covered'])==report['slate_events_checked']
              assert all(x['published_two_sided_pairs']<=x['source_two_sided_pairs']
                         for x in compact['events_covered'])
              assert all(x['published_two_sided_pairs']>0 or x['source_two_sided_pairs']==0
                         for x in compact['events_covered'])
              assert len(compact['picks'])%2==0
              print('Compact game coverage:',len(compact['events_covered']),
                    'games; displayed quote rows:',len(compact['picks']))
              print('Markets:',report['market_types_requested'],'Checked:',report['slate_events_checked'],
                    'Provider available:',report['slate_events_available'])
          else:
              print('No successful refresh:',status['status'])
          PY
      - name: Freeze original real sportsbook quote input for longitudinal research
        if: success()
        run: python -u iphone_bot/preserve_research_inputs.py odds
      - name: Publish NBA sportsbook market coverage and provider health
        if: always()
        run: |
          git fetch origin main
          git add docs/data.json docs/odds_compact.json docs/odds_fetch_status.json
          if [ -d docs/research_inputs/odds ]; then git add docs/research_inputs/odds/; fi
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update NBA full slate player prop coverage and quota status'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
          done
          exit 1
