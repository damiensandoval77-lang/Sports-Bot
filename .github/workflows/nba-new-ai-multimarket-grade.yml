name: Grade frozen new AI PTS REB AST PRA (no provider credits)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'iphone_bot/multimarket_forecast_ledger.py'
      - '.github/workflows/nba-new-ai-multimarket-grade.yml'
  schedule:
    - cron: '39 8,10,12 * * *'
permissions:
  contents: write
concurrency:
  group: nba-new-ai-all-markets
  cancel-in-progress: false
jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify first pretip snapshot stays immutable
        run: python -m unittest discover -s iphone_bot/tests -p 'test_multimarket_forecast_ledger.py' -v
      - name: Grade only frozen new-model forecasts against verified final NBA boxes
        run: python -m iphone_bot.multimarket_forecast_ledger
      - name: Publish independent grade record without touching old AI
        run: |
          set -euo pipefail
          cp docs/lagged_matchup_all_market_ledger.json "$RUNNER_TEMP/new-ai-ledger.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/new-ai-ledger.json" docs/lagged_matchup_all_market_ledger.json
            git add docs/lagged_matchup_all_market_ledger.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Grade frozen four-market New AI forecasts from actual NBA final stats'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
