name: Settle saved NBA props using verified final player box scores
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'iphone_bot/settlement_merge.py'
      - 'iphone_bot/dnp_settlement.py'
      - 'iphone_bot/tests/test_dnp_settlement.py'
      - 'docs/verified_dnp_outcomes.json'
      - 'iphone_bot/paper_pick_pipeline.py'
      - 'iphone_bot/tests/test_paper_pick_pipeline.py'
      - 'docs/verified_postgame_boxscores.json'
      - 'docs/verified_wizards_hawks_boxscores.json'
      - 'docs/verified_spurs_kings_boxscores.json'
      - 'iphone_bot/tests/test_official_web_final_boxscores.py'
      - 'iphone_bot/missed_game_audit.py'
      - 'iphone_bot/projection_error_analysis.py'
      - 'iphone_bot/underprojection_research.py'
      - 'iphone_bot/extreme_miss_forensics.py'
      - 'iphone_bot/tests/test_extreme_miss_forensics.py'
      - 'iphone_bot/tests/test_underprojection_research.py'
      - 'iphone_bot/selection_quality_audit.py'
      - 'iphone_bot/tests/test_selection_quality_audit.py'
      - 'iphone_bot/combined_probability_audit.py'
      - 'iphone_bot/tests/test_combined_probability_audit.py'
      - 'iphone_bot/opportunity_backtest.py'
      - 'iphone_bot/shooting_efficiency_grade.py'
      - 'iphone_bot/minutes_opportunity_joint_grade.py'
      - 'iphone_bot/tests/test_minutes_opportunity_joint_grade.py'
      - 'iphone_bot/tests/test_shooting_efficiency_grade.py'
      - 'iphone_bot/assist_retrospective_backtest.py'
      - 'iphone_bot/tests/test_assist_retrospective_backtest.py'
      - 'iphone_bot/tests/test_opportunity_backtest.py'
      - 'iphone_bot/tests/test_projection_error_analysis.py'
      - 'iphone_bot/tests/test_missed_game_audit.py'
      - 'iphone_bot/fetch_final_boxscores.py'
      - 'iphone_bot/fetch_cbs_final_boxscores.py'
      - 'iphone_bot/tests/test_fetch_cbs_final_boxscores.py'
      - 'iphone_bot/tests/test_fetch_final_boxscores.py'
      - 'iphone_bot/tests/test_settlement_merge.py'
      - 'iphone_bot/tests/test_phase1_e2e_grading.py'
      - '.github/workflows/nba-postgame-settlement.yml'
  schedule:
    # Frequent postgame check, no sportsbook API calls, no retraining.
    - cron: '*/30 * * * *'
permissions:
  contents: write
concurrency:
  group: nba-prop-feed
  cancel-in-progress: false
jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal CBS parsing dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Test pregame integrity and settlement merging
        if: github.event_name == 'pull_request'
        run: |
          python -m unittest discover -s iphone_bot/tests -p 'test_settlement_merge.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_phase1_e2e_grading.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_dnp_settlement.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_missed_game_audit.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_projection_error_analysis.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_underprojection_research.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_extreme_miss_forensics.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_selection_quality_audit.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_combined_probability_audit.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_opportunity_backtest.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_shooting_efficiency_grade.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_minutes_opportunity_joint_grade.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_assist_retrospective_backtest.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_paper_pick_pipeline.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_official_web_final_boxscores.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_fetch_final_boxscores.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_fetch_cbs_final_boxscores.py' -v
      - name: Verify actual immutable pregame captures exist
        run: |
          python - <<'PY'
          import json
          from iphone_bot.paper_pick_pipeline import utc,identity
          p=json.load(open('docs/paper_pick_ledger.json'))
          rows=p['records']
          assert len(rows)>0,'No saved pregame predictions in working tree'
          assert len({identity(r) for r in rows})==len(rows),'Duplicated original quotes'
          assert all(utc(r['captured_at'])<utc(r['event_start']) for r in rows if r['status']!='INVALID_LATE_CAPTURE')
          print('Stored pregame predictions:',len(rows))
          PY
      - name: Fetch latest 2026-27 completed player logs when available
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -u iphone_bot/fetch_current_form.py || echo 'Current player CSV unavailable: final NBA/ESPN boxscores remain required for eligible games'
      - name: Fetch final NBA or ESPN player box scores for pending matchups
        run: python -u iphone_bot/fetch_final_boxscores.py
      - name: Try CBS Sports confirmed-final player boxes if official endpoints are blocked
        run: python -u iphone_bot/fetch_cbs_final_boxscores.py
      - name: Settle only actual verified matchups and saved pregame quotes
        run: python -u iphone_bot/paper_pick_pipeline.py
      - name: Analyze pregame Combined AI errors against settled final statistics
        run: python -u iphone_bot/projection_error_analysis.py
      - name: Audit statistical readiness and pregame edge quality by market
        run: python -u iphone_bot/selection_quality_audit.py
      - name: Audit frozen Combined-direction simulated probability proxies
        run: python -u iphone_bot/combined_probability_audit.py
      - name: Diagnose model underprojection by frozen player-production tier
        run: python -u iphone_bot/underprojection_research.py
      - name: Compare verified actual minutes to frozen production and research inputs
        run: python -u iphone_bot/extreme_miss_forensics.py
      - name: Compare historical opportunity challenger with immutable Combined AI
        run: python -u iphone_bot/opportunity_backtest.py
      - name: Compare fixed assist shadow retrospectively on saved pregame quotes
        run: python -u iphone_bot/assist_retrospective_backtest.py
      - name: Grade originally frozen Minutes V3 and AST-REB Opportunity V2 together
        run: python -u iphone_bot/minutes_opportunity_joint_grade.py
      - name: Grade only original frozen Shooting V1 candidate against verified points
        run: python -u iphone_bot/shooting_efficiency_grade.py
      - name: Explain missing Celtics and all historical pregame matchups
        run: python -u iphone_bot/missed_game_audit.py
      - name: Protect settlement and capture integrity
        run: |
          python - <<'PY'
          import json
          from iphone_bot.paper_pick_pipeline import identity,utc
          ledger=json.load(open('docs/paper_pick_ledger.json'))['records']
          result=json.load(open('docs/paper_results.json'))
          source=json.load(open('docs/final_boxscores_status.json'))
          assert len(ledger)==len({identity(r) for r in ledger})
          assert result['captured']==len(ledger)
          assert result['settled']==sum(r['status']=='SETTLED' for r in ledger)
          assert result['void_dnp']==sum(r['status']=='VOID_DNP' for r in ledger)
          assert all(utc(r['captured_at'])<utc(r['event_start']) for r in ledger if r['status']!='INVALID_LATE_CAPTURE')
          assert all(r.get('settlement_source') in ('NBA_CDN_FINAL','ESPN_FINAL','HISTORICAL_CSV_COMPLETED_GAME','CBS_FINAL_VERIFIED','FANTASYDATA_FINAL_CROSSCHECKED','CBS_SPORTS_LIVE_FINAL','NBA_OFFICIAL_WEB_FINAL_CROSSCHECKED')
                     and isinstance(r.get('actual'),(int,float))
                     for r in ledger if r['status']=='SETTLED')
          print('VALIDATED SETTLEMENT:',result['settled'],'settled,',result['pending'],'pending')
          print('FINAL BOXSCORE SOURCE:',source)
          PY
      - name: Publish verified results onto freshest main without losing captures
        run: |
          set -euo pipefail
          temp="$RUNNER_TEMP/nba-settlement"
          mkdir -p "$temp"
          cp docs/paper_pick_ledger.json "$temp/new_ledger.json"
          cp docs/final_boxscores_status.json "$temp/source_status.json"
          cp docs/cbs_final_boxscores_status.json "$temp/cbs_status.json"
          cp docs/missed_game_audit.json "$temp/missed_game_audit.json"
          cp docs/projection_error_analysis.json "$temp/projection_error_analysis.json"
          cp docs/underprojection_research.json "$temp/underprojection_research.json"
          cp docs/extreme_miss_forensics.json "$temp/extreme_miss_forensics.json"
          cp docs/opportunity_backtest.json "$temp/opportunity_backtest.json"
          cp docs/shooting_efficiency_v1_prospective_grades.json "$temp/shooting_v1_grades.json"
          cp docs/minutes_v3_opportunity_v2_prospective.json "$temp/minutes_opportunity_v2_grades.json"
          cp docs/assist_retrospective_backtest.json "$temp/assist_retrospective_backtest.json"
          cp docs/combined_probability_audit.json "$temp/combined_probability_audit.json"
          cp docs/selection_quality_audit.json "$temp/selection_quality_audit.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python iphone_bot/settlement_merge.py               docs/paper_pick_ledger.json "$temp/new_ledger.json"               docs/paper_pick_ledger.json docs/paper_results.json docs/current_form.json
            cp "$temp/source_status.json" docs/final_boxscores_status.json
            cp "$temp/cbs_status.json" docs/cbs_final_boxscores_status.json
            cp "$temp/missed_game_audit.json" docs/missed_game_audit.json
            # Recalculate from latest merged ledger, rather than copying an
            # analysis that may have missed concurrently settled predictions.
            # Rebuild nightly coverage from the freshest merged ledger, not stale runner captures.
            python -u iphone_bot/missed_game_audit.py
            python -u iphone_bot/projection_error_analysis.py
            python -u iphone_bot/underprojection_research.py
            python -u iphone_bot/extreme_miss_forensics.py
            python -u iphone_bot/opportunity_backtest.py
            python -u iphone_bot/shooting_efficiency_grade.py
            python -u iphone_bot/minutes_opportunity_joint_grade.py
            python -u iphone_bot/assist_retrospective_backtest.py
            python -u iphone_bot/combined_probability_audit.py
            python -u iphone_bot/selection_quality_audit.py
            git add docs/paper_pick_ledger.json docs/paper_results.json docs/final_boxscores_status.json docs/cbs_final_boxscores_status.json docs/missed_game_audit.json docs/projection_error_analysis.json docs/underprojection_research.json docs/extreme_miss_forensics.json docs/opportunity_backtest.json docs/assist_retrospective_backtest.json docs/shooting_efficiency_v1_prospective_grades.json docs/minutes_v3_opportunity_v2_prospective.json docs/combined_probability_audit.json docs/selection_quality_audit.json
            if git diff --cached --quiet; then echo 'Latest results already published'; exit 0; fi
            git commit -m 'Settle real pregame NBA props from verified completed player box scores'
            if git push origin HEAD:main; then echo 'Postgame settlement successfully published'; exit 0; fi
            echo 'Concurrent main update; rebuild from latest pregame captures' "$attempt"
          done
          echo 'Failed to publish settlement after five safe retries'
          exit 1
      - name: Flag ungraded completed matchups when all final boxscore providers fail
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          source=Path('docs/final_boxscores_status.json')
          if not source.exists():
              print('ERROR: final boxscore diagnostics missing')
              raise SystemExit(1)
          d=json.loads(source.read_text())
          eligible=d.get('pending_matchups',0)
          retrieved=d.get('retrieved_player_lines',0)
          errors=d.get('errors') or []
          result_path=Path('docs/paper_results.json')
          settled=json.loads(result_path.read_text()).get('settled',0) if result_path.exists() else 0
          verified_path=Path('docs/verified_postgame_boxscores.json')
          cross_checked=len(json.loads(verified_path.read_text()).get('records',[])) if verified_path.exists() else 0
          cbs_path=Path('docs/cbs_final_boxscores_status.json')
          cbs=json.loads(cbs_path.read_text()) if cbs_path.exists() else {}
          cbs_lines=cbs.get('matched_player_lines',0)
          # An accumulated settled count from yesterday cannot prove that
          # today's genuinely completed multi-player matchups were graded.
          # Only flag stale multi-player groups: a single DNP/unknown stat
          # should remain pending without causing an endless failure alert.
          from collections import defaultdict
          from datetime import datetime,timezone
          from iphone_bot.paper_pick_pipeline import utc
          now=datetime.now(timezone.utc)
          pending=json.loads(Path('docs/paper_pick_ledger.json').read_text()).get('records',[])
          stale=defaultdict(set)
          for row in pending:
              if row.get('status')!='PENDING':continue
              try:
                  start=utc(row['event_start'])
                  if (now-start).total_seconds()<5*3600:continue
                  stale[(row.get('game'),start.isoformat())].add(str(row.get('player_id')))
              except (ValueError,TypeError,KeyError):continue
          stale_multiplayer={game:len(players) for game,players in stale.items()
                            if len(players)>=3}
          if stale_multiplayer and not retrieved and not cbs_lines and errors:
              print('ERROR: Stale mult-player matchups not graded despite completed-game window')
              print('Backlog:',stale_multiplayer)
              print('Official feed failures:',errors)
              print('Old grades do not count as fresh grading evidence.')
              raise SystemExit(1)
          if eligible and not retrieved and not cbs_lines and not cross_checked and not settled and errors:
              print('ERROR: Settlement blocked by upstream final-boxscore provider failures!')
              print('Pending matchups eligible for verification:',eligible)
              print('Provider errors:')
              for err in errors:print(' -',err)
              print('No real player outcomes have been invented or graded.')
              raise SystemExit(1)
          print('Settlement source health:',d.get('status'),'eligible:',eligible,
                'final player rows:',retrieved)
          PY
