name: Refresh free native NBA PrizePicks standard lines
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'iphone_bot/fetch_native_prizepicks.py'
      - 'iphone_bot/prizepicks_provenance.py'
      - 'iphone_bot/tests/test_native_prizepicks.py'
      - 'iphone_bot/preserve_research_inputs.py'
      - 'iphone_bot/tests/test_fetch_prizepicks.py'
      - 'iphone_bot/tests/test_preserve_research_inputs.py'
      - '.github/workflows/nba-prizepicks-full-slate.yml'
  push:
    branches: ['main']
    paths:
      - 'docs/prizepicks_manual_refresh_request.json'
      - 'iphone_bot/fetch_native_prizepicks.py'
      - '.github/workflows/nba-prizepicks-full-slate.yml'
  schedule:
    # One free public request per window. No credentials or paid fallback.
    - cron: '28 0,16,18,20,22,23 * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: nba-independent-prizepicks-feed
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test strict native quote provenance and existing publisher compatibility
        run: |
          python -m unittest iphone_bot.tests.test_native_prizepicks iphone_bot.tests.test_fetch_prizepicks iphone_bot.tests.test_build_prizepicks_model_input iphone_bot.tests.test_publish_prizepicks_site iphone_bot.tests.test_validate_prizepicks_publish iphone_bot.tests.test_archive_prizepicks_pregame_lines -v
      - name: Fetch free public standard NBA quotes (no paid fallback)
        if: github.event_name != 'pull_request'
        run: python -m iphone_bot.fetch_native_prizepicks
      - name: Archive original independent pick'em lines and tiers
        if: github.event_name != 'pull_request'
        run: python -u iphone_bot/preserve_research_inputs.py prizepicks
      - name: Save real PrizePicks observations without modifying sportsbook odds
        if: github.event_name != 'pull_request'
        id: publish
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/prizepicks.json
          if [ -f docs/prizepicks_refresh_health.json ]; then git add docs/prizepicks_refresh_health.json; fi
          if [ -f docs/prizepicks_topup_probe.json ]; then git add docs/prizepicks_topup_probe.json; fi
          if [ -d docs/research_inputs/prizepicks ]; then
            git add docs/research_inputs/prizepicks/
          fi
          if git diff --cached --quiet; then echo 'No newly eligible real lines'; exit 0; fi
          git commit -m 'Update authentic independent NBA PrizePicks full-slate lines'
          for attempt in 1 2 3 4 5 6; do
            if git push origin HEAD:main; then echo 'changed=true' >> "$GITHUB_OUTPUT"; exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
          done
          exit 1
      - name: Immediately publish lines to site after verified public provider update
        if: github.event_name != 'pull_request' && steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run nba-prizepicks-site-publish.yml --ref main
