name: One-time authorized NBA provider recovery (single compact request)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docs/prizepicks_one_time_recovery_request.json
permissions:
  contents: write
  actions: write
concurrency:
  group: nba-independent-prizepicks-feed
  cancel-in-progress: false
jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PRIZEPICKS_FORCE_REFRESH: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Verify bounded recovery without network
        run: python -m unittest iphone_bot.tests.test_one_time_prizepicks_recovery -v
      - name: Consume authorization durably BEFORE any paid request
        id: claim
        run: |
          set -euo pipefail
          python -m iphone_bot.one_time_prizepicks_recovery claim
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/prizepicks_one_time_recovery.json
          git commit -m 'Consume single authorized NBA recovery attempt before paid request'
          # Only git transport may retry. If this claim cannot persist, no API call.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo 'claimed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
          done
          exit 1
      - name: One compact page, zero pagination, zero targeted reads, zero retries
        if: steps.claim.outputs.claimed == 'true'
        env:
          PRIZEPICKS_API_KEY: ${{ secrets.PRIZEPICKS_API_KEY }}
        run: python -m iphone_bot.one_time_prizepicks_recovery fetch
      - name: Persist outcome even on failed request (prior quotes preserved)
        if: always() && steps.claim.outputs.claimed == 'true'
        run: |
          set -euo pipefail
          git add docs/prizepicks_one_time_recovery.json docs/prizepicks.json docs/prizepicks_refresh_health.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record single NBA recovery outcome and only validated fresh quotes'
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
          done
          exit 1
      - name: Publish site only after authentic board was saved
        if: success() && steps.claim.outputs.claimed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path('docs/prizepicks_one_time_recovery.json').read_text())
          raise SystemExit(0 if receipt.get('fresh_quotes_published') is True else 1)
          PY
          then
            gh workflow run nba-prizepicks-site-publish.yml --ref main
          else
            echo 'No fresh quote publication; durable attempt remains consumed.'
            exit 1
          fi
