name: Publish lightweight PrizePicks site data and per-game coverage
on:
  workflow_dispatch:
  schedule:
    # Recovery run even when the upstream job did not dispatch this workflow.
    # Backup publish 18 minutes after each 00:28/16:28/18:28/20:28/22:28/23:28 UTC ingestion.
    - cron: '46 0,16,18,20,22,23 * * *'
  push:
    branches: [main]
    paths:
      - 'docs/prizepicks.json'
      - 'iphone_bot/publish_prizepicks_site.py'
      - 'iphone_bot/build_prizepicks_model_input.py'
      - 'iphone_bot/tests/test_build_prizepicks_model_input.py'
      - 'iphone_bot/tests/test_publish_prizepicks_site.py'
      - 'iphone_bot/validate_prizepicks_publish.py'
      - 'iphone_bot/archive_prizepicks_pregame_lines.py'
      - 'iphone_bot/tests/test_archive_prizepicks_pregame_lines.py'
      - 'iphone_bot/tests/test_validate_prizepicks_publish.py'
      - '.github/workflows/nba-prizepicks-site-publish.yml'
permissions:
  contents: write
  actions: write
concurrency:
  group: nba-prizepicks-site-data
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test genuine NBA PrizePicks site snapshot and date-safe coverage
        run: |
          python -m py_compile iphone_bot/publish_prizepicks_site.py
          python -m unittest discover -s iphone_bot/tests -p 'test_publish_prizepicks_site.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_build_prizepicks_model_input.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_validate_prizepicks_publish.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_archive_prizepicks_pregame_lines.py' -v
      - name: Build small read-only PrizePicks board and coverage
        run: python -u iphone_bot/publish_prizepicks_site.py
      - name: Build distinct authentic pick'em-only line comparison input
        run: python -m iphone_bot.build_prizepicks_model_input
      - name: Reject incomplete or unverified provider-to-site handoff before commit
        run: python -m iphone_bot.validate_prizepicks_publish
      - name: Retain independently verified pretip PrizePicks lines across provider refreshes
        run: python -m iphone_bot.archive_prizepicks_pregame_lines
      - name: Publish no-cost website research status
        id: publish
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ ! -f docs/prizepicks_site.json ]; then
            echo 'No eligible live PrizePicks board to publish'
            exit 0
          fi
          git add docs/prizepicks_site.json docs/prizepicks_status.json docs/prizepicks_model_input.json docs/prizepicks_pregame_line_archive.json
          if git diff --cached --quiet; then echo 'PrizePicks site status unchanged'; exit 0; fi
          git commit -m 'Publish compact real PrizePicks NBA lines and slate coverage'
          for attempt in 1 2 3 4 5 6; do
            if git push origin HEAD:main; then echo 'changed=true' >> "$GITHUB_OUTPUT"; exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
          done
          exit 1
      - name: Reconcile pregame archive and grading health after saved quotes change
        # GitHub Actions token commits do not trigger downstream push workflows.
        # Explicitly hand off committed immutable quotes to the no-cost audit.
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run nba-tonight-capture-gradeability.yml --ref main
      - name: Generate actual player AI projections immediately from new authentic lines
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run nba-prizepicks-ai-board.yml --ref main
      - name: Freeze separate PrizePicks research predictions when new lines appear
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run nba-prizepicks-ai-research.yml --ref main
      - name: Recover AI-versus-line research even when saved provider snapshot is unchanged
        # The provider's 40-credit refresh is NOT called here. If the previous
        # quick-join publisher failed after a successful site snapshot, replay
        # its zero-cost snapshot join instead of waiting for another paid fetch.
        # This also handles unchanged data whose downstream dispatch was lost.
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish_live_pp_ai_join.yml --ref main
