name: Verify funded PrizePicks top-up availability (single API page)
on:
  workflow_dispatch:
    inputs:
      allow_paid_request:
        description: 'Explicitly authorize one credit-backed provider request'
        type: boolean
        required: true
        default: false
permissions:
  contents: write
concurrency:
  group: prizepicks-one-time-topup-verification
  cancel-in-progress: false
jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' && inputs.allow_paid_request == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: One authenticated NBA compact page only, no retry or provider data committed
        env:
          PRIZEPICKS_API_KEY: ${{ secrets.PRIZEPICKS_API_KEY }}
        run: python -m iphone_bot.probe_prizepicks_topup --allow-paid-request
      - name: Publish access diagnostics without credentials or player lines
        run: |
          set -euo pipefail
          cp docs/prizepicks_topup_probe.json "$RUNNER_TEMP/topup-probe.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for n in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/topup-probe.json" docs/prizepicks_topup_probe.json
            git add docs/prizepicks_topup_probe.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Report one-shot PrizePicks top-up credit access'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
