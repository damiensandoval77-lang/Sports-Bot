name: Verify funded PrizePicks top-up availability (single API page)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'iphone_bot/probe_prizepicks_topup.py'
      - '.github/workflows/nba-prizepicks-topup-verification.yml'
permissions:
  contents: write
concurrency:
  group: prizepicks-one-time-topup-verification
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: One authenticated NBA compact page only, no retry or provider data committed
        env:
          PRIZEPICKS_API_KEY: ${{ secrets.PRIZEPICKS_API_KEY }}
        run: python -m iphone_bot.probe_prizepicks_topup
      - name: Publish access diagnostics without credentials or player lines
        run: |
          set -euo pipefail
          cp docs/prizepicks_topup_probe.json "$RUNNER_TEMP/topup-probe.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for n in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/topup-probe.json" docs/prizepicks_topup_probe.json
            git add docs/prizepicks_topup_probe.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Report one-shot PrizePicks top-up credit access'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
