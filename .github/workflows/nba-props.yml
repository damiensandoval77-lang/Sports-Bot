name: Update NBA sportsbook props
on:
  workflow_dispatch:
  schedule:
    - cron: '23 16 * * *'
permissions:
  contents: write
concurrency:
  group: nba-prop-feed
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch NBA player prop odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python3 iphone_bot/fetch_props.py
      - name: Publish changed dashboard data
        shell: bash
        run: |
          if git diff --quiet -- docs/data.json; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git commit -m "Update NBA sportsbook prop data"
          git push
