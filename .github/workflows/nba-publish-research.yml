name: Publish experimental NBA model forecasts
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r iphone_bot/requirements-training.txt pyarrow requests "scikit-learn>=1.4,<2" "joblib>=1.3,<2"
      - name: Rebuild box scores and existing historical features
        run: |
          python -u iphone_bot/download_archived_nba.py
          python -u -m src.sports.nba.features
      - name: Train experimental models on historical box scores
        run: python -u iphone_bot/train_provisional.py
      - name: Generate last-season-only forecasts
        run: python -u iphone_bot/publish_research_forecasts.py
      - name: Validate research-only labeling
        run: |
          python - <<'PY'
          import json
          d=json.load(open("docs/research_projections.json"))
          assert d["model_status"]=="RESEARCH_ONLY"
          assert d["historical_only"] or d["current"]
          assert len(d["players"])>100
          print("Generated",len(d["players"]),"experimental player projections; historical_only:",d["historical_only"])
          PY
      - name: Publish research forecast snapshot to GitHub Pages
        run: |
          git add docs/research_projections.json
          if git diff --cached --quiet; then
            echo "No changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update explicitly historical-only NBA research forecasts"
          git push
