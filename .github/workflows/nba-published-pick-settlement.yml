name: Verify and self-heal published NBA pick settlement
on:
  workflow_dispatch:
  # Bot commits do not trigger push: reconcile immediately after free graders.
  workflow_run:
    workflows:
      - Grade frozen new AI PTS REB AST PRA (no provider credits)
      - Grade frozen pretip AI forecasts against verified NBA finals
    types: [completed]
    branches: [main]
  schedule:
    - cron: '13,33,53 * * * *'
  push:
    branches: [main]
    paths:
      - 'iphone_bot/published_pick_settlement.py'
      - 'iphone_bot/tests/test_published_pick_settlement.py'
      - '.github/workflows/nba-published-pick-settlement.yml'
  pull_request:
    paths:
      - 'iphone_bot/published_pick_settlement.py'
      - 'iphone_bot/tests/test_published_pick_settlement.py'
      - '.github/workflows/nba-published-pick-settlement.yml'
permissions:
  contents: write
  actions: write
concurrency:
  group: nba-published-pick-settlement
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test every saved pick can settle without retroactive inference
        if: github.event_name == 'pull_request'
        run: |
          python -m py_compile iphone_bot/published_pick_settlement.py
          python -m unittest discover -s iphone_bot/tests -p 'test_published_pick_settlement.py' -v
      - name: Publish actual persisted pick settlement health
        if: github.event_name != 'pull_request'
        id: audit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            rc=0
            python -m iphone_bot.published_pick_settlement || rc=$?
            git add docs/dames-picks/published_pick_settlement.json
            if git diff --cached --quiet; then break; fi
            git commit -m 'Record honest published NBA pick settlement health'
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
          done
          # A degraded report is published honestly; let recovery run before
          # failing the job. No provider/paid API access in this workflow.
      - name: Dispatch only the failed settlement producer with cooldown
        if: github.event_name != 'pull_request' && steps.audit.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          report=docs/dames-picks/published_pick_settlement.json
          ready=$(jq -r '.status // "DEGRADED"' "$report")
          [ "$ready" != "READY" ] || exit 0
          actionable=$(jq -r '.actionable_verified_finals // 0' "$report")
          overdue=$(jq -r '.overdue_missing_verified_finals // 0' "$report")
          if [ "$actionable" -gt 0 ]; then
            workflow=nba-new-ai-multimarket-grade.yml
          elif [ "$overdue" -gt 0 ]; then
            workflow=grade_frozen_ai_forecasts.yml
          else
            echo 'Capture integrity failed; no safe automatic outcome inference'
            exit 0
          fi
          cutoff=$(($(date -u +%s)-35*60))
          # These graders are credit-free. A failed attempt is not evidence of
          # settled picks and must not block the next genuine recovery.
          recent=$(gh run list --workflow "$workflow" --limit 30 --json headBranch,createdAt,status,conclusion |
            jq --argjson cutoff "$cutoff" '[.[] | select(.headBranch=="main" and
              (.status != "completed" or
               (.conclusion == "success" and (.createdAt | fromdateiso8601)>=$cutoff)))] | length')
          if [ "$recent" -gt 0 ]; then
            echo "Skipping duplicate $workflow: recently started"
            exit 0
          fi
          gh workflow run "$workflow" --ref main
          echo "Recovery dispatched: $workflow"
      - name: Keep genuinely failed pick settlement visible
        if: always() && github.event_name != 'pull_request' && steps.audit.outcome == 'success'
        run: |
          python - <<'PY'
          import json,sys
          report=json.load(open('docs/dames-picks/published_pick_settlement.json'))
          if report.get('status')!='READY':
              print('::error::Published picks not fully captured/settled:',report.get('issues'))
              sys.exit(1)
          PY
