name: Grade actual completed NBA paper picks (no paid odds calls)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nba-real-results.yml'
      - 'iphone_bot/paper_pick_pipeline.py'
      - 'iphone_bot/tests/test_paper_pick_pipeline.py'
      - 'iphone_bot/model_performance.py'
      - 'iphone_bot/weight_research.py'
      - 'iphone_bot/fetch_official_injuries.py'
      - 'iphone_bot/tests/test_research_upgrades.py'
      - 'iphone_bot/tests/test_model_performance.py'
      - 'iphone_bot/fetch_current_form.py'
      - 'iphone_bot/tests/test_pipeline_health.py'
  schedule:
    - cron: '37 12,18 * * *'
permissions:
  contents: write
concurrency:
  group: nba-prop-feed
  cancel-in-progress: false
jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Start from latest published ledger
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Install game log and settlement dependencies
        run: pip install numpy pandas joblib "scikit-learn>=1.4,<2"
      - name: Validate paper pick invariants and dashboard JavaScript
        run: |
          python -m py_compile iphone_bot/paper_pick_pipeline.py iphone_bot/model_performance.py iphone_bot/weight_research.py iphone_bot/fetch_current_form.py
          python -m unittest discover -s iphone_bot/tests -p "test_pipeline_health.py" -v
          python -m unittest discover -s iphone_bot/tests -p "test_model_performance.py" -v
          python -m unittest discover -s iphone_bot/tests -p "test_paired_model_comparison.py" -v
          python -m unittest discover -s iphone_bot/tests -p "test_research_upgrades.py" -v
          python -m unittest discover -s iphone_bot/tests -p "test_paper_pick_pipeline.py" -v
          python - <<'PY'
          from pathlib import Path
          html=Path('docs/index.html').read_text()
          assert 'tab-results' in html
          Path('/tmp/sports-bot-live-results.js').write_text(html.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/sports-bot-live-results.js
      - name: Refresh completed real NBA player game logs
        run: python -u iphone_bot/fetch_current_form.py
      - name: Refresh official NBA injury report (not a betting adjustment)
        run: |
          python -m pip install "pypdf>=5,<7"
          python -u iphone_bot/fetch_official_injuries.py
      - name: Settle previously locked predictions from actual completed games
        run: python -u iphone_bot/paper_pick_pipeline.py
      - name: Verify no predictions were retroactively changed
        run: |
          python - <<'PY'
          import json
          from iphone_bot.paper_pick_pipeline import identity
          data=json.load(open('docs/paper_pick_ledger.json'))['records']
          report=json.load(open('docs/paper_results.json'))
          assert len(data)==len({identity(x) for x in data})
          assert all(x['paper_only'] is True for x in data)
          assert all(x['status'] in ('PENDING','SETTLED','INVALID_LATE_CAPTURE') for x in data)
          assert report['real_money_wagered'] is False
          perf=report['performance']
          assert perf['status']=='PREGAME_FORECASTS_GRADED_AGAINST_REAL_BOXSCORES'
          health=report['pipeline_health']
          assert health['pending_total']==report['pending']
          assert health['pending_over_48_hours']<=health['pending_past_game_buffer']<=report['pending']
          assert health['latest_completed_player_game_date'] is not None
          print('Completed boxscore date:',health['latest_completed_player_game_date'])
          print('Overdue ungraded quotes:',health['pending_over_48_hours'])
          assert perf['independent_settled_markets']<=report['settled']
          assert set(perf['models'])=={'original','opponent_aware','combined'}
          assert set(perf['by_stat'])=={'PTS','REB','AST','PRA'}
          assert report['weight_research']['live_model_unchanged'] is True
          assert all(x['observations']<=perf['independent_settled_markets'] for x in perf['models'].values())
          print('Real completed-game paper results:', report['settled'], 'pending:', report['pending'])
          PY
      - name: Publish finished real-game paper grades
        run: |
          git add docs/injury_context.json docs/current_form.json docs/paper_pick_ledger.json docs/paper_results.json
          if git diff --cached --quiet; then echo "No new grades"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish settled NBA paper picks from actual completed games"
          git reset --hard HEAD
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
          done
          exit 1
