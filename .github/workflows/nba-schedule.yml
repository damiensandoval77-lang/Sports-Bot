name: Publish full NBA daily schedule (independent of sportsbook)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'iphone_bot/fetch_nba_schedule.py'
      - 'iphone_bot/fetch_hoopr_nba_schedule.py'
      - 'iphone_bot/season_schedule_baseline.py'
      - 'iphone_bot/tests/test_season_schedule_baseline.py'
      - 'iphone_bot/publish_nba_schedule_atomic.py'
      - 'iphone_bot/tests/test_publish_nba_schedule_atomic.py'
      - 'iphone_bot/tests/test_fetch_nba_schedule.py'
      - '.github/workflows/nba-schedule.yml'
  schedule:
    - cron: '9 13,16,19,22,1,4 * * *'
permissions:
  contents: write
concurrency:
  group: nba-schedule-feed
  cancel-in-progress: false
jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test Eastern-date and schedule parsing
        if: github.event_name == 'pull_request'
        run: |
          python -m py_compile iphone_bot/fetch_nba_schedule.py
          python -m unittest discover -s iphone_bot/tests -p 'test_fetch_nba_schedule.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_season_schedule_baseline.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_publish_nba_schedule_atomic.py' -v
      - name: Refresh verified full season fixture schedule before private NBA/ESPN fallbacks
        run: |
          pip install pandas pyarrow
          python -u iphone_bot/fetch_hoopr_nba_schedule.py || NBA_SCHEDULE_SOURCE_MODE=auto python -u iphone_bot/fetch_nba_schedule.py
      - name: Publish diagnostic if all schedule providers reject GitHub Actions
        if: failure()
        run: |
          if [ ! -f docs/nba_schedule_status.json ]; then exit 0; fi
          git fetch origin main
          git add docs/nba_schedule_status.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish NBA schedule source failure diagnostic'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
          done
          exit 1
      - name: Verify published schedule is not presented as player props
        run: |
          python - <<'PY'
          import json
          report=json.load(open('docs/nba_schedule.json'))
          assert report['status'] in ('THIRD_PARTY_NBA_SCHEDULE_ONLY',
                                     'PARTIAL_CACHED_SPORTSBOOK_SCHEDULE',
                                     'PROVIDER_NBA_SCORES_PARTIAL_SLATE',
                                     'SCHEDULE_UNAVAILABLE')
          assert type(report['coverage_complete']) is bool
          assert not report['coverage_complete'] if report['status'] in ('PARTIAL_CACHED_SPORTSBOOK_SCHEDULE','PROVIDER_NBA_SCORES_PARTIAL_SLATE') else True
          assert report['has_sportsbook_props'] is False
          assert report['has_verified_player_availability'] is False
          assert len(report['games'])==report['total_games']
          assert len({x['id'] for x in report['games']})==report['total_games']
          assert all(x['game_state'] in ('pre','in','post','unknown') for x in report['games'])
          assert all(x['date_eastern'] in report['dates_eastern'] for x in report['games'])
          print('Complete NBA schedule games:', report['total_games'])
          PY
      - name: Verify full-season master exists and matches published game identities
        run: |
          python - <<'PY'
          import json
          from iphone_bot.season_schedule_baseline import validate
          from pathlib import Path
          path=Path('docs/nba_season_schedule_2026_27.json')
          if not path.exists():
              raise SystemExit('FAIL: No full-season master; a two-day schedule is insufficient')
          season=validate(json.loads(path.read_text()))
          daily=json.loads(Path('docs/nba_schedule.json').read_text())
          assert daily.get('coverage_complete') is True
          assert season['total_games']>=900
          print('Validated published full NBA season fixture master:',season['total_games'],'games')
          PY
      - name: Publish daily and full-season fixtures with safe concurrent reconciliation
        run: |
          set -euo pipefail
          cp docs/nba_schedule.json "$RUNNER_TEMP/new-day.json"
          cp docs/nba_season_schedule_2026_27.json "$RUNNER_TEMP/new-season.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python -m iphone_bot.publish_nba_schedule_atomic
            git add docs/nba_schedule.json docs/nba_schedule_status.json docs/nba_season_schedule_2026_27.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Refresh complete NBA season and safe daily fixture slate'
            if git push origin HEAD:main; then exit 0; fi
          done
          echo "::error::Cannot atomically publish verified NBA schedule after safe retries"
          exit 1
