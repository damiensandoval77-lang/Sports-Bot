name: Publish full NBA daily schedule (independent of sportsbook)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'iphone_bot/fetch_nba_schedule.py'
      - 'iphone_bot/tests/test_fetch_nba_schedule.py'
      - '.github/workflows/nba-schedule.yml'
  schedule:
    - cron: '9 13,16,19,22,1,4 * * *'
permissions:
  contents: write
concurrency:
  group: nba-schedule-feed
  cancel-in-progress: false
jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test Eastern-date and schedule parsing
        run: |
          python -m py_compile iphone_bot/fetch_nba_schedule.py
          python -m unittest discover -s iphone_bot/tests -p 'test_fetch_nba_schedule.py' -v
      - name: Fetch genuine current-date NBA fixtures from NBA/ESPN; fall back only if both unavailable
        env:
          NBA_SCHEDULE_SOURCE_MODE: auto
        run: python -u iphone_bot/fetch_nba_schedule.py
      - name: Publish diagnostic if all schedule providers reject GitHub Actions
        if: failure()
        run: |
          if [ ! -f docs/nba_schedule_status.json ]; then exit 0; fi
          git fetch origin main
          git add docs/nba_schedule_status.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish NBA schedule source failure diagnostic'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
          done
          exit 1
      - name: Verify published schedule is not presented as player props
        run: |
          python - <<'PY'
          import json
          report=json.load(open('docs/nba_schedule.json'))
          assert report['status'] in ('THIRD_PARTY_NBA_SCHEDULE_ONLY',
                                     'PARTIAL_CACHED_SPORTSBOOK_SCHEDULE',
                                     'PROVIDER_NBA_SCORES_PARTIAL_SLATE',
                                     'SCHEDULE_UNAVAILABLE')
          assert type(report['coverage_complete']) is bool
          assert not report['coverage_complete'] if report['status'] in ('PARTIAL_CACHED_SPORTSBOOK_SCHEDULE','PROVIDER_NBA_SCORES_PARTIAL_SLATE') else True
          assert report['has_sportsbook_props'] is False
          assert report['has_verified_player_availability'] is False
          assert len(report['games'])==report['total_games']
          assert len({x['id'] for x in report['games']})==report['total_games']
          assert all(x['game_state'] in ('pre','in','post','unknown') for x in report['games'])
          assert all(x['date_eastern'] in report['dates_eastern'] for x in report['games'])
          print('Complete NBA schedule games:', report['total_games'])
          PY
      - name: Preserve original NBA fixture snapshot for future missing-game audits
        run: python -u iphone_bot/preserve_research_inputs.py schedule
      - name: Publish schedule feed
        run: |
          git fetch origin main
          git add docs/nba_schedule.json docs/nba_schedule_status.json
          if [ -d docs/research_inputs/schedule ]; then git add docs/research_inputs/schedule/; fi
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish complete Eastern-date NBA slate'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
          done
          exit 1
