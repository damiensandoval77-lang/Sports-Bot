name: Audit NBA slate versus verified sportsbook props (no API credits)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/odds_fetch_status.json'
      - 'docs/nba_schedule.json'
      - 'docs/ai_pregame_archive.json'
      - 'iphone_bot/odds_slate_health.py'
      - 'iphone_bot/tests/test_odds_slate_health.py'
      - '.github/workflows/nba-slate-coverage-health.yml'
  schedule:
    - cron: '27 18,21 * * *'
permissions:
  contents: write
concurrency:
  group: nba-slate-health-only
  cancel-in-progress: false
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify independent schedule and prop coverage logic
        if: github.event_name == 'pull_request'
        run: |
          python -m unittest discover -s iphone_bot/tests -p 'test_odds_slate_health.py' -v
          python -m py_compile iphone_bot/odds_slate_health.py
      - name: Publish honest coverage and credit health without API requests
        run: |
          python iphone_bot/odds_slate_health.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/odds_slate_health.json
          if git diff --cached --quiet; then echo 'No status changes'; exit 0; fi
          git commit -m 'Update independent NBA slate odds credit and missing-games status'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
          done
          exit 1
