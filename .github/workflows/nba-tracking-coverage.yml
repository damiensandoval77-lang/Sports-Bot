name: Keep NBA tracking opportunity coverage transparent
on:
  pull_request:
    paths:
      - 'iphone_bot/tracking_coverage_status.py'
      - 'iphone_bot/tests/test_tracking_coverage*.py'
      - '.github/workflows/nba-tracking-coverage.yml'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/ai_comparisons.json'
      - 'docs/projection_upgrade_status.json'
      - 'docs/tracking_provider_access_status.json'
      - 'iphone_bot/tracking_coverage_status.py'
      - 'iphone_bot/tests/test_tracking_coverage*.py'
      - '.github/workflows/nba-tracking-coverage.yml'
permissions:
  contents: write
concurrency:
  group: nba-tracking-coverage
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref || 'main' }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Test transparent coverage accounting
        run: python -m unittest discover -s iphone_bot/tests -p 'test_tracking_coverage*.py' -v
      - name: Calculate research coverage from published board and grades
        if: github.event_name != 'pull_request'
        run: python -m iphone_bot.tracking_coverage_status
      - name: Publish coverage without provider statistical rows
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for n in $(seq 1 10); do
            git fetch origin main
            git reset --hard origin/main
            # Recompute from the newest inputs after every conflict; never
            # overwrite a newer report with a saved stale temporary copy.
            python -m iphone_bot.tracking_coverage_status
            git add docs/tracking_coverage_status.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish honest current AST and REB tracking coverage'
            if git push origin HEAD:main; then exit 0; fi
            if [ "$n" -lt 10 ]; then sleep "$((n * 2 + RANDOM % 3))"; fi
          done
          exit 1
