name: Inspect NBA potential-assist and rebound-chance provider safely
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'iphone_bot/probe_tracking_provider.py'
      - 'iphone_bot/tests/test_probe_tracking_provider.py'
      - '.github/workflows/nba-tracking-provider-access.yml'
permissions:
  contents: write
concurrency:
  group: tracking-provider-access
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate tracking metadata parser and fail-closed permissions
        if: github.event_name == 'pull_request'
        run: python -m unittest discover -s iphone_bot/tests -p 'test_probe_tracking_provider.py' -v
      - name: Query a licensed provider only on explicit manual run
        if: github.event_name == 'workflow_dispatch'
        env:
          SPORTQUANTA_API_KEY: ${{ secrets.SPORTQUANTA_API_KEY }}
        run: python -m iphone_bot.probe_tracking_provider
      - name: Write no-key status on test-only push
        if: github.event_name != 'workflow_dispatch'
        env:
          SPORTQUANTA_API_KEY: ''
        run: python -m iphone_bot.probe_tracking_provider
      - name: Publish non-statistical access status only
        run: |
          set -euo pipefail
          cp docs/tracking_provider_access_status.json "$RUNNER_TEMP/tracking-access.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for n in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/tracking-access.json" docs/tracking_provider_access_status.json
            git add docs/tracking_provider_access_status.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Record tracking source entitlement and schema status, no stats'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
