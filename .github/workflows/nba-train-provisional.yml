name: Train NBA provisional prediction models
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: iphone_bot/requirements-training.txt
      - name: Install dataset and model dependencies
        run: pip install -r iphone_bot/requirements-training.txt pyarrow requests "scikit-learn>=1.4,<2" "joblib>=1.3,<2"
      - name: Reproduce validated historical dataset
        run: |
          python -u iphone_bot/download_archived_nba.py
          python -u -m src.sports.nba.features
      - name: Validate prepared data
        run: |
          python - <<'PY'
          import pandas as pd
          df = pd.read_csv("data/nba/processed/training_dataset.csv", low_memory=False)
          assert len(df)>1000, f"Too few rows: {len(df)}"
          assert {"PTS","REB","AST","PRA","GAME_DATE"}.issubset(df.columns)
          print("Validated",len(df),"training records")
          PY
      - name: Train and evaluate four provisional regression models
        run: python -u iphone_bot/train_provisional.py
      - name: Check outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          base=Path("models/nba/provisional")
          report=json.loads((base/"evaluation.json").read_text())
          assert len(report["metrics"])==4
          for stat in ("PTS","REB","AST","PRA"):
              assert (base/f"{stat}_model.joblib").stat().st_size>1000
          print(json.dumps(report,indent=2))
          PY
      - name: Upload models and holdout metrics
        uses: actions/upload-artifact@v4
        with:
          name: nba-provisional-models
          path: models/nba/provisional/
          retention-days: 14
          if-no-files-found: error
