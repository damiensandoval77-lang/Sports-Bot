name: Publish trained NBA AI props for every available game
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'iphone_bot/compare_live_models.py'
      - 'iphone_bot/enrich_current_shooting.py'
      - 'iphone_bot/tests/test_enrich_current_shooting.py'
      - 'docs/odds_compact.json'
      - 'iphone_bot/injury_projection_adjustment.py'
      - 'iphone_bot/tests/test_injury_projection_adjustment.py'
      - 'iphone_bot/tests/test_player_name_matching.py'
      - 'iphone_bot/market_coverage_audit.py'
      - 'iphone_bot/tests/test_market_coverage_audit.py'
      - 'iphone_bot/capture_ai_board.py'
      - 'iphone_bot/projection_upgrade_research.py'
      - 'iphone_bot/prospective_research_gate.py'
      - 'iphone_bot/tests/test_prospective_research_gate.py'
      - 'iphone_bot/quote_capture_coverage.py'
      - 'iphone_bot/tests/test_quote_capture_coverage.py'
      - 'iphone_bot/opportunity_backtest.py'
      - 'iphone_bot/opponent_context_v2.py'
      - 'iphone_bot/rebound_shadow_v1.py'
      - 'iphone_bot/tracking_opportunities_v1.py'
      - 'iphone_bot/import_tracking_export.py'
      - 'iphone_bot/tests/test_import_tracking_export.py'
      - 'iphone_bot/tests/test_tracking_opportunities_v1.py'
      - 'iphone_bot/tests/test_rebound_shadow_v1.py'
      - 'iphone_bot/lineup_onoff_research.py'
      - 'iphone_bot/import_authorized_onoff.py'
      - 'iphone_bot/pbpstats_request_plan.py'
      - 'iphone_bot/pbpstats_wowy_adapter.py'
      - 'iphone_bot/pbpstats_game_coverage.py'
      - 'iphone_bot/tests/test_pbpstats_game_coverage.py'
      - 'iphone_bot/assemble_pbpstats_wowy.py'
      - 'iphone_bot/tests/test_assemble_pbpstats_wowy.py'
      - 'iphone_bot/tests/test_pbpstats_wowy_adapter.py'
      - 'iphone_bot/tests/test_pbpstats_request_plan.py'
      - 'iphone_bot/tests/test_import_authorized_onoff.py'
      - 'iphone_bot/tests/test_lineup_onoff_research.py'
      - 'iphone_bot/tests/test_opponent_context_v2.py'
      - 'iphone_bot/tests/test_opportunity_backtest.py'
      - 'iphone_bot/tests/test_projection_upgrade_research.py'
      - 'iphone_bot/tests/test_capture_ai_board.py'
      - '.github/workflows/nba-trained-ai-board.yml'
  schedule:
    # Market-refresh job runs at :12. This job reads its published compact feed
    # and NEVER consumes additional sportsbook API credits.
    # Re-evaluate the published market feed near Eastern evening tipoffs
    # after official NBA availability reports update. No new sportsbook call.
    - cron: '41 0,18,21,23 * * *'
permissions:
  contents: write
concurrency:
  group: nba-prop-feed
  cancel-in-progress: false
jobs:
  trained_board:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test immutable pregame captures and paper settlement
        if: github.event_name == 'pull_request'
        run: |
          python -m unittest discover -s iphone_bot/tests -p 'test_capture_ai_board.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_projection_upgrade_research.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_prospective_research_gate.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_quote_capture_coverage.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_opportunity_backtest.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_opponent_context_v2.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_rebound_shadow_v1.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_tracking_opportunities_v1.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_import_tracking_export.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_lineup_onoff_research.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_import_authorized_onoff.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_pbpstats_request_plan.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_pbpstats_wowy_adapter.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_pbpstats_game_coverage.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_assemble_pbpstats_wowy.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_probability_audit.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_paper_pick_pipeline.py' -v
      - name: Confirm actual current market coverage and quote freshness
        run: |
          python - <<'PY'
          import json,datetime
          p=json.load(open('docs/odds_compact.json'))
          assert p['source']=='THE_ODDS_API_VERIFIED_COMPACT_PLAYER_PROPS'
          assert p['is_live'] is True
          now=datetime.datetime.now(datetime.timezone.utc)
          updated=datetime.datetime.fromisoformat(p['updated_at'].replace('Z','+00:00'))
          assert 0 <= (now-updated).total_seconds() <= 6*3600, 'Current sportsbook quote feed stale'
          valid={x['game'] for x in p['picks'] if x['direction']=='More'}
          print('Checked sportsbook fixtures:',p['slate_events_checked'],
                'with paired quote rows:',len(p['picks']),
                'games with markets:',len(valid))
          assert valid, 'No available real player prop markets'
          PY
      - name: Install existing model training dependencies
        run: pip install -r iphone_bot/requirements-training.txt pyarrow requests "scikit-learn>=1.4,<2" "joblib>=1.3,<2"
      - name: Recreate chronological historical models
        run: |
          python -u iphone_bot/download_archived_nba.py
          python -u -m src.sports.nba.features
          python -u iphone_bot/train_provisional.py
      - name: Train original opponent-aware model for same combined projection
        run: python -u iphone_bot/train_defense_shadow.py
      - name: Download verified current-season NBA player games
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -u iphone_bot/fetch_current_form.py
      - name: Refresh official NBA injury statuses before producing AI projections
        run: |
          python -m pip install --disable-pip-version-check "pypdf>=5,<7"
          python -u iphone_bot/fetch_official_injuries.py
      - name: Validate and import current NBA player shooting rates for research only
        run: |
          python -m unittest discover -s iphone_bot/tests -p 'test_enrich_current_shooting.py' -v
          python -u iphone_bot/enrich_current_shooting.py
      - name: Validate injury-updated projections for official OUT players
        if: github.event_name == 'pull_request'
        run: |
          python -m py_compile iphone_bot/injury_projection_adjustment.py iphone_bot/compare_live_models.py
          python -m unittest discover -s iphone_bot/tests -p 'test_injury_projection_adjustment.py' -v
      - name: Check Unicode player identity matching across sportsbook and NBA roster
        env:
          PYTHONPATH: ${{ github.workspace }}/iphone_bot:${{ github.workspace }}
        if: github.event_name == 'pull_request'
        run: python -m unittest discover -s iphone_bot/tests -p 'test_player_name_matching.py' -v
      - name: Preserve the exact original trained-model projection and probability pipeline
        env:
          NBA_AI_ODDS_INPUT: odds_compact.json
        run: |
          python -m py_compile iphone_bot/compare_live_models.py
          python -u iphone_bot/compare_live_models.py
      - name: Audit which sportsbook-listed players and stats lack AI cards
        env:
          PYTHONPATH: ${{ github.workspace }}/iphone_bot:${{ github.workspace }}
        run: |
          python -m unittest discover -s iphone_bot/tests -p 'test_market_coverage_audit.py' -v
          python -u iphone_bot/market_coverage_audit.py
      - name: Verify real line and unchanged empirical probability semantics
        run: |
          python - <<'PY'
          import json,datetime
          p=json.load(open('docs/ai_comparisons.json'))
          market=json.load(open('docs/odds_compact.json'))
          assert p['status']=='EXPERIMENTAL_NON_CALIBRATED'
          assert p['odds_input_file']=='odds_compact.json'
          assert p['verified_current_matchups'] is True
          assert p['is_prizepicks'] is False
          assert p['comparison_rows_published']==len(p['comparisons'])
          assert p['comparison_rows_truncated']==0
          assert p['experimental_probability_method']=='CHRONOLOGICAL_VALIDATION_EMPIRICAL_RESIDUALS_UNCALIBRATED'
          assert p['real_market_probabilities_calibrated'] is False
          assert p['combined_projection_enabled'] is True
          assert p['combined_projection_method']=='TWO_MODEL_MEDIAN_EQUAL_WEIGHT_RESEARCH_ONLY'
          assert p['minutes_v2_applied_to_live_model'] is False
          assert p['shot_profile_applied_to_live_model'] is False
          assert p['games_with_ai_props']==len({x['game'] for x in p['comparisons']})
          assert all(x['sample_games']>=5 for x in p['comparisons'])
          now=datetime.datetime.now(datetime.timezone.utc)
          assert all(datetime.datetime.fromisoformat(x['start'].replace('Z','+00:00'))>now
                     for x in p['comparisons'])
          print('VERIFIED TRAINED AI:',len(p['comparisons']),'props across',
                p['games_with_ai_props'],'NBA games')
          print('Skipped:',p['skipped'])
          # No requirement for a predetermined number of games: never invent
          # projections for roster mismatches, missing logs or closed markets.
          PY
      - name: Freeze every eligible AI comparison before scheduled tipoff
        run: python -u iphone_bot/capture_ai_board.py
      - name: Verify no eligible bookmaker quote was silently dropped
        run: |
          python - <<'PY'
          import json
          x=json.load(open('docs/pregame_quote_capture_coverage.json'))
          assert x['eligible_quote_missing_from_ledger']==0
          print('Every real quote accounted for:',x['eligibility_by_reason'])
          PY
      - name: Lock opportunity, official injury, V4 shadow and 20k calibration research
        run: |
          python -u iphone_bot/projection_upgrade_research.py
          python - <<'PY'
          import json
          r=json.load(open("docs/projection_upgrade_status.json"))
          assert r["live_combined_ai_unchanged"] is True
          assert r["live_simulated_hit_percentages_unchanged"] is True
          assert r["defender_v4"]["v4_live_applied"] is False
          assert all(x["changes_live_probabilities"] is False for x in r["simulation_audit"].values())
          gate=r["prospective_capture_integrity"]
          assert gate["all_new_rows_have_three_diagnostics"],'New research diagnostics not frozen'
          assert gate["new_research_rows"]==r["new_samples"],'Unexpected research capture count'
          print("Pregame opportunity and V4 research locked:",r["locked_samples"],
                "new fully diagnosed rows:",gate["new_research_rows"])
          PY
      - name: Verify frozen pregame model snapshots exist
        run: |
          python - <<'PY'
          import json
          from iphone_bot.paper_pick_pipeline import identity,utc
          ledger=json.load(open('docs/paper_pick_ledger.json'))['records']
          result=json.load(open('docs/paper_results.json'))
          assert len(ledger)==len({identity(x) for x in ledger})
          assert all(utc(x['captured_at'])<utc(x['event_start']) for x in ledger if x['status']!='INVALID_LATE_CAPTURE')
          assert result['captured']==len(ledger)
          assert result['performance']['status']=='PREGAME_FORECASTS_GRADED_AGAINST_REAL_BOXSCORES'
          print('Locked individual bookmaker offers:',len(ledger))
          print('Already settled:',result['settled'],'awaiting outcome:',result['pending'])
          PY
      - name: Publish AI board and immutable pregame paper records immediately
        run: |
          git fetch origin main
          git add docs/ai_comparisons.json docs/current_form.json docs/paper_pick_ledger.json docs/paper_results.json docs/projection_upgrade_ledger.json docs/projection_upgrade_status.json docs/ai_market_coverage.json docs/pregame_quote_capture_coverage.json
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish trained full-slate NBA AI comparisons'
          git reset --hard HEAD
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
          done
          exit 1
