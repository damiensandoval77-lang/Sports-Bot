name: Validate NBA dashboard against false probability confidence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - '.github/workflows/nba-ui-integrity.yml'
permissions:
  contents: read
jobs:
  validate_ui:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate HTML script syntax and confidence truthfulness
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('docs/index.html').read_text()
          assert 'RAW MODEL DIRECTION' in html
          assert 'MODEL CONFIDENCE","UNVERIFIED"' in html
          assert 'frozenResearchScreen(p)' in html
          assert 'Market hit rates:' in html
          assert 'Highest uncalibrated estimate' not in html
          assert 'SIM EST. %",validEstimate(p)' not in html
          Path('/tmp/sports-bot-board.js').write_text(html.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/sports-bot-board.js
