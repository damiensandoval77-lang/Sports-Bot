name: NFL live player-stat snapshots
on:
  pull_request:
    paths:
      - 'scripts/fetch_nfl_live.py'
      - 'tests/test_nfl_live.py'
      - 'tests/test_nfl_live_schedule.py'
      - 'docs/nfl/index.html'
      - '.github/workflows/nfl-live-tracker.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_nfl_live.py'
      - '.github/workflows/nfl-live-tracker.yml'
  workflow_dispatch:
  schedule:
    # UTC windows cover all 272 published fixtures, including Thursday-night
    # play after midnight Friday, international Sundays and holiday Saturdays.
    # Public ESPN only; GitHub Actions cron can run late.
    - cron: '*/5 0-5 * 1,2,9-12 0,1,2,4,5,6'
    - cron: '*/5 13-16 * 1,2,9-12 0'
    - cron: '*/5 17-23 * 1,2,9-12 0,1,4,5,6'
permissions:
  contents: write
concurrency:
  group: nfl-live-snapshots
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify live-stat normalization and non-destructive updates
        if: github.event_name == 'pull_request'
        run: |
          python -m unittest discover -s tests -p 'test_nfl_live.py' -v
          python -m unittest discover -s tests -p 'test_nfl_live_guard.py' -v
          python -m unittest discover -s tests -p 'test_nfl_live_schedule.py' -v
      - name: Smoke-test actual ESPN live provider during PR
        if: github.event_name == 'pull_request'
        run: python scripts/fetch_nfl_live.py
      - name: Fetch current ESPN NFL live summary and player stats
        if: github.event_name != 'pull_request'
        run: python scripts/fetch_nfl_live.py
      - name: Publish only the separate live-stat JSON
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name nfl-live-tracker
          git config user.email actions@users.noreply.github.com
          cp docs/nfl/data/live_2026.json "$RUNNER_TEMP/nfl-live.json"
          for i in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            # A delayed job must NEVER overwrite newer/more complete verified data.
            if python scripts/guard_nfl_live_snapshot.py \
                --previous docs/nfl/data/live_2026.json \
                --candidate "$RUNNER_TEMP/nfl-live.json"; then
              :
            else
              code="$?"
              if [ "$code" -eq 10 ]; then exit 0; fi
              exit "$code"
            fi
            cp "$RUNNER_TEMP/nfl-live.json" docs/nfl/data/live_2026.json
            git add docs/nfl/data/live_2026.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "NFL live stats: verified scoreboard refresh"
            if git push origin HEAD:main; then exit 0; fi
          done
          echo "::error::Live snapshot publish conflict; frozen props untouched"
          exit 1
