name: NFL production site and mobile visual QA
on:
  pull_request:
    paths:
      - 'docs/nfl/**'
      - 'docs/dames-picks/**'
      - 'tests/test_nfl_live_ui.cjs'
      - '.github/workflows/nfl-live-ui-qa.yml'
  push:
    branches: [main]
    paths:
      - 'docs/nfl/index.html'
      - 'docs/dames-picks/**'
      - 'tests/test_nfl_live_ui.cjs'
      - '.github/workflows/nfl-live-ui-qa.yml'
  schedule:
    - cron: '30 10 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium smoke-test dependencies
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test unified NFL adapter safety contracts
        run: node --test tests/test_nfl_standard_thresholds.cjs tests/test_nfl_matchup_evidence.cjs tests/test_nfl_provider_event.cjs tests/test_nfl_training_support.cjs tests/test_nfl_boxscore_display.cjs tests/test_live_pace_sort.cjs tests/test_pick_hit_sort.cjs tests/test_nfl_browser_live.cjs
      - name: Test checked-in NFL dashboard on mobile and desktop
        env:
          NFL_UI_URL: http://127.0.0.1:8765/nfl/
          NFL_SCREENSHOT_DIR: nfl-ui-artifacts/local
        run: |
          python3 -m http.server 8765 --directory docs > /tmp/nfl-local-server.log 2>&1 &
          node tests/test_nfl_live_ui.cjs
      - name: Test deployed GitHub Pages dashboard
        if: github.event_name != 'pull_request'
        env:
          NFL_UI_URL: https://damiensandoval77-lang.github.io/Sports-Bot/nfl/
          NFL_SCREENSHOT_DIR: nfl-ui-artifacts/production
          NFL_REQUIRE_DEPLOYED_VERSION: ${{ github.event_name != 'pull_request' }}
        run: node tests/test_nfl_live_ui.cjs
      - name: Preserve mobile and desktop screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-mobile-desktop-qa
          path: nfl-ui-artifacts/
          retention-days: 7
          if-no-files-found: warn
