name: NFL player card UI smoke tests
on:
  pull_request:
    paths:
      - 'docs/nfl/index.html'
      - 'tests/test_nfl_player_cards.cjs'
      - '.github/workflows/nfl-ui-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'docs/nfl/index.html'
      - 'tests/test_nfl_player_cards.cjs'
      - '.github/workflows/nfl-ui-smoke.yml'
permissions:
  contents: read
jobs:
  ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify stable player-market grouping
        run: node tests/test_nfl_player_cards.cjs
