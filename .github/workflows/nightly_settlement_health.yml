name: Verify overnight NBA grading completeness

on:
  workflow_dispatch:
  schedule:
    # Run after the hourly PrizePicks final-recovery job (minute 27).
    - cron: '46 * * * *'
  push:
    branches: [main]
    paths:
      - 'iphone_bot/nightly_settlement_health.py'
      - '.github/workflows/nightly_settlement_health.yml'
  pull_request:
    paths:
      - 'iphone_bot/nightly_settlement_health.py'
      - 'iphone_bot/tests/test_nightly_settlement_health.py'
      - '.github/workflows/nightly_settlement_health.yml'

permissions:
  contents: write

concurrency:
  group: nightly-nba-grade-health
  cancel-in-progress: false

jobs:
  nightly-health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test nightly grade status and protected voids
        run: |
          python -m unittest discover -s iphone_bot/tests -p 'test_nightly_settlement_health.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_nightly_grade_date_audit.py' -v
      - name: Audit yesterday's saved captures with no paid calls
        id: audit
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: python -m iphone_bot.nightly_settlement_health
      - name: Publish audit even if overdue grades are found
        if: always() && github.event_name != 'pull_request' && steps.audit.outcome != 'skipped'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp docs/nightly_grade_health.json "$RUNNER_TEMP/nightly_grade_health.json"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/nightly_grade_health.json" docs/nightly_grade_health.json
            git add docs/nightly_grade_health.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish overnight NBA grade completion audit'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Flag overdue unresolved grades without changing outcomes
        if: always() && github.event_name != 'pull_request' && steps.audit.outcome == 'failure'
        run: |
          echo "::error::Nightly NBA grading check failed: overdue or invalid data; inspect docs/nightly_grade_health.json"
          exit 1
