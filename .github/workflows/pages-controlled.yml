name: Controlled Sports-Bot GitHub Pages deployment
# In legacy mode, native Pages builds are authoritative; verify the served
# bytes. In workflow mode, GitHub Actions deployment is authoritative.
# Never change repository settings from this job or call a skipped deploy green.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/pages-controlled.yml'
      - 'scripts/verify_legacy_pages_release.py'
  schedule:
    # Publish all NBA/NFL static data at a predictable cadence even while
    # ingestion jobs continue pushing snapshots to main.
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'docs/nfl/index.html'
      - 'docs/index.html'
      - 'docs/dames-picks/index.html'
      - 'docs/dames-picks/dames_take.js'
      - 'docs/dames-picks/feeds.js'
      - 'docs/dames-picks/live_direct.js'
      - '.github/workflows/pages-controlled.yml'
      - 'scripts/verify_legacy_pages_release.py'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: sports-bot-pages-stable
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Pages source-mode release checker offline
        run: |
          python -m py_compile scripts/verify_legacy_pages_release.py
          python -m unittest discover -s tests -p 'test_verify_legacy_pages_release.py' -v
  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect Pages source (never mutate settings from CI)
        if: github.event_name != 'pull_request'
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mode=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type')
          case "$mode" in
            workflow) echo 'enabled=true' >> "$GITHUB_OUTPUT" ;;
            legacy) echo 'enabled=false' >> "$GITHUB_OUTPUT"
                    echo '::notice::Pages uses branch mode; verify the deployed release instead of 403 settings mutation' ;;
            *) echo "::error::Unexpected Pages mode: $mode"; exit 1 ;;
          esac
      - name: Verify actual native Pages release if source is branch mode
        if: steps.mode.outputs.enabled == 'false'
        run: python scripts/verify_legacy_pages_release.py "$RUNNER_TEMP/legacy-pages-verification.json"
      - name: Report legacy Pages state truthfully
        if: steps.mode.outputs.enabled == 'false' && always()
        run: |
          echo '## Native Pages source verification (no Actions deployment)' >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/legacy-pages-verification.json" ]; then
            cat "$RUNNER_TEMP/legacy-pages-verification.json" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::error::Legacy Pages verification did not produce evidence'
            exit 1
          fi
      - name: Configure GitHub Pages
        if: steps.mode.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Package existing NBA and NFL site and snapshots
        if: steps.mode.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Publish snapshot to Pages without cancelling concurrent builds
        if: steps.mode.outputs.enabled == 'true'
        id: publish
        uses: actions/deploy-pages@v5
