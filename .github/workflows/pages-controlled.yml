name: Controlled Sports-Bot GitHub Pages deployment
# GitHub Pages must be configured in Settings > Pages with
# Build and deployment > Source set to "GitHub Actions".
# This replaces GitHub's autogenerated Pages build on EVERY main push,
# which repeatedly cancels deployment while NBA/NFL stats update.
on:
  workflow_dispatch:
  schedule:
    # Publish all NBA/NFL static data at a predictable cadence even while
    # ingestion jobs continue pushing snapshots to main.
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'docs/nfl/index.html'
      - 'docs/index.html'
      - 'docs/dames-picks/index.html'
      - 'docs/dames-picks/dames_take.js'
      - 'docs/dames-picks/feeds.js'
      - '.github/workflows/pages-controlled.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: sports-bot-pages-stable
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Confirm GitHub Actions is the configured Pages source
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mode="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type')"
          if [ "$mode" != "workflow" ]; then
            echo "::warning::Pages Source is '$mode'. Open Settings > Pages > Build and deployment > Source, select GitHub Actions. Leaving branch-based publication untouched."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure GitHub Pages
        if: steps.mode.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Package existing NBA and NFL site and snapshots
        if: steps.mode.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Publish snapshot to Pages without cancelling concurrent builds
        if: steps.mode.outputs.enabled == 'true'
        id: publish
        uses: actions/deploy-pages@v5
