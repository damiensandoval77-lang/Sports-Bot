name: One-time 2026-27 PBP Stats historical ON-OFF availability (metadata only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'iphone_bot/probe_pbpstats_current_season.py'
      - '.github/workflows/pbpstats-current-season-probe.yml'
permissions:
  contents: write
concurrency:
  group: pbpstats-seasonal-metadata
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile metadata-only single season probe
        run: python -m py_compile iphone_bot/probe_pbpstats_current_season.py
      - name: Inspect only TWO dated player-with-and-without queries
        run: python -m iphone_bot.probe_pbpstats_current_season
      - name: Publish metadata without raw provider statistics
        run: |
          set -euo pipefail
          cp docs/pbpstats_current_season_probe.json "$RUNNER_TEMP/pbp-season.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/pbp-season.json" docs/pbpstats_current_season_probe.json
            git add docs/pbpstats_current_season_probe.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Report one-shot dated PBP Stats current-season API schema'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
