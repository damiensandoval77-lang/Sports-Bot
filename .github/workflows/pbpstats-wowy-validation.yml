name: Validate PBP Stats WOWY adapter and full offline pipeline
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'iphone_bot/pbpstats_wowy_adapter.py'
      - 'iphone_bot/assemble_pbpstats_wowy.py'
      - 'iphone_bot/import_authorized_onoff.py'
      - 'iphone_bot/lineup_onoff_research.py'
      - 'iphone_bot/pbpstats_request_plan.py'
      - 'iphone_bot/tests/test_pbpstats_wowy_adapter.py'
      - 'iphone_bot/tests/test_assemble_pbpstats_wowy.py'
      - 'iphone_bot/tests/test_import_authorized_onoff.py'
      - 'iphone_bot/tests/test_lineup_onoff_research.py'
      - '.github/workflows/pbpstats-wowy-validation.yml'
permissions:
  contents: write
concurrency:
  group: pbpstats-wowy-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run all offline source-mapping and research tests
        id: tests
        continue-on-error: true
        run: |
          python -m compileall -q iphone_bot/pbpstats_request_plan.py iphone_bot/pbpstats_wowy_adapter.py iphone_bot/lineup_onoff_research.py iphone_bot/import_authorized_onoff.py iphone_bot/assemble_pbpstats_wowy.py
          python -m unittest discover -s iphone_bot/tests -p 'test_pbpstats_request_plan.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_pbpstats_wowy_adapter.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_import_authorized_onoff.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_lineup_onoff_research.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_assemble_pbpstats_wowy.py' -v
      - name: Publish status only, never source data
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          python - <<'PY'
          import os,json,datetime
          status={"generated_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),
           "status":"PASSED" if os.environ.get("TEST_OUTCOME")=="success" else "FAILED",
           "tests":"FIVE_OFFLINE_PBPSTATS_WOWY_MODULES",
           "real_provider_samples_verified":False,
           "licensed_ingestion_enabled":False}
          open("docs/pbpstats_wowy_validation_status.json","w").write(json.dumps(status,indent=2)+"\n")
          print(json.dumps(status))
          PY
          cp docs/pbpstats_wowy_validation_status.json "$RUNNER_TEMP/pbp-wowy-validation.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/pbp-wowy-validation.json" docs/pbpstats_wowy_validation_status.json
            git add docs/pbpstats_wowy_validation_status.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish PBP Stats offline WOWY test status'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Fail job if tests failed
        if: steps.tests.outcome != 'success'
        run: exit 1
