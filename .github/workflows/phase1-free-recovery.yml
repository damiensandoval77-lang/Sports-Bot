name: Phase 1 credit-free source recovery coordinator
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "iphone_bot/phase1_free_recovery.py"
      - "iphone_bot/tests/test_phase1_free_recovery.py"
      - ".github/workflows/phase1-free-recovery.yml"
  schedule:
    - cron: '17,47 * * * *'
  pull_request:
    paths:
      - 'iphone_bot/phase1_free_recovery.py'
      - 'iphone_bot/tests/test_phase1_free_recovery.py'
      - '.github/workflows/phase1-free-recovery.yml'
permissions:
  contents: read
  actions: write
concurrency:
  group: phase1-free-source-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate source freshness and credit-free dispatch policy
        run: python -m unittest discover -s iphone_bot/tests -p 'test_phase1_free_recovery.py' -v
      - name: Compute exact stale sources without calling any providers
        id: plan
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json, os
          from iphone_bot.phase1_free_recovery import plan
          report=plan()
          filename=os.environ["RUNNER_TEMP"]+"/recovery_plan.json"
          with open(filename,"w") as f:json.dump(report,f,indent=2)
          print(json.dumps(report,indent=2))
          PY
      - name: Dispatch only idle credit-free workflows with cooldown
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY' > "$RUNNER_TEMP/dispatch.txt"
          import json,os
          p=json.load(open(os.environ["RUNNER_TEMP"]+"/recovery_plan.json"))
          allow={"nba-schedule.yml","nba-no-line-daily-projections.yml","nba-prizepicks-site-publish.yml",
                 "nba-prizepicks-ai-board.yml","grade_frozen_ai_forecasts.yml",
                 "publish_live_pp_ai_join.yml"}
          assert p["credit_spending_allowed"] is False
          for row in p["dispatch_candidates"]:
              if row["workflow"] not in allow:raise ValueError("Unsafe workflow request")
              print(row["workflow"])
          PY
          while IFS= read -r workflow; do
            [ -n "$workflow" ] || continue
            # GitHub's list endpoint is repository-scoped and uses UTC timestamps.
            # An active, queued or recently dispatched workflow is left alone.
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?per_page=12" > "$RUNNER_TEMP/recent.json"
            if ! python - "$RUNNER_TEMP/recent.json" "$workflow" <<'PY'
          import datetime,json,sys
          from pathlib import Path
          runs=json.load(open(sys.argv[1])).get("workflow_runs",[])
          now=datetime.datetime.now(datetime.timezone.utc)
          workflow=sys.argv[2]
          ai_time=None
          if workflow=="publish_live_pp_ai_join.yml":
              try:
                  ai=json.loads(Path("docs/ai_projection_fallback.json").read_text())
                  ai_time=datetime.datetime.fromisoformat(
                      ai["generated_at"].replace("Z","+00:00"))
              except (OSError,ValueError,KeyError,TypeError):
                  pass
          for r in runs:
              when=datetime.datetime.fromisoformat(r["created_at"].replace("Z","+00:00"))
              age=(now-when).total_seconds()
              if r.get("status") in ("queued","waiting","pending","in_progress","requested"):
                  if age<5400:sys.exit(1)
              elif r.get("conclusion")=="success" and age<3600:
                  # A successful join PRECEDING newly published model inputs
                  # is no proof that those inputs reached the public feed.
                  if ai_time is None or when>=ai_time:sys.exit(1)
              elif r.get("conclusion")=="failure" and age<900:
                  # Avoid rapid retry storms, but don't suppress recovery
                  # for a full hour after a failed credit-free run.
                  sys.exit(1)
          PY
            then
              echo "Skipping recently active workflow: $workflow"
              continue
            fi
            echo "Dispatching source recovery: $workflow"
            gh workflow run "$workflow" --ref main
          done < "$RUNNER_TEMP/dispatch.txt"
