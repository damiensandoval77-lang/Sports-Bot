name: Phase 1 pregame board readiness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "iphone_bot/board_readiness_audit.py"
      - "iphone_bot/tests/test_board_readiness_audit.py"
      - ".github/workflows/phase1_board_readiness.yml"
  schedule:
    - cron: "7 16,20,23 * * *"

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Board readiness unit tests
        run: python -m unittest discover -s iphone_bot/tests -p 'test_board_readiness_audit.py' -v
      - name: Report actual snapshot readiness without spending API credits
        if: github.event_name != 'pull_request'
        run: python iphone_bot/board_readiness_audit.py
