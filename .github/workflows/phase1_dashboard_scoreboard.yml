name: Phase 1 dashboard scoreboard integration

on:
  pull_request:
    paths:
      - "docs/index.html"
      - "iphone_bot/tests/test_dashboard_scoreboard_integration.py"
      - ".github/workflows/phase1_dashboard_scoreboard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test scoreboard fallback integration
        run: python -m unittest discover -s iphone_bot/tests -p 'test_dashboard_scoreboard_integration.py' -v
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Extract(HTMLParser):
              collecting = False
              blocks = []
              def handle_starttag(self, tag, attrs):
                  if tag == "script":
                      self.collecting = True
                      self.blocks.append("")
              def handle_endtag(self, tag):
                  if tag == "script":
                      self.collecting = False
              def handle_data(self, data):
                  if self.collecting:
                      self.blocks[-1] += data
          parser = Extract()
          parser.feed(Path("docs/index.html").read_text())
          inline = [s for s in parser.blocks if s.strip()]
          assert inline, "No inline JavaScript found"
          Path("/tmp/sports_bot_inline.js").write_text("\n;\n".join(inline))
          PY
          node --check /tmp/sports_bot_inline.js
