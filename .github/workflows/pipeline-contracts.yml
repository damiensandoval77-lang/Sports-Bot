name: pipeline-contracts
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pipeline-contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pipeline-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          pip install -r requirements.txt
          pip install -r iphone_bot/requirements-training.txt pyarrow requests scikit-learn joblib pyyaml
      - name: Audit pinned dependencies against published advisories
        run: |
          python -m pip install 'pip-audit==2.10.1'
          python -m pip_audit -r requirements.txt --no-deps --disable-pip
      - name: Run contract tests shifted out of publishing jobs
        run: python scripts/run_pipeline_contracts.py
