name: Pipeline heartbeat - deployed lines picks live and grades
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'iphone_bot/pipeline_heartbeat.py'
      - 'iphone_bot/heartbeat_recovery.py'
      - 'iphone_bot/readiness_watchdog.py'
      - 'iphone_bot/tests/test_readiness_watchdog.py'
      - 'iphone_bot/tests/test_heartbeat_recovery.py'
      - '.github/workflows/pipeline-heartbeat.yml'
  schedule:
    - cron: '*/10 * * * *'
  workflow_run:
    workflows:
      - "Publish lightweight PrizePicks site data and per-game coverage"
      - "Guarded new NBA AI all markets PTS REB AST PRA"
      - "Independent NBA scoreboard refresh"
      - "Independent NBA player boxscores"
      - "Grade frozen new AI PTS REB AST PRA (no provider credits)"
    types: [completed]
  pull_request:
    paths:
      - '.github/workflows/pipeline-heartbeat.yml'
      - 'iphone_bot/pipeline_heartbeat.py'
      - 'iphone_bot/heartbeat_recovery.py'
      - 'iphone_bot/readiness_watchdog.py'
      - 'iphone_bot/tests/test_readiness_watchdog.py'
      - 'iphone_bot/tests/test_heartbeat_recovery.py'
      - 'iphone_bot/tests/test_pipeline_heartbeat.py'
      - 'tests/test_critical_production_repair_contracts.py'
permissions:
  contents: read
  actions: write
  issues: write
concurrency:
  group: deployed-pipeline-heartbeat
  cancel-in-progress: false
jobs:
  heartbeat:
    # Never grant a pull-request completion access to production dispatch.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test heartbeat state classification
        if: github.event_name == 'pull_request'
        run: |
          python -m pip install --disable-pip-version-check "PyYAML>=6,<7"
          python -m unittest iphone_bot.tests.test_pipeline_heartbeat iphone_bot.tests.test_heartbeat_recovery iphone_bot.tests.test_readiness_watchdog -v
          python -m unittest discover -s tests -p 'test_critical_production_repair_contracts.py' -v
      - name: Run deployed-site monitoring
        if: github.event_name != 'pull_request'
        id: health
        run: |
          set +e
          python -m iphone_bot.pipeline_heartbeat pipeline_heartbeat.json
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Retry failed free stages without suppressing recovery after failures
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python -m iphone_bot.heartbeat_recovery pipeline_heartbeat.json heartbeat_recovery.json
      - name: Wake bounded readiness controller if its independent schedule is late
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python -m iphone_bot.readiness_watchdog
      - name: Save evidence
        if: github.event_name != 'pull_request' && always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-heartbeat-${{ github.run_id }}
          path: |
            pipeline_heartbeat.json
            heartbeat_recovery.json
            readiness_watchdog.json
          retention-days: 90
      - name: Publish source-grounded status in the Actions run summary
        if: github.event_name != 'pull_request' && always()
        run: |
          echo "## Dame's Picks deployed pipeline heartbeat" >> "$GITHUB_STEP_SUMMARY"
          echo "This report checks deployed data; a green preceding workflow alone is not proof of a healthy app." >> "$GITHUB_STEP_SUMMARY"
          if [ -s pipeline_heartbeat.json ]; then
            jq -r '.stages[] | "- **\(.status)** \(.stage): \(.detail) | evidence: \(.evidence|tojson)"' pipeline_heartbeat.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **FAIL** Heartbeat report missing; inspect failed workflow and artifact." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -s heartbeat_recovery.json ]; then
            jq -r '.recoveries[] | "- Recovery **\(.status)** \(.workflow): \(.reason // "requested; verify deployed output")"' heartbeat_recovery.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Open or close one GitHub alert per failing stage
        if: github.event_name != 'pull_request' && always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # This repository currently has GitHub Issues disabled (API 410).
          # Keep artifacts, Actions summary and red workflow status as primary alerts.
          enabled=$(gh api "repos/$GH_REPO" --jq '.has_issues' 2>/dev/null || echo false)
          if [ "$enabled" != true ]; then
            echo "::warning::GitHub Issues disabled or unavailable; alert evidence remains in the run summary and artifact."
            exit 0
          fi
          gh label create pipeline-alert --color B60205 --description "Dame's Picks pipeline failure" 2>/dev/null || true
          jq -c '.stages[]' pipeline_heartbeat.json | while read -r row; do
            stage=$(jq -r .stage <<< "$row")
            status=$(jq -r .status <<< "$row")
            title="[pipeline] $stage failing"
            issue=$(gh issue list --state open --label pipeline-alert --limit 100 --json number,title |
              jq -r --arg name "$title" '[.[] | select(.title==$name)] | first | .number // empty')
            if [ "$status" = FAIL ] && [ -z "$issue" ]; then
              gh issue create --title "$title" --label pipeline-alert --body "$(jq . <<< "$row")"
            elif [ "$status" = OK ] && [ -n "$issue" ]; then
              gh issue comment "$issue" --body "Recovered in deployed-site heartbeat ${{ github.run_id }}"
              gh issue close "$issue"
            fi
          done
      - name: Surface unresolved failures
        if: github.event_name != 'pull_request' && steps.health.outputs.code != '0'
        run: exit 1
