name: NBA production readiness and stability gate

on:
  workflow_dispatch:
  schedule:
    - cron: '9,29,49 * * * *'
  push:
    branches: [main]
    paths:
      - 'iphone_bot/production_readiness.py'
      - 'iphone_bot/tests/test_production_readiness.py'
      - 'docs/tonight_capture_gradeability.json'
      - 'iphone_bot/merge_scoreboard_snapshot.py'
      - 'iphone_bot/tests/test_merge_scoreboard_snapshot.py'
      - '.github/workflows/production_readiness.yml'
  pull_request:
    paths:
      - 'iphone_bot/production_readiness.py'
      - 'iphone_bot/tests/test_production_readiness.py'
      - '.github/workflows/production_readiness.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: nba-production-readiness
  cancel-in-progress: false

jobs:
  verify-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run fail-closed production data quality tests
        run: |
          python -m unittest discover -s iphone_bot/tests -p 'test_production_readiness.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_merge_scoreboard_snapshot.py' -v
      - name: Recover independent scoreboard before readiness evaluation
        id: scoreboard_repair
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          # Independent no-odds-credit retry when the separate cron is late.
          # This is best effort; readiness still fails if fresh LIVE scores are missing.
          python -m iphone_bot.refresh_independent_scoreboard
      - name: Evaluate actual published NBA input freshness and coverage
        id: check
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: python -u -m iphone_bot.production_readiness
      - name: Publish actual status even when feeds are broken
        if: always() && github.event_name != 'pull_request' && steps.check.outcome != 'skipped'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp docs/production_readiness.json "$RUNNER_TEMP/production_readiness.json"
          if [ -f docs/nba_scoreboard_independent.json ]; then
            cp docs/nba_scoreboard_independent.json "$RUNNER_TEMP/nba_scoreboard_independent.json"
          fi
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/production_readiness.json" docs/production_readiness.json
            if [ -f "$RUNNER_TEMP/nba_scoreboard_independent.json" ]; then
              python -m iphone_bot.merge_scoreboard_snapshot docs/nba_scoreboard_independent.json "$RUNNER_TEMP/nba_scoreboard_independent.json"
            fi
            git add docs/production_readiness.json docs/nba_scoreboard_independent.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Record honest NBA production feed readiness'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Open or resolve recurring production incident automatically
        if: always() && github.event_name != 'pull_request' && steps.check.outcome != 'skipped'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          report=docs/production_readiness.json
          test -f "$report"
          title="Automated incident: NBA production readiness degraded"
          existing=$(gh issue list --state all --limit 100 --json number,title,state |
            jq -r --arg title "$title" '[.[] | select(.title == $title)] | first | .number // empty')
          status=$(jq -r '.status // "UNKNOWN"' "$report")
          if [ "$status" = "READY" ]; then
            if [ -n "$existing" ]; then
              state=$(gh issue view "$existing" --json state --jq '.state')
              if [ "$state" = "OPEN" ]; then
                gh issue close "$existing" --comment "Readiness gate recovered to READY. Verification report: docs/production_readiness.json. Reopen automatically on regression."
              fi
            fi
            exit 0
          fi
          {
            echo "Automated incident from the scheduled NBA readiness gate."
            echo
            echo "Current status: **$status**"
            echo "Checked at: $(jq -r '.checked_at // "unknown"' "$report")"
            echo "Required checks passing: $(jq -r '.passing_required_checks // 0' "$report") / $(jq -r '.required_checks // 0' "$report")"
            echo
            echo "### Failing required components"
            jq -r '.components | to_entries[] | select(.value.required == true and .value.state != "READY") | "- **" + .key + "** (" + .value.state + "): " + (.value.reasons | join(", "))' "$report"
            echo
            echo "See [production readiness report](https://github.com/$GH_REPO/blob/main/docs/production_readiness.json) and [workflow history](https://github.com/$GH_REPO/actions/workflows/production_readiness.yml)."
            echo
            echo "Do not label live picks READY until the fail-closed readiness gate passes."
          } > "$RUNNER_TEMP/incident.md"
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/incident.md"
          else
            gh issue reopen "$existing" 2>/dev/null || true
            gh issue edit "$existing" --body-file "$RUNNER_TEMP/incident.md"
          fi
      - name: Fail visibly when bot is not ready for reliable picks
        if: always() && github.event_name != 'pull_request' && steps.check.outcome == 'failure'
        run: |
          echo "::error::NBA live data/projections/line coverage not fully ready. See docs/production_readiness.json"
          exit 1
