name: NBA production readiness and stability gate

on:
  workflow_dispatch:
  # GitHub Actions bot commits do not fire regular push workflows.
  # Reevaluate the published readiness report after real source recovery.
  workflow_run:
    workflows:
      - Publish daily NBA AI player projections without paid prop lines
      - Publish lightweight verified PrizePicks AI comparisons
    types: [completed]
    branches: [main]
  schedule:
    - cron: '9,29,49 * * * *'
  push:
    branches: [main]
    paths:
      - 'iphone_bot/production_readiness.py'
      - 'iphone_bot/tests/test_production_readiness.py'
      - 'iphone_bot/tests/test_production_live_recovery_workflow.py'
      - 'docs/tonight_capture_gradeability.json'
      - 'iphone_bot/merge_scoreboard_snapshot.py'
      - 'iphone_bot/tests/test_merge_scoreboard_snapshot.py'
      - '.github/workflows/production_readiness.yml'
  pull_request:
    paths:
      - 'iphone_bot/production_readiness.py'
      - 'iphone_bot/tests/test_production_readiness.py'
      - '.github/workflows/production_readiness.yml'

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: nba-production-readiness
  cancel-in-progress: false

jobs:
  verify-readiness:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run fail-closed production data quality tests
        if: github.event_name == 'pull_request'
        run: |
          python -m unittest discover -s iphone_bot/tests -p 'test_production_readiness.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_merge_scoreboard_snapshot.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_readiness_recovery.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_production_live_recovery_workflow.py' -v
      - name: Recover independent scoreboard before readiness evaluation
        id: scoreboard_repair
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          # Independent no-odds-credit retry when the separate cron is late.
          # This is best effort; readiness still fails if fresh LIVE scores are missing.
          python -m iphone_bot.refresh_independent_scoreboard
      - name: Recover authentic live NBA player totals before verifying readiness
        id: player_repair
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          # Free official NBA liveData only. Partial authentic observations
          # can be saved, but never claim every matchup has player rows.
          python -m iphone_bot.refresh_nba_player_boxscores
      - name: Evaluate actual published NBA input freshness and coverage
        id: check
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: python -u -m iphone_bot.production_readiness
      - name: Publish actual status even when feeds are broken
        if: always() && github.event_name != 'pull_request' && steps.check.outcome != 'skipped'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp docs/production_readiness.json "$RUNNER_TEMP/production_readiness.json"
          if [ -f docs/nba_scoreboard_independent.json ]; then
            cp docs/nba_scoreboard_independent.json "$RUNNER_TEMP/nba_scoreboard_independent.json"
          fi
          if [ -f docs/nba_player_tracking_independent.json ]; then
            # Do not publish an empty or unverified live response as fresh.
            if python - <<'PY'
          import json
          from iphone_bot.refresh_nba_player_boxscores import publishable_observations
          d=json.load(open("docs/nba_player_tracking_independent.json"))
          assert publishable_observations(d)
          PY
            then
              cp docs/nba_player_tracking_independent.json "$RUNNER_TEMP/nba_player_tracking_independent.json"
            fi
          fi
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/production_readiness.json" docs/production_readiness.json
            if [ -f "$RUNNER_TEMP/nba_scoreboard_independent.json" ]; then
              python -m iphone_bot.merge_scoreboard_snapshot docs/nba_scoreboard_independent.json "$RUNNER_TEMP/nba_scoreboard_independent.json"
            fi
            if [ -f "$RUNNER_TEMP/nba_player_tracking_independent.json" ]; then
              python -m iphone_bot.merge_nba_player_boxscore_publish \
                --current docs/nba_player_tracking_independent.json \
                --incoming "$RUNNER_TEMP/nba_player_tracking_independent.json"
            fi
            git add docs/production_readiness.json docs/nba_scoreboard_independent.json docs/nba_player_tracking_independent.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Record honest NBA production feed readiness'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Route degraded components to bounded automatic recovery
        if: always() && github.event_name != 'pull_request' && steps.check.outcome != 'skipped'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Schedule checks remain red until a later real browser/feed audit
          # passes. Recovery dispatch must not modify or fabricate predictions.
          python -m iphone_bot.readiness_recovery docs/production_readiness.json > "$RUNNER_TEMP/recovery_targets"
          while IFS= read -r workflow; do
            [ -n "$workflow" ] || continue
            case "$workflow" in
              # The collector is top-up billable. Never buy a board every audit.
              nba-prizepicks-full-slate.yml) cooldown_minutes=90 ;;
              # Model training can run up to 40m. Do not queue overlapping
              # generation runs or hammer injury/current-form endpoints.
              nba-new-ai-all-markets.yml) cooldown_minutes=90 ;;
              independent_scoreboard_refresh.yml) cooldown_minutes=18 ;;
              independent_nba_player_boxscores.yml) cooldown_minutes=12 ;;
              *) cooldown_minutes=35 ;;
            esac
            # Compare with actual started runs, including in-progress.
            # Prevent every 20-minute audit from buying another board.
            # Keep the paid collector on a hard cooldown even if its last
            # request failed: avoid repeatedly spending top-up credits.
            # Free recovery is different: a failed run must not suppress the
            # next verified retry. Suppress only active or successful runs.
            recent=$(gh run list --workflow "$workflow" --limit 30 --json createdAt,status,conclusion,headBranch |
              jq --argjson cutoff "$(($(date -u +%s) - cooldown_minutes * 60))" \
                 --arg paid "$([ "$workflow" = nba-prizepicks-full-slate.yml ] && echo true || echo false)" '
                [.[] | select(.headBranch=="main" and
                  ((.status != "completed") or
                   ((.createdAt | fromdateiso8601) >= $cutoff and
                    ($paid == "true" or .conclusion == "success"))))] | length')
            if [ "$recent" -gt 0 ]; then
              echo "Skipping $workflow: active or successfully completed within cooldown (paid calls also hard-capped)"
              continue
            fi
            echo "Dispatching bounded recovery: $workflow"
            gh workflow run "$workflow" --ref main
          done < "$RUNNER_TEMP/recovery_targets"
      - name: Open or resolve recurring production incident automatically
        if: always() && github.event_name != 'pull_request' && steps.check.outcome != 'skipped'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          report=docs/production_readiness.json
          test -f "$report"
          title="Automated incident: NBA production readiness degraded"
          status=$(jq -r '.status // "UNKNOWN"' "$report")
          if [[ "$(gh api "repos/$GH_REPO" --jq .has_issues 2>/dev/null || echo false)" != "true" ]]; then
            echo "::warning::GitHub Issues disabled: production incident will be retained in committed readiness JSON and workflow summary."
            echo "## Production incident: $status" >> "$GITHUB_STEP_SUMMARY"
            echo "Issues are disabled; see [readiness evidence](https://github.com/$GH_REPO/blob/main/docs/production_readiness.json)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          existing=$(gh issue list --state all --limit 100 --json number,title,state |
            jq -r --arg title "$title" '[.[] | select(.title == $title)] | first | .number // empty')
          status=$(jq -r '.status // "UNKNOWN"' "$report")
          if [ "$status" = "READY" ]; then
            if [ -n "$existing" ]; then
              state=$(gh issue view "$existing" --json state --jq '.state')
              if [ "$state" = "OPEN" ]; then
                gh issue close "$existing" --comment "Readiness gate recovered to READY. Verification report: docs/production_readiness.json. Reopen automatically on regression."
              fi
            fi
            exit 0
          fi
          {
            echo "Automated incident from the scheduled NBA readiness gate."
            echo
            echo "Current status: **$status**"
            echo "Checked at: $(jq -r '.checked_at // "unknown"' "$report")"
            echo "Required checks passing: $(jq -r '.passing_required_checks // 0' "$report") / $(jq -r '.required_checks // 0' "$report")"
            echo
            echo "### Failing required components"
            jq -r '.components | to_entries[] | select(.value.required == true and .value.state != "READY") | "- **" + .key + "** (" + .value.state + "): " + (.value.reasons | join(", "))' "$report"
            echo
            echo "See [production readiness report](https://github.com/$GH_REPO/blob/main/docs/production_readiness.json) and [workflow history](https://github.com/$GH_REPO/actions/workflows/production_readiness.yml)."
            echo
            echo "Do not label live picks READY until the fail-closed readiness gate passes."
          } > "$RUNNER_TEMP/incident.md"
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/incident.md"
          else
            gh issue reopen "$existing" 2>/dev/null || true
            gh issue edit "$existing" --body-file "$RUNNER_TEMP/incident.md"
          fi
      - name: Save production incident report artifact
        if: always() && github.event_name != 'pull_request' && steps.check.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: production-readiness-${{ github.run_id }}
          path: docs/production_readiness.json
          if-no-files-found: error
          retention-days: 30
      - name: Fail visibly when bot is not ready for reliable picks
        if: always() && github.event_name != 'pull_request' && steps.check.outcome == 'failure'
        run: |
          echo "::error::NBA live data/projections/line coverage not fully ready. See docs/production_readiness.json"
          exit 1
