name: Test analytical matchup shadow without sportsbook API
on:
  pull_request:
    paths:
      - 'research/pretip_matchup_shadow.py'
      - 'iphone_bot/tests/test_pretip_matchup_shadow.py'
      - '.github/workflows/research-matchup-shadow-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical validation dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Verify opponent-conditioned analytical chances never rewrite original lines
        run: python -m unittest discover -s iphone_bot/tests -p 'test_pretip_matchup_shadow.py' -v
