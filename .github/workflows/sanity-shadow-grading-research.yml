name: Sanity Shadow Grading Research (offline)
on:
  pull_request:
    paths:
      - 'iphone_bot/projection_upgrade_research.py'
      - 'iphone_bot/tests/test_projection_upgrade_research.py'
      - '.github/workflows/sanity-shadow-grading-research.yml'
  push:
    branches: ['research/20261107-shadow-capture-grading-readiness']
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax checks
        run: |
          python -m py_compile iphone_bot/projection_upgrade_research.py iphone_bot/sanity_shadow_research.py
      - name: Validate locked-only grading and sanity shadow integrity
        run: |
          python -m unittest discover -s iphone_bot/tests -p 'test_projection_upgrade_research.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_sanity_shadow_research.py' -v
      - name: Verify empty status refuses performance claims
        run: |
          python - <<'PY'
          from iphone_bot.projection_upgrade_research import grade_sanity_shadow
          result=grade_sanity_shadow([],[])
          assert result['overall']['paired_markets']==0
          assert result['adjusted_only']['paired_markets']==0
          assert result['accuracy_gain_established'] is False
          assert result['live_applied'] is False
          print('Safe empty audit confirmed')
          PY
