name: Verify rendered NBA PrizePicks AI cards in public mobile browser
on:
  workflow_dispatch:
  schedule:
    # Credit-free periodic real browser check; source commits are not proof of deployment.
    - cron: '36 * * * *'
  push:
    branches: [main]
    paths:
      - 'docs/ai_prizepicks_quick_join_health.json'
      - 'docs/index.html'
      - 'iphone_bot/verify_browser_dashboard.py'
      - 'iphone_bot/tests/test_verify_browser_dashboard.py'
      - 'iphone_bot/reliability_guardrails.py'
      - 'iphone_bot/tests/test_reliability_guardrails.py'
      - '.github/workflows/verify_browser_dashboard.yml'
  pull_request:
    paths:
      - 'iphone_bot/verify_browser_dashboard.py'
      - 'iphone_bot/tests/test_verify_browser_dashboard.py'
      - 'iphone_bot/reliability_guardrails.py'
      - 'iphone_bot/tests/test_reliability_guardrails.py'
      - '.github/workflows/verify_browser_dashboard.yml'
permissions:
  contents: write
concurrency:
  group: public-browser-card-check
  cancel-in-progress: false
jobs:
  browser-cards:
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test browser canary contract without accessing public network
        if: github.event_name == 'pull_request'
        run: |
          python -m py_compile iphone_bot/verify_browser_dashboard.py
          python -m unittest discover -s iphone_bot/tests -p 'test_verify_browser_dashboard.py' -v
          python -m unittest discover -s iphone_bot/tests -p 'test_reliability_guardrails.py' -v
      - name: Install headless browser for independent public site rendering
        if: github.event_name != 'pull_request'
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Load real public Pages site and verify rendered line and AI cards
        if: github.event_name != 'pull_request'
        id: probe
        continue-on-error: true
        env:
          SPORTS_BOT_PUBLIC_SITE_URL: ${{ vars.SPORTS_BOT_PUBLIC_SITE_URL || 'https://damiensandoval77-lang.github.io/Sports-Bot/' }}
        run: python -m iphone_bot.verify_browser_dashboard
      - name: Publish actual mobile browser render status, including failures
        if: always() && github.event_name != 'pull_request' && steps.probe.outcome != 'skipped'
        run: |
          set -euo pipefail
          cp docs/browser_card_probe.json "$RUNNER_TEMP/browser_card_probe.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/browser_card_probe.json" docs/browser_card_probe.json
            git add docs/browser_card_probe.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Record independently rendered public Sports-Bot iPhone card status'
            if git push origin HEAD:main; then exit 0; fi
          done
          echo "::error::Cannot publish mobile card verification status after retries"
          exit 1
      - name: Fail if page rendered without real authenticated line and AI cards
        if: always() && github.event_name != 'pull_request' && steps.probe.outcome == 'failure'
        run: |
          echo "::error::Actual browser did not render authentic PrizePicks AI cards; see docs/browser_card_probe.json"
          exit 1
