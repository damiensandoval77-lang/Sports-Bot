name: Verify public Sports-Bot dashboard deployment and real JSON
on:
  workflow_dispatch:
  schedule:
    # Independent check even when site publisher misses a dispatch.
    - cron: '15,45 * * * *'
  pull_request:
    paths:
      - 'iphone_bot/verify_deployed_dashboard.py'
      - 'iphone_bot/tests/test_verify_deployed_dashboard.py'
      - '.github/workflows/verify_public_dashboard.yml'
permissions:
  contents: write
concurrency:
  group: sports-bot-deployed-dashboard-probe
  cancel-in-progress: false
jobs:
  deployed-site:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test deployed-public-site fail-closed checks without network/API credits
        if: github.event_name == 'pull_request'
        run: |
          python -m unittest discover -s iphone_bot/tests -p 'test_verify_deployed_dashboard.py' -v
          python -m py_compile iphone_bot/verify_deployed_dashboard.py
      - name: Probe actual public GitHub Pages HTML and JSON
        id: probe
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          SPORTS_BOT_PUBLIC_SITE_URL: ${{ vars.SPORTS_BOT_PUBLIC_SITE_URL || 'https://damiensandoval77-lang.github.io/Sports-Bot/' }}
        run: python -u -m iphone_bot.verify_deployed_dashboard
      - name: Save verified public-deployment status even when unhealthy
        if: always() && github.event_name != 'pull_request' && steps.probe.outcome != 'skipped'
        run: |
          set -euo pipefail
          cp docs/deployed_dashboard_probe.json "$RUNNER_TEMP/deployed_dashboard_probe.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/deployed_dashboard_probe.json" docs/deployed_dashboard_probe.json
            git add docs/deployed_dashboard_probe.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Record actual public Sports-Bot dashboard deployment health'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Fail visibly when public deployment or data freshness unverified
        if: always() && github.event_name != 'pull_request' && steps.probe.outcome == 'failure'
        run: |
          echo "::error::Public Sports-Bot page or saved research join is not verified. See docs/deployed_dashboard_probe.json"
          exit 1
