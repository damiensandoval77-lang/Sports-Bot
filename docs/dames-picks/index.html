async function liveTick(force=false){

 state.liveBusy=true;
 try{
  const [direct,nflDirect,raw]=await Promise.all([
   L.fetchNBA().catch(()=>null),
   L.fetchNFL(state.raw?.nflSchedule).catch(()=>null),
   Promise.allSettled([
     getJSON("live_player_tracking.json"),
     getJSON("nba_scoreboard_independent.json"),
     getJSON("nba_player_tracking_independent.json"),
     getJSON("nfl/data/live_2026.json")

   state.directAt=Date.now();

   const fields=["nbaLive","nbaScores","independentPlayers","nflLive"];
   const names=["live_player_tracking.json","nba_scoreboard_independent.json","nba_player_tracking_independent.json","nfl/data/live_2026.json"];
   for(let i=0;i<raw.length;i++){

const RELEASE_ID=document.querySelector('meta[name="dames-release"]')?.content||"UNKNOWN";

let releaseCheckBusy=false;
async function checkAppRelease(){
 if(document.hidden||releaseCheckBusy)return;
 releaseCheckBusy=true;
 try{
  const response=await fetch("release.json?update="+Date.now(),{cache:"no-store"});
  if(!response.ok)return;
  const latest=await response.json();
  const next=latest?.release_id;
  if(typeof next!=="string"||!/^dp-[a-zA-Z0-9-]+$/.test(next)||latest.runtime_bundle_id!==next)return;
  if(next===RELEASE_ID){$("release-update").hidden=true;return;}
  // Do not offer a half-published release during a Pages rollout.
  const page=await fetch("index.html?update="+Date.now(),{cache:"no-store"});
  if(!page.ok)return;
  const html=await page.text();
  if(html.match(/<meta name="dames-release" content="([^"]+)"/)?.[1]!==next)return;
  $("release-update").hidden=false;
  $("load-update").onclick=()=>{
   // User opts in; never interrupt a card, search or active live game.
   const url=new URL(window.location.href);
   url.searchParams.set("app_release",next);
   window.location.assign(url.href);
  };
 }catch(_){/* Offline/transient checks must not interrupt the usable app. */}
 finally{releaseCheckBusy=false;}
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkAppRelease()});
setInterval(checkAppRelease,120000);

/* OPEN_TAB_RELEASE_WATCH_END */
$("verify-app").onclick=async()=>{

 try{
  const response=await fetch("release.json?verify="+Date.now(),{cache:"no-store"});
  if(!response.ok)throw Error("Release manifest HTTP "+response.status);
  const latest=await response.json();
  const fresh=await fetch("index.html?verify="+Date.now(),{cache:"no-store"});
  if(!fresh.ok)throw Error("Published page HTTP "+fresh.status);
  const current=await fresh.text();
  const meta=current.match(/<meta name="dames-release" content="([^"]+)"/);
  const runtime=window.__damesRunningAssets||{};
  const bundles=["feeds.js","live_direct.js","dames_take.js","provisional.js","short_history.js"];
  const scripts=[...document.scripts];
  const activeScriptsCorrect=bundles.every(name=>
    runtime[name]===RELEASE_ID&&
    scripts.some(script=>script.getAttribute("src")===name+"?bundle="+RELEASE_ID));
  const match=latest?.release_id===RELEASE_ID&&latest?.runtime_bundle_id===RELEASE_ID&&
    meta?.[1]===RELEASE_ID&&activeScriptsCorrect&&
    current.includes("HIT EST.")&&current.includes("Hit est.")&&
    !current.includes("SIM"+" EST.")&&!current.includes("Sim"+" est.");
  el.textContent=match?" · HTML and executing JS match the published release":
    " · OUTDATED APP: reopen using a new cache-busted link";
 }catch(error){el.textContent=" · Cannot verify this phone: "+String(error.message||error).slice(0,110);}
};
