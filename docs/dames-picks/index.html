<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><title>Dame's Picks · NBA + NFL</title>
<style>
:root{--lime:#c5fa29;--pink:#fa70b5;--mint:#72efc3;--violet:#bb9dff;--ink:#000;--panel:#111;--grey:#bababa;--line:#414141;font-family:system-ui,-apple-system,Arial,sans-serif;color:#fafafa;background:#000;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:#000}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--mint);outline-offset:2px}.app{max-width:560px;margin:0 auto;padding:30px 21px 115px;min-height:100vh}.tiny{font-size:11px;color:var(--grey)}.muted{color:#b6b6b6}.line{border:1px solid var(--line)}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:26px}.head .date{font-size:13px;font-weight:650;color:#bbb}.brand{font-size:35px;letter-spacing:-1.9px;line-height:1.15;font-weight:1000;margin:8px 0}.marker{display:inline-block;background:var(--lime);color:#050505;padding:1px 8px 4px;border-radius:12px;transform:rotate(-2deg)}.corner{background:transparent;border:2px solid white;border-radius:16px;height:45px;width:45px;font-size:22px;box-shadow:5px 5px 0 var(--pink)}.selector{display:flex;gap:10px;margin-bottom:22px}.selector button{width:50%;background:#000;border:2px solid #343434;border-radius:15px;padding:14px;font-weight:950}.selector button.active{background:var(--lime);border-color:#fff;color:#050505;box-shadow:4px 4px 0 white}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:22px 0}.metric{border-radius:13px;padding:14px 10px;color:#060606;min-width:0}.metric:nth-child(1){background:var(--lime)}.metric:nth-child(2){background:var(--pink)}.metric:nth-child(3){background:var(--mint)}.metric-label{font-size:10px;font-weight:950;white-space:nowrap}.metric-value{font-size:22px;font-weight:1000;line-height:1.5;letter-spacing:-.5px}
.section{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:25px 0 14px}.section h2{font-size:23px;margin:0;letter-spacing:-.5px}.stamp{font-size:11px;color:#ccc}.flag{font-size:10px;font-weight:950;background:#fff;color:#000;border-radius:12px;padding:5px 9px;transform:rotate(-3deg)}.cards{display:grid;gap:17px}.pick{background:#101010;border:2px solid #fff;border-radius:23px;color:#fff;text-align:left;padding:16px;box-shadow:5px 6px 0 var(--lime);width:calc(100% - 6px)}.pick:nth-child(3n+2){box-shadow:5px 6px 0 var(--pink)}.pick:nth-child(3n){box-shadow:5px 6px 0 var(--mint)}.pick .name{font-size:21px;font-weight:1000;letter-spacing:-.6px}.pick-top,.pick-bottom{display:flex;justify-content:space-between;align-items:center;gap:10px}.context{color:#aaa;font-size:12px;margin-top:4px;line-height:1.4}.stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;align-items:end;gap:9px;margin-top:17px}.stat-grid small{display:block;font-size:11px;color:#bbb;margin-bottom:4px}.stat-grid strong{font-size:22px}.chip{border-radius:12px;padding:9px;font-weight:1000;font-size:12px;color:#050505;white-space:nowrap;transform:rotate(-3deg)}.chip.over{background:var(--lime)}.chip.under{background:#fff}.chip.pass{background:#aaa}.stampband{font-size:11px;color:#bbb;border-top:1px dashed #444;margin-top:15px;padding-top:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}.dots{letter-spacing:3px;font-size:16px;color:var(--lime)}
.grade{font-size:11px;font-weight:950;background:var(--lime);color:#050505;border-radius:10px;padding:8px;white-space:nowrap}.pick:nth-child(3n+2) .grade{background:var(--pink)}.pick:nth-child(3n) .grade{background:var(--mint)}
.nav{position:fixed;left:0;right:0;bottom:0;padding:13px 8px calc(12px + env(safe-area-inset-bottom));background:#020202;border-top:1px solid #333;display:flex;justify-content:space-around;z-index:10}.nav button{background:none;border:0;color:#c3c3c3;font-size:12px;min-width:65px}.nav button svg{width:22px;height:22px;display:block;margin:auto auto 5px}.nav button.active{color:var(--lime);font-weight:950}
.back{background:transparent;border:2px solid #fff;border-radius:16px;height:49px;width:49px;box-shadow:5px 5px 0 var(--lime);font-size:26px}.detail-tools{display:flex;justify-content:space-between;align-items:center;margin:6px 0 35px}.detail-title{font-size:43px;font-weight:1000;line-height:1;letter-spacing:-2px;margin:0 0 10px}.tabstrip{display:flex;gap:9px;overflow-x:auto;margin:25px 0;scrollbar-width:none}.tabstrip button{flex:1;min-width:65px;background:#000;border:2px solid #424242;border-radius:16px;padding:14px 10px;font-weight:1000}.tabstrip button.active{background:var(--lime);color:#000;border:3px solid #fff;box-shadow:2px 3px 0 #fff}
.box{background:#111;border:2px solid #424242;border-radius:27px;padding:21px;margin:18px 0}.box h2{font-size:21px;margin:0 0 17px;font-weight:950}.hero{border-color:#fff;box-shadow:6px 7px 0 var(--lime)}.hero-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.hero-head h2{font-size:17px;margin:0}.triple{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}.triple label{display:block;font-size:11px;color:#aaa;font-weight:800}.triple strong{font-size:33px;font-weight:1000;line-height:1.4}.neon{color:var(--lime)}.meter{height:16px;border:2px solid #fff;border-radius:8px;overflow:hidden;background:#000;margin:14px 0 8px}.meter-fill{height:100%;background:repeating-linear-gradient(125deg,var(--lime) 0,var(--lime) 13px,var(--mint) 13px,var(--mint) 26px)}.meter-labels{display:flex;justify-content:space-between;color:#aaa;font-size:10px;font-weight:800}.lean{border:0;border-radius:17px;background:var(--lime);color:#050505;font-size:17px;font-weight:1000;text-align:center;padding:17px;margin-top:23px}.lean.under{background:#fff}.lean.pass{background:#555;color:#fff}.note{font-size:12px;color:#bbb;line-height:1.55;margin-top:12px}
.chart{display:flex;gap:9px;align-items:flex-end;height:150px;margin:22px 0 5px}.barcol{flex:1;text-align:center;min-width:0}.barcol b{font-size:12px;display:block;margin-bottom:7px}.bar{border-radius:10px 10px 2px 2px;background:var(--lime);min-height:4px}.bar.low{background:transparent;border:2px dashed #777}.barcol small{display:block;font-size:10px;color:#bbb;margin-top:7px;white-space:nowrap;overflow:hidden}.box-row{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:13px 0;font-size:14px}.box-row strong{text-align:right}.take{background:var(--pink);color:#000;border:2px solid white;border-radius:25px;padding:21px;margin:20px 0;font-weight:800}.empty{padding:30px 20px;border:2px dashed #444;border-radius:20px;text-align:center;color:#ccc;line-height:1.5}.smallbtn{background:#111;border:1px solid #555;border-radius:13px;padding:10px;font-weight:800}.search{background:#111;border:1px solid #555;border-radius:13px;color:#fff;padding:12px;width:100%;font:inherit;margin:0 0 17px}.hidden{display:none!important}@media(max-width:390px){.app{padding-left:15px;padding-right:15px}.brand{font-size:31px}.stat-grid strong{font-size:18px}.triple strong{font-size:28px}}
</style></head><body>
<main class="app"><div id="board">
 <header class="head"><div><div id="date" class="date"></div><div class="brand">Dame's <span class="marker">Picks</span></div></div><button class="corner" id="refresh" aria-label="Refresh bot feeds">↻</button></header>
 <div class="selector"><button data-league="NBA" class="active">NBA</button><button data-league="NFL">NFL</button></div>
 <div class="metrics"><div class="metric"><div class="metric-label">GRADED W–L</div><div class="metric-value" id="wl">—</div></div><div class="metric"><div class="metric-label">HIT RATE</div><div class="metric-value" id="rate">—</div></div><div class="metric"><div class="metric-label">GAMES</div><div class="metric-value" id="games">—</div></div></div>
 <div class="section"><h2 id="section-title">Top picks</h2><span class="flag">REAL BOT DATA</span></div><input class="search" id="query" placeholder="Search players or teams" aria-label="Search players">
 <div id="status" class="stamp" aria-live="polite"></div><div class="cards" id="cards"></div>
</div>
<div id="detail" class="hidden"><div class="detail-tools"><button class="back" id="back" aria-label="Back">‹</button><span class="flag">SAVED BOT DATA</span><button class="corner" id="bookmark" aria-label="Save pick">♧</button></div>
 <h1 id="player" class="detail-title"></h1><div id="matchup" class="muted"></div><div id="markets" class="tabstrip"></div><div id="detail-content"></div>
</div></main>
<nav class="nav" aria-label="Sections">
<button class="active" data-view="board"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Board</button>
<button data-view="live"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 3"/></svg>Live</button>
<button data-view="tracker"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 20h18M5 17V9m7 8V4m7 13v-6"/></svg>Tracker</button>
<button data-view="saved"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3h14v18l-7-4-7 4z"/></svg>Saved</button>
</nav>
<script src="feeds.js"></script><script src="dames_take.js"></script><script>
"use strict";
const $=id=>document.getElementById(id),m=window.DamesPicksModel;
const state={league:"NBA",mode:"board",nba:[],nfl:[],nflHealth:null,picked:null,gamePicked:null,liveGames:[],loading:false,errors:[],selected:new Set(),updated:null,health:null};
try{state.selected=new Set(JSON.parse(localStorage.getItem("dames-picks-bookmarks-v1")||"[]"))}catch(_){state.selected=new Set()}
function saveBookmarks(){try{localStorage.setItem("dames-picks-bookmarks-v1",JSON.stringify([...state.selected]))}catch(_){}}

const fmt=x=>typeof x==="number"&&Number.isFinite(x)?x.toFixed(1):"—",pct=x=>typeof x==="number"&&Number.isFinite(x)?Math.round(x*100)+"%":"—";
const escapeText=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const when=t=>{const d=new Date(t);return isNaN(d)? "Time unavailable":d.toLocaleString([],{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})};
const timestamp=t=>{const n=Date.parse(t);return Number.isFinite(n)?n:0};
async function getJSON(p){const r=await fetch("../"+p+"?v="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error(p+" HTTP "+r.status);return r.json()}
async function getCSV(p){const r=await fetch("../nfl/data/"+p+"?v="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error("NFL "+p+" HTTP "+r.status);return m.csv(await r.text())}
async function refresh(){
 if(state.loading)return;state.loading=true;$("status").textContent="Loading actual NBA and NFL bot outputs…";
 const [ledger,form,manifest,schedule,health,nbaLive,nflLive,gradedNFL,capture,forecastHealth,injury,quoteArchive,nbaSchedule]=await Promise.allSettled([
 getJSON("lagged_matchup_all_market_ledger.json"),getJSON("current_form.json"),
 getJSON("nfl/data/latest_2026.json"),getJSON("nfl/data/schedule_2026.json"),
 getJSON("nfl/data/grading_health_2026.json"),getJSON("live_player_tracking.json"),
 getJSON("nfl/data/live_2026.json"),getCSV("pp_graded_2026.csv"),
 getJSON("tonight_capture_gradeability.json"),getJSON("ai_forecast_today_grade_status.json"),getJSON("injury_context.json"),getJSON("prizepicks_pregame_line_archive.json"),getJSON("nba_schedule.json")]);
 const errors=[];
 if(ledger.status==="fulfilled")state.nba=m.nba(ledger.value,form.status==="fulfilled"?form.value:null);
 else errors.push("NBA frozen ledger unavailable");
 if(manifest.status==="fulfilled"&&schedule.status==="fulfilled"&&Array.isArray(manifest.value.files)){
  const results=await Promise.allSettled(manifest.value.files.map(getCSV));
  state.nfl=m.nfl(results.filter(x=>x.status==="fulfilled").map(x=>x.value),schedule.value);
  if(results.some(x=>x.status==="rejected"))errors.push("NFL feed partially loaded");
 }else errors.push("NFL export unavailable");
 state.nflHealth=health.status==="fulfilled"?health.value:null;
 if(gradedNFL.status==="fulfilled")state.nfl=m.attachNFLGrades(state.nfl,gradedNFL.value);
 const nb=nbaLive.status==="fulfilled"?nbaLive.value:null,nf=nflLive.status==="fulfilled"?nflLive.value:null;
 state.liveGames=m.gameCatalog(nb,nf,nbaSchedule.status==="fulfilled"?nbaSchedule.value:null,schedule.status==="fulfilled"?schedule.value:null);
 state.nba=m.attachLive(state.nba,nb,nf);
 if(injury.status==="fulfilled")state.nba=m.attachInjuries(state.nba,injury.value);
 if(quoteArchive.status==="fulfilled")state.nba=m.includeArchivedStandard(state.nba,quoteArchive.value);
 else errors.push("NBA standard quote archive unavailable");
 state.nfl=m.attachLive(state.nfl,nb,nf);
 state.health={capture:capture.status==="fulfilled"?capture.value:null,forecasts:forecastHealth.status==="fulfilled"?forecastHealth.value:null,
 nfl:state.nflHealth,nbaLive:nb,nflLive:nf};
 if(capture.status==="fulfilled"&&capture.value.status!=="CAPTURE_VERIFIED")errors.push("NBA capture incomplete");
 if(health.status==="fulfilled"&&health.value.standard_settled===0)errors.push("NFL final-grade coverage unverified");
 state.errors=errors;state.updated=new Date();state.loading=false;render();
 if(state.picked){const current=rows().find(x=>m.key(x)===m.key(state.picked));if(current){state.picked=current;renderDetail()}}
 if(state.gamePicked){const current=state.liveGames.find(x=>x.sport===state.gamePicked.sport&&x.gameId===state.gamePicked.gameId);if(current){state.gamePicked=current;renderGameDetail()}}

}
function rows(){return state.league==="NBA"?state.nba:state.nfl}
function shown(){
 const now=Date.now(),term=$("query").value.toLowerCase().trim();let data=rows();
 if(state.mode==="board")data=data.filter(x=>timestamp(x.start)>now);
 // Game cards on the Live tab are sourced from the scoreboard independently of props.
 if(state.mode==="saved")data=data.filter(x=>state.selected.has(m.key(x)));
 if(term)data=data.filter(x=>(x.player+" "+x.team+" "+x.opponent+" "+x.stat).toLowerCase().includes(term));
 return [...data].sort((a,b)=>state.mode==="tracker"?timestamp(b.start)-timestamp(a.start):timestamp(a.start)-timestamp(b.start)||(b.chance??0)-(a.chance??0));
}
function render(){
 const a=rows(),sum=m.summarize(a,state.nflHealth,Date.now(),state.league),items=shown();
 $("wl").textContent=sum.wins===null?"—":sum.wins+"–"+sum.losses;
 $("rate").textContent=pct(sum.hitRate);$("games").textContent=sum.games;
 $("section-title").textContent=state.mode==="board"?"Top picks":state.mode==="live"?"Started games":state.mode==="tracker"?"Frozen forecast archive":"Saved props";
 $("status").textContent=(state.updated?"Checked "+state.updated.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}):"")+
 (state.errors.length?" · ISSUES: "+state.errors.join(" · "):"")+
 " · "+(state.health?.capture?.summary?.total_standard_markets_without_frozen_model??"—")+" NBA standard markets missing models"+
 " · "+(state.health?.forecasts?.ungraded??"—")+" AI-only forecasts still ungraded"+
 " · Live values show only fresh verified player snapshots";
 if(state.mode==="live"){renderLiveGames();return}
 $("cards").innerHTML=items.length?items.map((p,i)=>'<button class="pick" data-id="'+escapeText(m.key(p))+'"><div class="pick-top"><span class="name">'+escapeText(p.player)+'</span><span class="grade">'+escapeText(p.quoteOnly?"NO AI":p.grade==="GRADED"?(p.hit===true?"HIT":p.hit===false?"MISS":"SETTLED"):"SAVED")+'</span></div><div class="context">'+escapeText(p.team+(p.position?" · "+p.position:"")+" · "+p.opponent+" · "+p.source+" · "+when(p.start))+'</div><div class="stat-grid"><div><small>'+escapeText(p.stat)+'</small><strong>'+fmt(p.line)+'</strong></div><div><small>Proj</small><strong>'+fmt(p.projection)+'</strong></div><div><small>Sim est.</small><strong>'+pct(p.chance)+'</strong></div><span class="chip '+(p.direction==="MORE"?"over":p.direction==="LESS"?"under":"pass")+'">'+escapeText(p.direction||"PASS")+(p.direction==="MORE"?" ↑":p.direction==="LESS"?" ↓":"")+'</span></div><div class="stampband"><span>'+escapeText(p.live?"LIVE "+fmt(p.live.actual)+" vs original line "+fmt(p.line)+" · "+p.live.gameStatus:p.quoteOnly?"Verified standard line · missing frozen AI model":p.grade==="GRADED"?"Final result verified":p.grade==="PENDING"?"Frozen pregame forecast · not graded":"Unverified")+'</span><span class="dots">●●●●●</span></div></button>').join(""):'<div class="empty">No '+escapeText(state.league)+' '+(state.mode==="board"?"upcoming frozen predictions":state.mode==="live"?"recently started records":state.mode==="saved"?"saved props":"archived forecasts")+' available from the current published feed. No sample data is substituted.</div>';
 for(const b of $("cards").querySelectorAll("[data-id]"))b.onclick=()=>open(b.dataset.id);
}

function renderLiveGames(){
 const term=$("query").value.toLowerCase().trim();
 const games=state.liveGames.filter(g=>g.sport===state.league&&
  (!term||(g.game+" "+g.away+" "+g.home).toLowerCase().includes(term)));
 const order={in:0,stale:1,final:2,scheduled:3,unknown:4};
 games.sort((a,b)=>(order[a.state]??4)-(order[b.state]??4)||a.game.localeCompare(b.game));
 $("cards").innerHTML=games.length?games.map(g=>{
   const count=rows().filter(p=>p.gameId===g.gameId||p.game===g.game).length;
   const title=g.state==="in"?"LIVE":g.state==="stale"?"STALE":g.state==="final"?"FINAL":g.state==="scheduled"?"UPCOMING":"STATUS N/A";
   const score=g.awayScore!==null&&g.awayScore!==undefined&&g.homeScore!==null&&g.homeScore!==undefined?
    g.away+" "+fmt(g.awayScore)+" · "+g.home+" "+fmt(g.homeScore):g.game;
   return '<button class="pick" data-game="'+escapeText(g.sport+"|"+g.gameId)+'"><div class="pick-top"><span class="name">'+escapeText(score)+'</span><span class="grade">'+title+'</span></div><div class="context">'+escapeText(g.statusText)+' · Last snapshot '+escapeText(when(g.observedAt))+'</div><div class="stampband"><span>'+g.players.length+' observed players · '+count+' saved prop records</span><span>Open game</span></div></button>'
 }).join(""):'<div class="empty">No '+escapeText(state.league)+' game snapshots published for this view. This is a feed coverage issue, not proof there are no games.</div>';
 for(const b of $("cards").querySelectorAll("[data-game]"))b.onclick=()=>{
   const game=state.liveGames.find(g=>g.sport+"|"+g.gameId===b.dataset.game);
   if(game)openGame(game);
 };
}
function openGame(game){
 state.picked=null;state.gamePicked=game;
 $("board").classList.add("hidden");$("detail").classList.remove("hidden");
 renderGameDetail();scrollTo({top:0,behavior:"instant"});
}
function renderGameDetail(){
 const g=state.gamePicked;if(!g)return;
 $("player").textContent=g.game;
 $("matchup").textContent=g.sport+" · "+g.statusText+" · Last snapshot "+when(g.observedAt);
 $("markets").innerHTML="";
 $("bookmark").textContent="—";
 const related=rows().filter(p=>p.gameId===g.gameId||p.game===g.game);
 const normalize=v=>String(v||"").toLowerCase().replace(/[^a-z0-9]/g,"");
 const actualFor=p=>{
  const matches=g.players.filter(x=>x.team===p.team&&normalize(x.player)===normalize(p.player));
  if(matches.length!==1)return null;
  const statKey=g.sport==="NFL"?p.target:p.stat;
  const value=matches[0].stats?.[statKey];
  return typeof value==="number"&&Number.isFinite(value)?value:null;
 };
 const watched=related.map(p=>{
  const actual=actualFor(p),text=p.direction==="MORE"?"OVER":p.direction==="LESS"?"UNDER":"NO AI";
  // A live total crossing the line is not an official win until verified final grading.
  const versus=actual===null?"Actual unavailable":"Actual "+fmt(actual);
  const grade=p.grade==="GRADED"?(p.hit===true?"GRADED HIT":p.hit===false?"GRADED MISS":"GRADED"):g.state==="in"?"LIVE · NOT GRADED":g.state==="stale"?"STALE · NOT GRADED":"PENDING FINAL GRADE";
  return '<button class="pick" data-prop="'+escapeText(m.key(p))+'"><div class="pick-top"><span class="name">'+escapeText(p.player)+" · "+escapeText(p.stat)+'</span><span class="grade">'+escapeText(grade)+'</span></div>'+
   '<div class="context">'+escapeText(p.source)+" · "+escapeText(text)+'</div>'+
   '<div class="stat-grid"><div><small>FROZEN LINE</small><strong>'+fmt(p.line)+'</strong></div><div><small>FROZEN PROJ</small><strong>'+fmt(p.projection)+'</strong></div><div><small>ACTUAL</small><strong>'+fmt(actual)+'</strong></div><span class="chip '+(p.direction==="MORE"?"over":p.direction==="LESS"?"under":"pass")+'">'+escapeText(p.direction||"PASS")+'</span></div>'+
   '<div class="stampband"><span>'+escapeText(versus)+" · Saved "+escapeText(when(p.captured))+'</span><span>Details</span></div></button>';
 }).join("");
 const playerRows=g.players.map(p=>{
  const fields=Object.entries(p.stats||{}).filter(([k,v])=>typeof v==="number"&&Number.isFinite(v))
   .map(([k,v])=>k+" "+fmt(v)).join(" · ");
  return '<div class="box-row"><span>'+escapeText(p.player)+" · "+escapeText(p.team)+'</span><strong>'+escapeText(fields||"No verified stat")+'</strong></div>';
 }).join("");
 const scoreboard=g.awayScore!==null&&g.awayScore!==undefined&&g.homeScore!==null&&g.homeScore!==undefined?
  '<div class="box-row"><span>'+escapeText(g.away)+'</span><strong>'+fmt(g.awayScore)+'</strong></div><div class="box-row"><span>'+escapeText(g.home)+'</span><strong>'+fmt(g.homeScore)+'</strong></div>':
  '<div class="note">Verified score unavailable in this published game feed.</div>';
 $("detail-content").innerHTML='<section class="box"><h2>Scoreboard</h2>'+scoreboard+
 '<div class="note">'+escapeText(g.fresh?"Current observed game snapshot":"Historical or stale snapshot — not live now")+
 ' · '+escapeText(g.statusText)+'. Stats are observations, not verified settlement grades.</div></section>'+
 '<section class="box"><h2>Frozen pregame props ('+related.length+')</h2>'+
 (watched?'<div class="cards">'+watched+'</div>':'<p class="note">No frozen props saved for this game. Its scoreboard and box score remain visible.</p>')+'</section>'+
 '<section class="box"><h2>Full published player box score ('+g.players.length+')</h2>'+
 (playerRows||'<p class="note">No player statistics published for this game.</p>')+'</section>';
 for(const b of $("detail-content").querySelectorAll("[data-prop]"))b.onclick=()=>{
   const p=rows().find(x=>m.key(x)===b.dataset.prop);
   if(p){state.gamePicked=null;state.picked=p;renderDetail()}
 };
}

function open(id){
 const p=rows().find(x=>m.key(x)===id);if(!p)return;
 state.picked=p;$("board").classList.add("hidden");$("detail").classList.remove("hidden");renderDetail();scrollTo({top:0,behavior:"instant"});
}
function renderDetail(){
 const p=state.picked;if(!p)return;
 $("player").textContent=p.player;$("matchup").textContent=p.team+" · "+(p.position?p.position+" · ":"")+p.opponent+" · "+when(p.start)+" · "+p.source;
 const sib=rows().filter(x=>x.playerId===p.playerId&&x.gameId===p.gameId&&x.start===p.start);
 $("markets").innerHTML=sib.map(x=>'<button data-k="'+escapeText(m.key(x))+'" class="'+(x===p?"active":"")+'">'+escapeText(x.stat)+'</button>').join("");
 for(const b of $("markets").querySelectorAll("button"))b.onclick=()=>{state.picked=sib.find(x=>m.key(x)===b.dataset.k);renderDetail()};
 $("bookmark").textContent=state.selected.has(m.key(p))?"♥":"♧";
 const chance=p.chance,chosen=chance!==null&&p.direction!==null;
 let logs="";
 if(Array.isArray(p.logs)&&p.logs.length){
  const vals=[...p.logs].reverse(),max=Math.max(1,p.line,...vals.map(x=>Number(x.actual)||0));
  logs='<div class="chart">'+vals.map(x=>{const v=Number(x.actual)||0;return '<div class="barcol"><b>'+fmt(v)+'</b><div class="bar '+(v<p.line?"low":"")+'" style="height:'+Math.max(5,Math.round(v/max*105))+'px"></div><small>W'+escapeText(x.week)+'</small></div>'}).join("")+'</div>';
 }
 const live=p.live?'<section class="box"><h2>Live tracker · observed</h2><div class="box-row"><span>Actual '+escapeText(p.stat)+'</span><strong>'+fmt(p.live.actual)+'</strong></div><div class="box-row"><span>Frozen projection</span><strong>'+fmt(p.projection)+'</strong></div><div class="box-row"><span>Original line</span><strong>'+fmt(p.line)+'</strong></div><div class="box-row"><span>Game</span><strong>'+escapeText(p.live.gameStatus)+'</strong></div><div class="note">'+escapeText(p.live.source)+' · '+escapeText(when(p.live.observedAt))+'. Observed stats are not verified final grades.</div></section>':'';
 $("detail-content").innerHTML='<section class="box hero"><div class="hero-head"><h2>Dame’s projection</h2><span class="grade">'+escapeText(p.quoteOnly?"LINE ONLY":p.grade==="GRADED"?"GRADED":"FROZEN")+'</span></div><div class="triple"><div><label>LINE</label><strong>'+fmt(p.line)+'</strong></div><div><label>PROJ</label><strong class="neon">'+fmt(p.projection)+'</strong></div><div><label>SIM EST.</label><strong>'+pct(chance)+'</strong></div></div>'+(chosen?'<div class="meter"><div class="meter-fill" style="width:'+Math.round(chance*100)+'%"></div></div><div class="meter-labels"><span>Nah</span><span>Maybe</span><span>Ooh</span><span>Lock</span></div>':'')+'<div class="lean '+(p.direction==="LESS"?"under":p.direction?"":"pass")+'">'+escapeText(p.direction?p.direction+" "+fmt(p.line)+" "+p.stat:"NO VERIFIED LEAN")+(p.direction==="MORE"?" ↑":p.direction==="LESS"?" ↓":"")+'</div><div class="note">'+escapeText(p.chanceSource)+'. This is not an independently validated betting edge. The original saved threshold is never recalculated after tipoff.</div></section>'+
 live+'<section class="box"><div class="hero-head"><h2>Last games</h2><span class="muted tiny">'+(p.form?.games??"—")+' season games</span></div>'+(logs||'<div class="note">A verified individual game-by-game series is not yet available for this stat. No chart is fabricated.</div>')+'<div class="box-row"><span>Season average</span><strong>'+fmt(p.form?.season)+'</strong></div><div class="box-row"><span>Last 5 average</span><strong>'+fmt(p.form?.l5)+'</strong></div><div class="box-row"><span>Last 10 average</span><strong>'+fmt(p.form?.l10)+'</strong></div></section>'+
 '<section class="box"><h2>Matchup</h2>'+(p.injury?'<div class="box-row"><span>Official NBA injury report</span><strong>'+escapeText(p.injury.status)+'</strong></div><div class="note">Report issued '+escapeText(when(p.injury.asOf))+'. This does not modify the frozen pick.</div>':'')+(p.depth?'<div class="box-row"><span>Depth chart</span><strong>'+escapeText(p.depth.role||"Unverified")+(p.depth.rank!==null?" · #"+fmt(p.depth.rank):"")+'</strong></div><div class="box-row"><span>Depth snapshot</span><strong>'+escapeText(p.depth.asOf?when(p.depth.asOf):"Unverified")+'</strong></div><div class="box-row"><span>Snap share, last 3</span><strong>'+(p.depth.snapPct!==null?Math.round(p.depth.snapPct*100)+"%":"—")+'</strong></div>':'')+'<div class="box-row"><span>Opponent</span><strong>'+escapeText(p.opponent||"—")+'</strong></div><div class="box-row"><span>Game</span><strong>'+escapeText(p.game)+'</strong></div><div class="box-row"><span>Positional defense rank</span><strong>Unverified</strong></div><div class="box-row"><span>Saved at</span><strong>'+escapeText(when(p.captured))+'</strong></div></section>'+
 '<section class="box"><h2>Season vs saved line</h2>'+(p.form?.over!==undefined?'<div class="box-row"><span>Over / Under / Push</span><strong>'+[p.form.over,p.form.under,p.form.push].map(x=>x??"—").join(" / ")+'</strong></div><div class="box-row"><span>Last 5 over / under</span><strong>'+[p.form.last5Over,p.form.last5Under].map(x=>x??"—").join(" / ")+'</strong></div><div class="note">Results are from the original NFL source’s recorded line and season games, not a recomputed current-market hit rate.</div>':'<div class="note">Original line-specific seasonal outcomes unavailable in this verified feed.</div>')+'</section>'+ '<section class="box"><h2>Original research dashboards</h2><div class="note">The original model, matchup, injury, minutes, and grading research remains accessible.</div><a href="'+(p.sport==="NBA"?"../index.html":"../nfl/index.html")+'" class="smallbtn" style="display:block;text-align:center;margin-top:12px;color:white;text-decoration:none">Open full '+escapeText(p.sport)+' dashboard</a></section>'+'<section class="take"><strong>Dame’s Take</strong><p>'+escapeText(window.DamesTake.forSlate([...state.nba,...state.nfl]).get([p.sport,p.start,p.gameId||p.game,p.playerId||p.player,p.stat,p.line,p.captured,p.source||p.provider||""].join("|"))||"No verified model lean for this line.")+'</p></section>'+
 '<section class="box"><h2>Automatic grading</h2><div class="box-row"><span>Status</span><strong>'+escapeText(p.grade)+'</strong></div><div class="box-row"><span>Actual</span><strong>'+fmt(p.actual)+'</strong></div><div class="box-row"><span>Verified source</span><strong>'+escapeText(p.gradeSource||"Pending")+'</strong></div><div class="note">Pending results do not count as losses. NFL settled market-level grading will appear after the bot publishes verified individual result records.</div></section>';
}
function back(){state.gamePicked=null;state.picked=null;$("detail").classList.add("hidden");$("board").classList.remove("hidden");render()}
$("back").onclick=back;$("bookmark").onclick=()=>{const p=state.picked;if(!p)return;const k=m.key(p);state.selected.has(k)?state.selected.delete(k):state.selected.add(k);saveBookmarks();renderDetail()};
$("refresh").onclick=refresh;$("query").oninput=render;
for(const b of document.querySelectorAll("[data-league]"))b.onclick=()=>{state.league=b.dataset.league;document.querySelectorAll("[data-league]").forEach(x=>x.classList.toggle("active",x===b));back()};
for(const b of document.querySelectorAll("[data-view]"))b.onclick=()=>{state.mode=b.dataset.view;document.querySelectorAll("[data-view]").forEach(x=>x.classList.toggle("active",x===b));back()};
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh().catch(()=>{})});
setInterval(()=>{if(!document.hidden)refresh().catch(()=>{})},120000);
$("date").textContent=new Date().toLocaleDateString([],{weekday:"long",month:"short",day:"numeric"});refresh().catch(e=>{$("status").textContent="Cannot load published bot outputs: "+e.message;state.loading=false});
</script></body></html>
